# memories path items — referenced from ../openapi.yaml (component refs resolve
# back through the root document). One domain per file; see the repo layout
# note in openapi.yaml info.description.

api-v1-team_id-memories:
  post:
    summary: Create new memory
    description: Creates a new memory for the authenticated user within the specified team
    operationId: createMemory
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreateMemoryRequest'
    responses:
      '201':
        description: Memory created successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Memory'
      '400':
        description: Invalid request data or validation error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

  get:
    summary: List memories
    description: Retrieves all memories for the authenticated user within the specified team with optional filtering
    operationId: listMemories
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
          format: uuid
      - name: project_id
        in: query
        description: Filter memories by project ID
        schema:
          type: string
          format: uuid
      - name: search
        in: query
        description: Search in memory text
        schema:
          type: string
      - name: metadata
        in: query
        description: >-
          Filter by metadata as a JSON object of key to array of string values.
          Keys are combined with AND, values within a key with OR, and an empty
          array means "the key exists". Values match metadata stored as a scalar
          or as an array, and numeric/boolean values are matched by their string
          form. At most 10 keys, 25 values per key, key length 255, value length
          512. Example: {"env":["prod","staging"],"team":["core"]}
        schema:
          type: string
        example: '{"env":["prod","staging"]}'
      - name: status
        in: query
        description: >-
          Filter by lifecycle status. When omitted, archived memories are hidden
          (active and draft are returned); an explicit value returns only that
          status. Returns 400 for unknown values.
        schema:
          type: string
          enum: [active, draft, archived]
      - name: sort_by
        in: query
        description: "Field to sort results by. Allowed: text, updated_at, created_at. Returns 400 for unknown values."
        schema:
          type: string
          enum: [text, updated_at, created_at]
      - name: sort_order
        in: query
        description: Sort direction (asc or desc, default desc)
        schema:
          type: string
          enum: [asc, desc]
          default: desc
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Items per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: Memories retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/MemoryListResponse'
      '400':
        description: >-
          Invalid query parameter (for example an unknown `status` or `sort_by`
          value, or a malformed `metadata` filter)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories


api-v1-team_id-memories-id:
  get:
    summary: Get memory by ID
    description: Retrieves a specific memory by its ID within the specified team
    operationId: getMemory
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Memory retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Memory'
      '404':
        description: Memory not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

  put:
    summary: Update memory by ID
    description: Updates a specific memory by its ID within the specified team
    operationId: updateMemory
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateMemoryRequest'
    responses:
      '200':
        description: Memory updated successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Memory'
      '400':
        description: Invalid request data or validation error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Memory not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

  delete:
    summary: Delete memory by ID
    description: Deletes a specific memory by its ID within the specified team
    operationId: deleteMemory
    parameters:
      - name: team_id
        in: path
        required: true
        description: Team ID
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
    responses:
      '204':
        description: Memory deleted successfully
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Memory not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

api-v1-team_id-memories-id-versions:
  get:
    summary: List memory content versions
    description: Returns the content-version history (newest first) for a memory
    operationId: listMemoryVersions
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Team identifier
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
    responses:
      '200':
        description: Memory versions retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/MemoryVersionListResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden (not a team member)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Memory not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

api-v1-team_id-memories-id-versions-version_number:
  get:
    summary: Get a specific memory content version
    description: Returns a single content-version snapshot of a memory by version number
    operationId: getMemoryVersion
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Team identifier
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
      - name: version_number
        in: path
        required: true
        description: Version number
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Memory version retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ContentVersion'
      '400':
        description: Invalid version_number
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden (not a team member)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Memory or version not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories

api-v1-team_id-memories-id-versions-version_number-restore:
  post:
    summary: Restore a memory to a content version
    description: >-
      Restores the memory's text to the given version. The pre-restore text is
      snapshotted as a new version. Returns the updated memory.
    operationId: restoreMemoryVersion
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Team identifier
      - name: id
        in: path
        required: true
        description: Memory ID
        schema:
          type: string
      - name: version_number
        in: path
        required: true
        description: Version number to restore
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Memory restored successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/Memory'
      '400':
        description: Invalid version_number
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Forbidden (not a team member)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Memory or version not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Memories
