# team-email-provider path items — referenced from ../openapi.yaml (component refs
# resolve back through the root document). One domain per file; see the repo
# layout note in openapi.yaml info.description.
#
# Each item is mounted under BOTH prefixes, matching the provider convention:
#   /api/v1/{team_id}/email-provider           (for CLI and API clients)
#   /api/v1/{team_id}/settings/email-provider  (the prefix the SPA calls)
#
# This is a SINGLETON sub-resource, not a collection: a team has at most one
# email provider, enforced by a unique constraint on the table. So there is no
# list operation, no id path parameter, and the resource is addressed by the
# team alone.
#
# The credential is never returned by any operation here. It exists only on
# request bodies; reads expose has_credential instead.

api-v1-team-email-provider:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team that owns the email provider configuration.
      schema:
        type: string
        format: uuid

  get:
    summary: Get the team's effective email configuration
    description: |
      Returns the email configuration in force for the team.

      This **always returns 200**, never 404. A team without its own provider is
      inheriting the instance provider, which is a valid state the caller needs
      described — it reports `configured: false`, `source: "instance"` and the
      instance's `effective_from_address`.

      Readable by any team member: the response carries no credential, and
      `effective_from_address` is already in the From: header of every mail those
      members receive.
    operationId: getTeamEmailProvider
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: The email configuration in force for the team
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Settings

  put:
    summary: Configure the team's email provider
    description: |
      Creates or replaces the team's email provider. Idempotent: the same body
      applied twice leaves one row and returns 200 both times.

      `secret` is required the first time. On a team that already has a provider,
      omit it to keep the stored credential; sending an empty string is rejected
      rather than treated as "clear", because a provider without a credential
      cannot send and silently disabling a team's mail is worse than an error.

      A team-supplied `settings.smtp.host` or `settings.mailgun.base_url` that
      resolves into a reserved network range is rejected before anything is
      stored or dialled.
    operationId: upsertTeamEmailProvider
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpsertTeamEmailProviderRequest'
    responses:
      '200':
        description: The stored configuration
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderResponse'
      '400':
        description: >-
          Malformed JSON body (`BAD_REQUEST`), or an invalid configuration
          (`TEAM_EMAIL_PROVIDER_VALIDATION_FAILED` with `validation_errors`) —
          an unknown provider type, a missing or mismatched settings block, an
          empty `secret`, a malformed address, or a destination that is not
          allowed
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - configuring the team's email provider requires team
          owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Settings

  delete:
    summary: Remove the team's email provider
    description: |
      Deletes the team's provider, so the team reverts to the instance provider.
      A subsequent GET reports `source: "instance"`.

      Deleting when the team has no provider of its own returns 409 rather than
      404: the endpoint exists and the team is addressable, it is simply not in a
      state that can serve the request.
    operationId: deleteTeamEmailProvider
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '204':
        description: Provider removed; the team now uses the instance provider
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - configuring the team's email provider requires team
          owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: >-
          The team has no email provider of its own
          (`TEAM_EMAIL_PROVIDER_NOT_CONFIGURED`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Settings

api-v1-team-email-provider-test:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team that owns the email provider configuration.
      schema:
        type: string
        format: uuid

  post:
    summary: Send a test email with a candidate configuration
    description: |
      Sends a real message using the configuration **in this request body**, not
      the stored one, so credentials can be verified before they are saved. The
      body therefore always requires `secret`.

      The recipient is **always the acting user's own account email**. It cannot
      be supplied by the caller, so this endpoint cannot be used to send mail to
      third parties.

      A failed send is reported in the body with `is_valid: false` and a fixed
      `details.error_details` category, not as an HTTP error. A 500 means an
      internal fault, not a bad configuration.

      Authorized as a mutation, because it makes the server perform an outbound
      send with team-supplied credentials.
    operationId: testTeamEmailProvider
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpsertTeamEmailProviderRequest'
    responses:
      '200':
        description: Test outcome (successful or not)
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderTestResponse'
      '400':
        description: >-
          Malformed JSON body (`BAD_REQUEST`), or an invalid configuration
          (`TEAM_EMAIL_PROVIDER_VALIDATION_FAILED` with `validation_errors`).
          `secret` is always required here, since there is no stored credential
          to fall back on
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - testing the team's email provider requires team
          owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Settings

# ---------------------------------------------------------------------------
# Settings-prefix aliases.
#
# The operations below are the SAME endpoints as above, served on the second
# mount (see githubAppConfigMountPrefixes in internal/server/server.go). They
# are spelled out again rather than $ref'd because `operationId` must be unique
# across the whole document: mounting one path item at two URLs duplicated every
# id, which is illegal OpenAPI and broke every api-client publish (#573).
#
# Keep these byte-identical to their canonical counterparts apart from the
# operationId suffix — TestSettingsAliasPathItemsMatchCanonical enforces it.
