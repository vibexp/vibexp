# github-app-config path items — referenced from ../openapi.yaml (component refs
# resolve back through the root document). One domain per file; see the repo
# layout note in openapi.yaml info.description.
#
# Each item is mounted under BOTH prefixes, matching the provider convention:
#   /api/v1/{team_id}/integrations/github/app   (the integrations surface)
#   /api/v1/{team_id}/settings/github-app       (the prefix the SPA calls)
#
# Secrets are never returned by any operation here. private_key and
# client_secret exist only on request bodies; webhook_secret is disclosed
# exactly once, by create, via a distinct response schema.

api-v1-github-app:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team that owns the GitHub App registration.
      schema:
        type: string
        format: uuid

  get:
    summary: Get the team's GitHub App configuration
    description: |
      Returns the team's GitHub App registration. Secrets are never included —
      the response carries `has_private_key`, `has_client_secret` and
      `has_webhook_secret` booleans plus the `webhook_url` to paste into GitHub.
    operationId: getGitHubAppConfig
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: The team's GitHub App configuration
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/GitHubAppConfigResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: The team has no GitHub App configured (`GITHUB_APP_NOT_CONFIGURED`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration

  post:
    summary: Register the team's GitHub App
    description: |
      Registers a GitHub App for the team. The `private_key` and `client_secret`
      are encrypted at rest and are never returned.

      The webhook secret is **generated by the server**, not supplied by the
      caller, and is returned in this response **once only**. It cannot be read
      back afterwards; a lost secret must be rotated. Returns 200 (not 201),
      matching the provider convention.
    operationId: createGitHubAppConfig
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CreateGitHubAppConfigRequest'
    responses:
      '200':
        description: >-
          GitHub App registered. This is the only response that carries the
          plaintext `webhook_secret`.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CreateGitHubAppConfigResponse'
      '400':
        description: >-
          Malformed JSON body (`BAD_REQUEST`), missing required fields, or an
          unparseable private key (`VALIDATION_FAILED` with `validation_errors`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - managing the GitHub App requires team owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: >-
          The team already has an App configured (`GITHUB_APP_CONFIG_EXISTS`), or
          another team already registered this `app_id`
          (`GITHUB_APP_ALREADY_REGISTERED`) — a GitHub App has a single webhook
          URL, so it cannot be shared across teams
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration

  put:
    summary: Update the team's GitHub App configuration
    description: |
      Updates the team's GitHub App registration. Every field is optional: an
      omitted field keeps the stored value, and an explicitly empty value is
      rejected rather than clearing the stored one. Secrets are never returned.

      The webhook secret cannot be set here — it is server-generated and
      replaced through rotation.
    operationId: updateGitHubAppConfig
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateGitHubAppConfigRequest'
    responses:
      '200':
        description: GitHub App configuration updated
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/GitHubAppConfigResponse'
      '400':
        description: >-
          Malformed JSON body (`BAD_REQUEST`), an explicitly empty field, or an
          unparseable private key (`VALIDATION_FAILED` with `validation_errors`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - managing the GitHub App requires team owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: >-
          The team has no GitHub App configured (`GITHUB_APP_NOT_CONFIGURED`),
          another team already registered this `app_id`
          (`GITHUB_APP_ALREADY_REGISTERED`), or the configuration was modified
          concurrently (`GITHUB_APP_CONFIG_CONFLICT`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration

  delete:
    summary: Delete the team's GitHub App configuration
    description: |
      Removes the team's GitHub App registration. This also disconnects every
      installation made through that App, since installations are meaningful
      only in the context of the App they were installed from.
    operationId: deleteGitHubAppConfig
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '204':
        description: GitHub App configuration deleted
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - managing the GitHub App requires team owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: The team has no GitHub App configured (`GITHUB_APP_NOT_CONFIGURED`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration

api-v1-github-app-validate:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team that owns the GitHub App registration.
      schema:
        type: string
        format: uuid

  post:
    summary: Validate the team's GitHub App configuration
    description: |
      Probes GitHub with the stored credentials and reports whether they work.
      This proves the private key belongs to the configured `app_id`, that the
      stored slug matches what GitHub reports (a typo there would otherwise
      produce a broken install URL), and which permissions the App holds.

      A failed probe is reported in the body with `is_valid: false`, not as an
      HTTP error. `error_details` is always one of a fixed set of categories;
      the real upstream error is logged server-side only.

      Authorized as a mutation, because it makes the server perform an
      authenticated outbound call on the team's behalf.
    operationId: validateGitHubAppConfig
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: Validation result (successful or not)
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ValidateGitHubAppConfigResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - managing the GitHub App requires team owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: The team has no GitHub App configured (`GITHUB_APP_NOT_CONFIGURED`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration

api-v1-github-app-rotate-webhook-token:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team that owns the GitHub App registration.
      schema:
        type: string
        format: uuid

  post:
    summary: Rotate the GitHub App webhook token
    description: |
      Mints a new opaque routing token, which changes the App's `webhook_url`.
      The previous URL stops resolving immediately, so the new one must be
      pasted into the App's settings on GitHub or deliveries will stop.

      This rotates the routing token only, not the webhook secret.
    operationId: rotateGitHubAppWebhookToken
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: Token rotated; the response carries the new `webhook_url`
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/GitHubAppConfigResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Forbidden - managing the GitHub App requires team owner/admin (`FORBIDDEN`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: The team has no GitHub App configured (`GITHUB_APP_NOT_CONFIGURED`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - GitHub App Configuration
