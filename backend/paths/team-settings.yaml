# Team settings path items (epic #487) — referenced from ../openapi.yaml.
#
# The first team-level settings SINGLETON in VibeXP. The neighbouring
# /settings/embedding-providers and /settings/model-providers surfaces are
# collections of rows; this one is a single optional profile per team, so it is
# modelled as GET / PUT (upsert) / DELETE (revert to instance defaults) on one
# resource rather than as a collection.

api-v1-team_id-settings-search:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team identifier
      schema:
        type: string
        format: uuid

  get:
    summary: Get the team's search ranking settings
    description: >
      Returns the search ranking settings in effect for the team, together with
      their provenance (`source`), the instance defaults, and the instance-owned
      candidate cap. A team that has never overridden the settings gets
      `source: instance` and the deployment defaults. Any member of the team may
      read them.
    operationId: getTeamSearchSettings
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: Settings retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamSearchSettings'
      '400':
        description: Invalid team_id
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Caller is not a member of the team
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to read the team's search settings
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - TeamSettings

  put:
    summary: Override the team's search ranking settings
    description: >
      Stores a complete ranking profile for the team, replacing any previous one.
      There is no partial update — the whole profile is required, and the team
      either owns all of it or (after a reset) none of it. Requires the
      `team.settings.update` permission, held by owners and admins.
    operationId: updateTeamSearchSettings
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/UpdateTeamSearchSettingsRequest'
    responses:
      '200':
        description: Settings stored successfully; the response reports source `team`
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamSearchSettings'
      '400':
        description: >
          Invalid ranking parameters — a negative weight, all weights zero, or a
          half-life outside (0, 36500]
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Caller's role does not grant team.settings.update
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to store the team's search settings
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - TeamSettings

  delete:
    summary: Reset the team's search ranking settings to the instance defaults
    description: >
      Drops the team's stored profile so it inherits the deployment defaults
      again. Resetting a team that has no override is a no-op and still returns
      204. Requires the `team.settings.update` permission.
    operationId: resetTeamSearchSettings
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '204':
        description: Settings reset (no content); the team now inherits the instance defaults
      '400':
        description: Invalid team_id
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Caller's role does not grant team.settings.update
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to reset the team's search settings
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - TeamSettings

# The read side of the settings audit log (issue #832, epic #827).
#
# Unlike the search-settings singleton above, and unlike the neighbouring
# freshness audit, this read is NOT open to any member: it names who copied a
# credential-bearing configuration in from where, so it is gated on
# team.settings.update — the same owner/admin gate as the other team settings
# writes — and that check lives in the service, not in this document.
#
# The operationId deliberately does not end in `Settings`: the settings-alias
# gates (TestSettingsAliasPathItemsMatchCanonical,
# TestEverySettingsSuffixedPathIsRegistered) key on that suffix, and this path
# has no canonical non-/settings/ twin to be aliased to.
api-v1-team_id-settings-audit:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team identifier
      schema:
        type: string
        format: uuid

  get:
    summary: List the team's settings audit log
    description: >
      Every configuration copied into this team from another team, newest first
      and paginated, with the actor and source-team names resolved server-side.
      Requires the team.settings.update permission (owner or admin). The list is
      empty, never null, past the last page.
    operationId: listTeamSettingsAudit
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: page
        in: query
        required: false
        description: >
          Page number (1-based). The upper bound is not a storage limit — it
          keeps page * limit inside the range the offset arithmetic can
          represent, so an absurd page is rejected rather than silently
          wrapping around to the first one.
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - name: limit
        in: query
        required: false
        description: Entries per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Audit log retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/TeamSettingsAuditListResponse'
      '400':
        description: Invalid team_id or query parameter
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Authentication required
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Caller's role does not grant team.settings.update
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to list the team's settings audit log
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - TeamSettings
