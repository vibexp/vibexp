# invitations path items — referenced from ../openapi.yaml (component refs resolve
# back through the root document). One domain per file; see the repo layout
# note in openapi.yaml info.description.

api-v1-invitations-token:
  get:
    summary: Get invitation details by token
    description: |
      Returns enriched invitation details (team name, inviter info, role, status, expiry)
      for the email-link landing page so the user can review the invitation before
      accepting or rejecting it.

      Returns honest, distinct HTTP statuses for the lifecycle:
      - `200` — valid pending invitation
      - `404` — unknown / not found token
      - `410 Gone` — invitation pending but past `expires_at`
      - `409 Conflict` — invitation already accepted, rejected, or revoked
    operationId: getInvitationByToken
    security:
      - BearerAuth: []
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque invitation token from the invitation email link
        schema:
          type: string
    responses:
      '200':
        description: Invitation details retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/InvitationDetailsResponse'
      '401':
        description: Authentication required
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Invitation not found for the given token
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Invitation has already been accepted, rejected, or revoked
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '410':
        description: Invitation has expired
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Team Invitations

api-v1-invitations-pending:
  get:
    summary: Get pending invitations for the current user
    description: |
      Returns the current user's pending team invitations (matched by the user's
      email), enriched with team name and inviter details where available. The
      response is not actually paginated: all pending invitations are returned and
      `page`/`page_size` are fixed at `1`/`20`.
    operationId: getPendingInvitations
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: Pending invitations retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/PendingInvitationsListResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Team Invitations

api-v1-invitations-token-accept:
  post:
    summary: Accept a team invitation
    description: |
      Accepts a pending team invitation by token and adds the current user to the
      team. The invitation must have been sent to the authenticated user's email
      address.
    operationId: acceptInvitation
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque invitation token from the invitation email link
        schema:
          type: string
    responses:
      '200':
        description: Invitation accepted successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AcceptInvitationResponse'
      '400':
        description: Invitation is not pending
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Invitation was sent to a different email address
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Invalid invitation token
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Already a member of this team
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '410':
        description: Invitation has expired
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error (including invitation accepted but team details could not be fetched)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Team Invitations

api-v1-invitations-token-reject:
  post:
    summary: Reject a team invitation
    description: Rejects a pending team invitation by token. Only the invited user can reject it.
    operationId: rejectInvitation
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque invitation token from the invitation email link
        schema:
          type: string
    responses:
      '204':
        description: Invitation rejected successfully
      '400':
        description: Invitation is not pending
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Not authorized to reject this invitation
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Invalid invitation token
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Team Invitations

api-v1-invitations-token-preview:
  get:
    summary: Preview an invitation without signing in
    description: |
      Tells the holder of an invitation link what the invitation is, before
      they have signed in or have an account at all: the team, who sent it,
      the invited email, the role, when it expires, whether an account already
      has that email, and whether an account can be created with a password
      through the link.

      Public. It returns no identifier and no inviter email, and nothing that
      the authenticated `GET /api/v1/invitations/{token}` does not.

      A link that cannot be used returns one and the same 404
      (`invitation_invalid`) whether the token is unknown or the invitation has
      expired or was revoked, accepted or rejected. Rate-limited per client IP.
    operationId: previewInvitation
    security: []  # Public: authenticated by the token in the path
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque invitation token from the invitation link
        schema:
          type: string
    responses:
      '200':
        description: The invitation behind the link
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/InvitationPreview'
      '400':
        description: The token in the path is not validly percent-encoded
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: The invitation link is not valid (`invitation_invalid`), for every reason alike
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Invitation Registration

api-v1-invitations-token-register:
  post:
    summary: Create an account with a password through an invitation
    description: |
      For a person who has an invitation link and no account. Creates the
      account for the invited email with the given password, provisions its
      private workspace, joins the team with the invited role and signs the
      person in by setting the session cookie (`vx_session`), in one request.

      Available only while an instance admin has switched password login on;
      otherwise it returns 404. Refused, with nothing changed, when:

      - the link cannot be used: 404 `invitation_invalid`, the same response
        for an unknown token and an expired, revoked, accepted or rejected
        invitation;
      - an account already has the invited email: 409 `account_exists`. That
        person signs in and accepts the invitation instead;
      - an active access allowlist does not admit the invited email: 403
        `access_restricted`;
      - the password breaks the password policy: 400 with one
        `validation_errors` entry per rule on `password`.

      The new account's email is **not** marked verified: an invitation link
      can be copied, so using it does not prove the mailbox. If the same
      address later signs in through an identity provider that verifies it,
      that sign-in takes the account over and this password is removed.

      The body must be sent as `application/json`; any other `Content-Type` is
      rejected with 400. Rate-limited per client IP.
    operationId: registerWithInvitation
    security: []  # Public: authenticated by the token in the path
    parameters:
      - name: token
        in: path
        required: true
        description: Opaque invitation token from the invitation link
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/InvitationRegisterRequest'
    responses:
      '200':
        description: Account created and signed in — session cookie set
        headers:
          Set-Cookie:
            description: Encrypted, HttpOnly, SameSite=Lax session cookie (`vx_session`)
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/InvitationRegistration'
      '400':
        description: |
          The password breaks the password policy (`validation_errors` on
          `password`), the body is malformed, carries an unknown field or a
          value longer than the schema allows, the `Content-Type` is not
          `application/json`, or the token in the path is not validly
          percent-encoded. Nothing was changed
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: The invited email is not admitted by the access allowlist (`access_restricted`); nothing was changed
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: |
          The invitation link is not valid (`invitation_invalid`), for every
          reason alike, or password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: An account already exists for the invited email (`account_exists`); sign in instead. Nothing was changed
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Invitation Registration
