# auth path items — referenced from ../openapi.yaml (component refs resolve
# back through the root document). One domain per file; see the repo layout
# note in openapi.yaml info.description.

api-v1-auth-login:
  get:
    summary: Initiate login with an identity provider
    description: |
      Selects an enabled identity provider, generates a CSRF state, stores the
      (state, provider) pair in a signed `vx_state` cookie, and returns the
      provider's authorization URL. The client should redirect the user to this
      URL to begin the authentication flow.

      The provider is chosen with the `provider` query parameter, whose value is
      the slug of one of the deployment's enabled providers (e.g. `google`,
      `github`, `oidc`, or an admin-chosen slug such as `corp-sso`). When exactly one provider is enabled the parameter may be omitted
      and that provider is used. When several are enabled the parameter is
      required; an unknown or disabled value is rejected (no silent default).
    operationId: login
    security: []  # No authentication required
    parameters:
      - name: provider
        in: query
        required: false
        description: |
          Slug of the identity provider to use (the `name` returned by
          GET /api/v1/auth/providers). Optional when a single provider is
          enabled; required when more than one is enabled.
        schema:
          type: string
          example: "google"
    responses:
      '200':
        description: Authorization URL generated successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LoginResponse'
      '400':
        description: |
          The `provider` value is unknown/disabled, or it was omitted while
          multiple providers are enabled.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: |
          No identity provider is enabled (web login unavailable), or the
          enabled providers could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication

api-v1-auth-providers:
  get:
    summary: List enabled login providers
    description: |
      Returns the login providers enabled on this instance, each with its slug
      as `name` (the value to pass as `?provider=` to
      `GET /api/v1/auth/login`), a human-readable `display_name` for the login
      UI and its `type`. The login screen uses this to render a provider picker
      instead of hardcoding the provider list. The list is in the
      admin-defined sort order, reflects provider changes with no restart, and
      may be empty when no provider is enabled.

      The `password` object says whether email and password sign-in is switched
      on, and whether a forgotten password is reset by an emailed link or by
      asking an administrator.
    operationId: listAuthProviders
    security: []  # No authentication required
    responses:
      '200':
        description: Enabled providers listed successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ProvidersResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The enabled providers or the authentication policy could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication

api-v1-auth-callback:
  get:
    summary: Handle the identity-provider OAuth callback
    description: |
      Validates the CSRF `vx_state` cookie, recovers the provider bound to it,
      exchanges the authorization code with that provider, looks up or creates
      the user, writes a session cookie, and issues a 302 redirect to the
      frontend home page. This endpoint is called by the browser after the user
      authenticates with the upstream provider — it does not return a JSON body
      on success.
    operationId: authCallback
    security: []  # No authentication required
    parameters:
      - name: code
        in: query
        required: true
        description: Authorization code returned by the identity provider after user authentication
        schema:
          type: string
          example: "01ABCDEF1234567890"
      - name: state
        in: query
        required: false
        description: CSRF state value that must match the signed `vx_state` cookie
        schema:
          type: string
          example: "a3f8b2c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1"
    responses:
      '302':
        description: |
          Redirects the browser to the frontend. On success, to the home page
          (a session cookie is set). When sign-in is denied by the access
          allowlist, to `/auth/callback?error=access_restricted` with no session
          cookie set. When the provider the flow started with was disabled or
          removed before the callback, to
          `/auth/callback?error=provider_unavailable`. When the sign-in has no
          identity yet, an account with the same email exists, and the provider
          did not verify that email, to
          `/auth/callback?error=email_not_verified`: the sign-in is not linked
          to the account and nothing is written. (A provider-verified email is
          linked to the existing account and signs in normally.) When that
          account's email was never verified and the account already has a
          sign-in method of its own, to
          `/auth/callback?error=existing_sign_in_required`: it must be signed in
          to with that method first, and nothing is written. When the sign-in
          would create a new account, the instance's registration mode is
          `invite_only`, and the provider-verified email has no pending
          invitation (and is not a root instance admin), to
          `/auth/callback?error=registration_closed`: no account is created.
          When the account is suspended, to
          `/auth/callback?error=account_suspended`.
        headers:
          Location:
            description: |
              Frontend URL — the home page on success (e.g. https://app.example.com/),
              or /auth/callback?error=<code> when the sign-in is refused, where
              <code> is one of access_restricted, provider_unavailable,
              email_not_verified, existing_sign_in_required,
              registration_closed or account_suspended.
            schema:
              type: string
              format: uri
          Set-Cookie:
            description: Encrypted session cookie (`vx_session`) containing the identity-provider access token
            schema:
              type: string
      '400':
        description: Authorization code is missing
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Invalid or expired CSRF state cookie
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Identity provider authentication failed or session could not be created
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The enabled providers could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication

api-v1-auth-logout:
  post:
    summary: Log out current user
    description: |
      Clears the session cookie and returns a JSON confirmation. After calling this
      endpoint the client should discard any cached user state and redirect to the
      login page.
    operationId: logout
    security: []  # Cookie-based; no bearer token needed
    responses:
      '200':
        description: Logged out successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/LogoutResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication

api-v1-auth-password-login:
  post:
    summary: Sign in with email and password
    description: |
      Signs a user in with their email address and password and sets the
      session cookie, the same `vx_session` a provider sign-in sets.

      Available only while an instance admin has switched password login on
      (`password.enabled` on `GET /api/v1/auth/providers`); otherwise it
      returns 404.

      An unknown email, a wrong password, an account with no password, a
      disabled password and a temporarily locked account all return the same
      401, so the response does not reveal which accounts exist. After several
      failed attempts an account is locked for a short time that grows to at
      most 15 minutes; a successful sign-in resets it. Rate-limited per client
      IP as well.

      The body must be sent as `application/json`. Any other `Content-Type` is
      rejected with 400, so an HTML form on another site cannot sign a
      visitor's browser in.
    operationId: passwordLogin
    security: []  # Authenticated by the credentials in the body
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/PasswordLoginRequest'
    responses:
      '200':
        description: Signed in — session cookie set, user object returned
        headers:
          Set-Cookie:
            description: Encrypted, HttpOnly, SameSite=Lax session cookie (`vx_session`)
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/User'
      '400':
        description: |
          Malformed request body, a missing email or password, an email or
          password longer than the schema allows, or a request whose
          `Content-Type` is not `application/json`.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: |
          The email or password is not valid (`AUTH_INVALID`, the same response
          for every such case, including a temporarily locked account), or the
          password was correct and the account is suspended.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: |
          Sign-in denied by the access allowlist. The response `code` is the
          stable string `access_restricted`.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many sign-in requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: The sign-in could not be completed
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The authentication policy could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Password Authentication

api-v1-auth-password-token-preview:
  post:
    summary: Look up a one-time account link
    description: |
      Returns what a one-time account link does (set a first password, or
      reset a forgotten one) and whose account it acts on, so the page behind
      the link can show the right form. It changes nothing and does not use
      the link up.

      It is a POST so that the token travels in the body and reaches no access
      log, proxy or `Referer` header. A link carries its token in the URL
      fragment (`/account/setup#token=...`, `/account/reset#token=...`), which
      a browser never sends to a server.

      The token is sent in the body, never in the URL, and the body must be
      `application/json`; any other `Content-Type` is rejected with 400.
      Available only while password login is switched on; otherwise 404.
      Rate-limited per client IP.
    operationId: previewAccountLink
    security: []  # Authenticated by the one-time token in the body
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AccountLinkPreviewRequest'
    responses:
      '200':
        description: The link is valid
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AccountLinkPreview'
      '400':
        description: |
          Malformed request body, a missing or oversized token, or a request
          whose `Content-Type` is not `application/json`.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: |
          The link is not valid (`AUTH_INVALID`). The response is the same for
          a token that never existed, has expired, was already used, was replaced
          by a newer link, belongs to the other kind of link, or whose account
          is suspended or gone.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: |
          The link is valid, but the access allowlist does not admit the
          account's email address, so completing it would be refused too. The
          response `code` is the stable string `access_restricted`.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The authentication policy or the database could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Password Authentication

api-v1-auth-password-setup:
  post:
    summary: Set the first password of an account from a setup link
    description: |
      Completes a setup link: sets the account's password, optionally its
      display name, and signs the person in by setting the session cookie.

      A setup link is issued when an administrator creates or invites a
      person. It works once and for 7 days. Completing it ends every other
      browser session of the account. If the link was emailed to the account's
      address, completing it also marks that address verified; a link an
      administrator copied does not.

      The token is sent in the body, never in the URL, and the body must be
      `application/json`; any other `Content-Type` is rejected with 400.
      Available only while password login is switched on; otherwise 404.
      Rate-limited per client IP.
    operationId: completeAccountSetup
    security: []  # Authenticated by the one-time token in the body
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CompleteAccountSetupRequest'
    responses:
      '200':
        description: Password set and signed in — session cookie set, user object returned
        headers:
          Set-Cookie:
            description: Encrypted, HttpOnly, SameSite=Lax session cookie (`vx_session`)
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/User'
      '400':
        description: |
          Malformed request body, a missing or oversized field, a request whose
          `Content-Type` is not `application/json`, or a password that does not
          meet the password policy. For the policy the `code` is
          `VALIDATION_FAILED` and `validation_errors` holds one entry per
          broken rule on the field `password`, with the code `too_short`,
          `too_long`, `common` or `matches_email`. The link stays usable after
          a 400.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: |
          The link is not valid (`AUTH_INVALID`). The response is the same for
          a token that never existed, has expired, was already used, was replaced
          by a newer link, belongs to the other kind of link, or whose account
          is suspended or gone.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: |
          Denied by the access allowlist: the account's email address is not
          admitted. The response `code` is the stable string `access_restricted`.
          The link stays usable.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: |
          The request failed after the link was used up: the password WAS
          changed and the account's other sessions were ended, but the
          request could not be finished (for a reset, the requested revocation
          of API access did not happen). The link no longer works and trying
          again cannot succeed. Sign in with the new password.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The authentication policy, the allowlist or the database could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Password Authentication

api-v1-auth-password-reset:
  post:
    summary: Set a new password from a reset link
    description: |
      Completes a reset link: replaces the account's password and signs the
      person in by setting the session cookie.

      A reset link works once: for 1 hour when it was emailed, for 24 hours
      when an administrator generated it. Completing it ends every other
      browser session of the account. API keys and MCP and OAuth grants are
      kept unless `revoke_api_access` is true. If the link was emailed to the
      account's address, completing it also marks that address verified.

      The token is sent in the body, never in the URL, and the body must be
      `application/json`; any other `Content-Type` is rejected with 400.
      Available only while password login is switched on; otherwise 404.
      Rate-limited per client IP.
    operationId: completeAccountReset
    security: []  # Authenticated by the one-time token in the body
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CompleteAccountResetRequest'
    responses:
      '200':
        description: Password replaced and signed in — session cookie set, user object returned
        headers:
          Set-Cookie:
            description: Encrypted, HttpOnly, SameSite=Lax session cookie (`vx_session`)
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/User'
      '400':
        description: |
          Malformed request body, a missing or oversized field, a request whose
          `Content-Type` is not `application/json`, or a password that does not
          meet the password policy. For the policy the `code` is
          `VALIDATION_FAILED` and `validation_errors` holds one entry per
          broken rule on the field `password`, with the code `too_short`,
          `too_long`, `common` or `matches_email`. The link stays usable after
          a 400.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: |
          The link is not valid (`AUTH_INVALID`). The response is the same for
          a token that never existed, has expired, was already used, was replaced
          by a newer link, belongs to the other kind of link, or whose account
          is suspended or gone.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: |
          Denied by the access allowlist: the account's email address is not
          admitted. The response `code` is the stable string `access_restricted`.
          The link stays usable.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: |
          The request failed after the link was used up: the password WAS
          changed and the account's other sessions were ended, but the
          request could not be finished (for a reset, the requested revocation
          of API access did not happen). The link no longer works and trying
          again cannot succeed. Sign in with the new password.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The authentication policy, the allowlist or the database could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Password Authentication

api-v1-auth-password-forgot:
  post:
    summary: Ask for a password reset email
    description: |
      Asks for a link to reset a forgotten password to be emailed to an
      address.

      The answer is always the same 202, whether or not the address belongs
      to an account, and it is given before the address is looked up, so
      neither the response nor the time it takes says anything about the
      address. If the address belongs to an account that can sign in here, a
      link valid for 1 hour is emailed to it. The same link also lets a person
      who has no password yet (for example because their setup link expired)
      set one.

      No email is sent when the instance has no email provider (`password.reset`
      on `GET /api/v1/auth/providers` is then `admin`: ask an administrator
      for a link instead), when the account cannot receive one (for example an
      administrator has disabled its password, or its address was never
      verified and it is already used with a sign-in provider), or when an
      email for the same account was sent in the last 5 minutes. In that last
      case the earlier link still works. An administrator can always issue a
      link.

      The body must be `application/json`. Available only while password
      login is switched on; otherwise 404. Rate-limited per client IP.
    operationId: requestPasswordReset
    security: []  # Public by design
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AccountResetEmailRequest'
    responses:
      '202':
        description: The request was taken. Says nothing about the address.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AccountResetEmailAccepted'
      '400':
        description: Malformed request body, a missing or oversized email, or a request whose `Content-Type` is not `application/json`
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Password login is not enabled on this instance
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '429':
        description: Too many requests from this client
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '503':
        description: The authentication policy could not be read
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Password Authentication

api-v1-auth-dev-login:
  post:
    summary: Dev login (development only)
    description: |
      Creates or retrieves a user by email address and sets a session cookie without
      going through an external identity provider. Only available when the server is
      running in development mode (`DEV_LOGIN_ENABLED=true`). Returns 404 in all other environments.
    operationId: devLogin
    security: []  # No authentication required
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/DevLoginRequest'
    responses:
      '200':
        description: Dev authentication successful — session cookie set, user object returned
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/User'
      '400':
        description: Invalid request body or missing required fields
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: |
          Sign-in denied by the access allowlist. The response `code` is the
          stable string `access_restricted`.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Endpoint not available outside development environment
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Authentication failed or session could not be created
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication

api-v1-auth-me:
  get:
    summary: Get current user information
    description: |
      Returns information about the currently authenticated user. Authentication is
      verified via the encrypted session cookie (`vx_session`) set during the
      identity-provider OAuth flow or dev login.
    operationId: getMe
    responses:
      '200':
        description: User information retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CurrentUser'
      '401':
        description: Unauthorized - invalid or missing session cookie
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: User not found
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Authentication
