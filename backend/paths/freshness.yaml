api-v1-team_id-freshness-audit:
  parameters:
    - name: team_id
      in: path
      required: true
      description: Team identifier
      schema:
        type: string
        format: uuid
  get:
    summary: List the team's freshness audit log
    description: >
      Every recorded mark and clear for the team, newest first and paginated.
      Readable by any member. The list is empty, never null, past the last page.
    operationId: listFreshnessAudit
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: page
        in: query
        required: false
        description: >
          Page number (1-based). The upper bound is not a storage limit — it
          keeps page * limit inside the range the offset arithmetic can
          represent, so an absurd page is rejected rather than silently
          wrapping around to the first one.
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 1
      - name: limit
        in: query
        required: false
        description: Entries per page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: Audit log retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/FreshnessAuditListResponse'
      '400':
        description: Invalid team_id or query parameter
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Authentication required
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: Caller is not a member of the team
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to list the team's freshness audit log
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Freshness
