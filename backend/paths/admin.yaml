          format: uuid
      - name: from
        in: query
        description: Inclusive start of the range. Defaults to 30 days before `to`.
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Exclusive end of the range. Defaults to now.
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
