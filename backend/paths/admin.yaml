api-v1-admin-users-id-timeline:
  get:
    summary: Get a user's resource timeline
    description: |
      Returns an opaque, newest-first timeline of the resources the user created
      or updated: resource type, action, team, project and the first 8 characters
      of the resource id — never a title, slug or content. Cursor-paginated: pass
      the previous page's `next_cursor` to continue.

      `updated` events are APPROXIMATE, by construction of the data:

      - Only the latest `updated_at` is stored, so a resource edited many times
        appears as ONE `updated` event, at its latest edit.
      - There is no `updated_by` column. The event means "a resource authored by
        this user was last modified", not "this user edited it" — a teammate's
        edit, or a system write that bumps `updated_at` (for example a blueprint
        GitHub re-sync or a team-wide artifact type rename), shows up here too.
      - An update is only reported when `updated_at` is more than one second after
        `created_at`, so a never-edited resource produces no `updated` event.
      - Agents, feed items and attachments only ever produce `created` events.

      Deleted resources leave no trace (resources are hard-deleted).

      Instance-admin only; non-admin and unauthenticated requests receive 404, as
      does an unknown user id.
    operationId: getAdminUserTimeline
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User id (UUID)
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        description: Opaque cursor from a previous page's `next_cursor`.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: One page of timeline events, newest first
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserTimelinePage'
      '400':
        description: Bad request — malformed user id, malformed cursor, or `limit` out of range
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Not found — unknown user id, or the caller is not an instance admin
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

