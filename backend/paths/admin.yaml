# Admin (instance-level) API paths for the /api/v1/admin surface. Every
# operation is guarded by instance-admin authorization: non-admin and
# unauthenticated callers receive 404 (Not Found) rather than 401/403, so the
# surface is not advertised to non-admins.

api-v1-admin-stats:
  get:
    summary: Get instance statistics
    description: |
      Returns instance-wide entity counts (users, teams, prompts, artifacts,
      memories) and the running backend application version. Requires the
      authenticated user to be a configured instance admin
      (auth.instance_admins); non-admin and unauthenticated requests receive 404.
    operationId: getAdminStats
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    responses:
      '200':
        description: Instance statistics retrieved successfully
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminStatsResponse'
      '404':
        description: Not found — the caller is not an instance admin (surface not advertised)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

api-v1-admin-users:
  post:
    summary: Create an instance user
    description: |
      Creates a user account directly, without waiting for them to complete an
      identity-provider sign-in.

      The account is provisioned exactly like a self-signup: it gets a personal
      "Private Workspace" team (owner membership, set as the user's default team)
      and a default project. That provisioning is driven by the same
      `user.created` event the sign-in path publishes, and it is handled
      ASYNCHRONOUSLY — so the personal workspace may appear a moment after this
      operation returns 201, exactly as it does for a self-signup. If the event
      cannot be published at all, the user is not created and this returns 500,
      so an unprovisioned account is never left behind.

      No password is set (VibeXP has no password provider); the account's owner
      signs in through the configured identity provider. Instance-admin rights
      are config-only and cannot be granted here.

      A duplicate email returns 409 and creates nothing. Instance-admin only;
      non-admin and unauthenticated requests receive 404.
    operationId: createAdminUser
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AdminUserCreateRequest'
    responses:
      '201':
        description: The created user
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserDetail'
      '400':
        description: Bad request — missing or malformed email/name, or an unknown field
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Not found — the caller is not an instance admin (surface not advertised)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: Conflict — a user with that email already exists; nothing was created
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  get:
    summary: List instance users
    description: |
      Returns a paginated, instance-wide listing of users with each user's team
      and project counts, per-type authored-resource counts and the time of their
      most recent resource. Supports case-insensitive search, typed filters, and allowlisted
      sorting; filters combine with AND and the pagination envelope reflects the
      filtered set. Instance-admin only; non-admin and unauthenticated requests
      receive 404.
    operationId: listAdminUsers
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: page
        in: query
        description: 1-based page number
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Case-insensitive substring match over the user's email and name.
        required: false
        schema:
          type: string
      - name: idp_provider
        in: query
        description: Exact match on the user's identity-provider name (e.g. "google", "oidc").
        required: false
        schema:
          type: string
      - name: created_from
        in: query
        description: Only users created at or after this instant (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: created_to
        in: query
        description: Only users created at or before this instant (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        description: Narrow to accounts in this lifecycle state.
        required: false
        schema:
          type: string
          enum:
            - active
            - suspended
      - name: team_count_min
        in: query
        description: Only users with at least this many teams the user belongs to (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: team_count_max
        in: query
        description: Only users with at most this many teams the user belongs to (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: project_count_min
        in: query
        description: Only users with at least this many projects the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: project_count_max
        in: query
        description: Only users with at most this many projects the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: prompt_count_min
        in: query
        description: Only users with at least this many prompts the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: prompt_count_max
        in: query
        description: Only users with at most this many prompts the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: memory_count_min
        in: query
        description: Only users with at least this many memories the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: memory_count_max
        in: query
        description: Only users with at most this many memories the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: artifact_count_min
        in: query
        description: Only users with at least this many artifacts the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: artifact_count_max
        in: query
        description: Only users with at most this many artifacts the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: blueprint_count_min
        in: query
        description: Only users with at least this many blueprints the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: blueprint_count_max
        in: query
        description: Only users with at most this many blueprints the user authored (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: agent_count_min
        in: query
        description: Only users with at least this many agents the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: agent_count_max
        in: query
        description: Only users with at most this many agents the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_count_min
        in: query
        description: Only users with at least this many feeds the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_count_max
        in: query
        description: Only users with at most this many feeds the user created (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_item_count_min
        in: query
        description: Only users with at least this many feed items the user posted (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_item_count_max
        in: query
        description: Only users with at most this many feed items the user posted (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: comment_count_min
        in: query
        description: Only users with at least this many comments the user wrote (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: comment_count_max
        in: query
        description: Only users with at most this many comments the user wrote (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: attachment_count_min
        in: query
        description: Only users with at least this many attachments the user uploaded (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: attachment_count_max
        in: query
        description: Only users with at most this many attachments the user uploaded (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: total_resource_count_min
        in: query
        description: Only users with at least this many resources the user authored across all nine types (the sum of resource_counts) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: total_resource_count_max
        in: query
        description: Only users with at most this many resources the user authored across all nine types (the sum of resource_counts) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: last_resource_created_from
        in: query
        description: |
          Only users whose most recent resource (any of the nine types) was created
          at or after this instant (inclusive). Users with no resources never match.
        required: false
        schema:
          type: string
          format: date-time
      - name: last_resource_created_to
        in: query
        description: |
          Only users whose most recent resource (any of the nine types) was created
          at or before this instant (inclusive). Users with no resources never match.
        required: false
        schema:
          type: string
          format: date-time
      - name: sort_by
        in: query
        description: |
          Column to sort by. Ties are always broken by user id so paging is stable.
          Sorting by last_resource_created_at places users with no resources last
          in both directions.
        required: false
        schema:
          type: string
          enum:
            - created_at
            - email
            - name
            - team_count
            - project_count
            - prompt_count
            - memory_count
            - artifact_count
            - blueprint_count
            - agent_count
            - feed_count
            - feed_item_count
            - comment_count
            - attachment_count
            - total_resource_count
            - last_resource_created_at
          default: created_at
      - name: sort_order
        in: query
        description: Sort direction.
        required: false
        schema:
          type: string
          enum:
            - asc
            - desc
          default: desc
    responses:
      '200':
        description: A page of users
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserListResponse'
      '400':
        description: >-
          Bad request — a query parameter is malformed or outside its enum, a count bound is
          negative, or a min/max or from/to pair is inverted
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Not found — the caller is not an instance admin (surface not advertised)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

api-v1-admin-users-id:
  patch:
    summary: Update an instance user
    description: |
      Updates the display name of a user. This is the ONLY field an instance
      admin may change: `email`, `idp_provider` and `idp_subject` are owned by the
      upstream identity provider, and a body containing any unknown or
      non-editable field is rejected with 400 rather than silently ignored.
      Instance-admin only; non-admin and unauthenticated requests receive 404.
    operationId: updateAdminUser
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User id (UUID)
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/AdminUserUpdateRequest'
    responses:
      '200':
        description: The updated user
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserDetail'
      '400':
        description: Bad request — malformed id, or a body carrying an unknown or non-editable field
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Not found — unknown user id, or the caller is not an instance admin
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  delete:
    summary: Delete an instance user
    description: |
      **Permanently and irreversibly** deletes a user. This cascades: the user's
      personal team and everything they own (prompts, artifacts, memories,
      projects, agents, feeds, API keys, …) are destroyed with them. Rows in
      `attachments`, `content_versions`, `resource_access_events` and `types`
      survive with a null user reference so audit and analytics history is kept.

      **Suspension (`POST /admin/users/{id}/suspend`) is the reversible
      alternative** and should be preferred unless the data genuinely must go.

      The delete is REFUSED with 409 when the user owns any shared (non-personal)
      team that still has other members, because removing them would cascade that
      team away and destroy its other members' data. The response lists every
      blocking team; transfer ownership first. Nothing is deleted in that case.

      Also refused with 409 when the acting admin targets themselves, or when the
      target's email is listed in the `auth.instance_admins` config allowlist.

      Instance-admin only; non-admin and unauthenticated requests receive 404.
    operationId: deleteAdminUser
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User id (UUID)
        schema:
          type: string
          format: uuid
    responses:
      '204':
        description: The user was deleted
      '400':
        description: Bad request — malformed user id
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: Not found — unknown user id, or the caller is not an instance admin
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: |
          Conflict — the delete was refused and NOTHING was deleted. Either the
          user owns shared teams with other members (see `blockers`), or the
          target is the acting admin or a config-listed instance admin.
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserDeleteBlockedResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
  get:
    summary: Get an instance user
    description: |
      Returns one user with their team memberships (team name + the user's role
      in each team). Instance-admin only; non-admin and unauthenticated requests
      receive 404, as does an unknown user id.
    operationId: getAdminUser
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: User id (UUID)
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: The user with their team memberships
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/AdminUserDetail'
      '404':
        description: Not found — unknown user id, or the caller is not an instance admin
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'

api-v1-admin-teams:
  get:
    summary: List instance teams
    description: |
      Returns a paginated, instance-wide listing of teams with each team's owner,
      member/owner/admin/project counts, per-type resource counts and which
      settings the team has configured itself (instance-level fallback never
      counts as configured). Supports case-insensitive search, typed filters, and
      allowlisted sorting; filters combine with AND and the pagination envelope
      reflects the filtered set. Instance-admin only; non-admin and
      unauthenticated requests receive 404.
    operationId: listAdminTeams
    tags:
      - Admin
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: page
        in: query
        description: 1-based page number
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: Items per page
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        description: Case-insensitive substring match over the team name, team slug, and the owner's email.
        required: false
        schema:
          type: string
      - name: is_personal
        in: query
        description: Narrow to personal workspaces (true) or shared team workspaces (false).
        required: false
        schema:
          type: boolean
      - name: created_from
        in: query
        description: Only teams created at or after this instant (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: created_to
        in: query
        description: Only teams created at or before this instant (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: member_count_min
        in: query
        description: Only teams with at least this many members (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: member_count_max
        in: query
        description: Only teams with at most this many members (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: owner_count_min
        in: query
        description: Only teams with at least this many members holding the owner role (always 1 by application invariant; any other value is integrity drift) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: owner_count_max
        in: query
        description: Only teams with at most this many members holding the owner role (always 1 by application invariant; any other value is integrity drift) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: admin_count_min
        in: query
        description: Only teams with at least this many members holding the admin role (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: admin_count_max
        in: query
        description: Only teams with at most this many members holding the admin role (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: project_count_min
        in: query
        description: Only teams with at least this many projects in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: project_count_max
        in: query
        description: Only teams with at most this many projects in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: prompt_count_min
        in: query
        description: Only teams with at least this many prompts in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: prompt_count_max
        in: query
        description: Only teams with at most this many prompts in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: memory_count_min
        in: query
        description: Only teams with at least this many memories in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: memory_count_max
        in: query
        description: Only teams with at most this many memories in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: artifact_count_min
        in: query
        description: Only teams with at least this many artifacts in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: artifact_count_max
        in: query
        description: Only teams with at most this many artifacts in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: blueprint_count_min
        in: query
        description: Only teams with at least this many blueprints in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: blueprint_count_max
        in: query
        description: Only teams with at most this many blueprints in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: agent_count_min
        in: query
        description: Only teams with at least this many agents in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: agent_count_max
        in: query
        description: Only teams with at most this many agents in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_count_min
        in: query
        description: Only teams with at least this many feeds in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_count_max
        in: query
        description: Only teams with at most this many feeds in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_item_count_min
        in: query
        description: Only teams with at least this many feed items in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: feed_item_count_max
        in: query
        description: Only teams with at most this many feed items in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: comment_count_min
        in: query
        description: Only teams with at least this many comments in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: comment_count_max
        in: query
        description: Only teams with at most this many comments in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: attachment_count_min
        in: query
        description: Only teams with at least this many attachments in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: attachment_count_max
        in: query
        description: Only teams with at most this many attachments in the team (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: total_resource_count_min
        in: query
        description: Only teams with at least this many resources in the team across all nine types (the sum of resource_counts) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: total_resource_count_max
        in: query
        description: Only teams with at most this many resources in the team across all nine types (the sum of resource_counts) (inclusive).
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: owner_email
        in: query
        description: Case-insensitive exact match on the team owner's email (the user referenced by the team's owner). For substring matching use `search`.
        required: false
        schema:
          type: string
          format: email
      - name: embedding_configured
        in: query
        description: true = the team has at least one embedding provider of its own; false = it does not; omit = any. Instance-level fallback configuration never counts.
        required: false
        schema:
          type: boolean
      - name: llm_configured
        in: query
        description: true = the team has at least one LLM model provider of its own; false = it does not; omit = any. Instance-level fallback configuration never counts.
        required: false
