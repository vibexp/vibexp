# Cross-team copy (issue #830, epic #827). Registered on the settings mount
# ALONE — the "Copy from another team…" action is a settings-page affordance,
# so there is deliberately no bare /api/v1/{team_id}/model-providers/copy twin
# and the operationId carries no ...Settings alias suffix.
api-v1-settings-model-providers-copy:
  post:
    summary: Copy a model provider from another team into this team
    description: >-
      Copies the provider named by `source_provider_id` out of `source_team_id`
      and into the team named by `{team_id}`, credential included. The caller
      must be able to manage provider settings in BOTH teams — the same bar the
      destination's own create path sets — and the destination is checked first,
      so a caller entitled to neither learns nothing about either.


      The copy carries the source row's ENCRYPTED API key across without ever
      decrypting it, which is the only way the credential can move: it is
      write-only over the API, and responses report `has_api_key` alone. A
      source provider stored without a key copies fine and reports
      `has_api_key: false`.


      The copy is a snapshot. The destination fully owns the resulting row and
      may edit or delete it with no effect on the source. It always lands
      non-default (`is_default: false`) regardless of the source, so it can
      never displace the destination team's existing default.


      Note the `version` caveat on `ModelProvider`: like the create response,
      this one reports 0 for a row that persists at 1.
    operationId: copyModelProviderFromTeam
    security:
      - ApiKeyAuth: []
      - CookieAuth: []
    parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Destination team identifier
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/CopyModelProviderRequest'
    responses:
      '200':
        description: Provider copied into the destination team
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ModelProviderResponse'
      '400':
        description: >-
          Missing or malformed body, missing/malformed `source_team_id` or
          `source_provider_id`, source equal to destination (`BAD_REQUEST`), or
          an override sent empty (`MODEL_PROVIDER_VALIDATION_FAILED` with
          `validation_errors`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '403':
        description: >-
          Caller cannot manage provider settings in the destination team or in
          the source team (`FORBIDDEN`). The two are deliberately
          indistinguishable, so the response never reveals whether the source
          team exists.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '404':
        description: >-
          No such provider in the source team (`MODEL_PROVIDER_NOT_FOUND`).
          Only reachable once the caller is authorized on both teams, so it
          leaks nothing.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '409':
        description: >-
          A caller-supplied `name` is already taken in the destination team
          (`MODEL_PROVIDER_ALREADY_EXISTS`). An omitted name is disambiguated
          instead and never reaches this.
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to copy the model provider (`INTERNAL_ERROR`)
        content:
          application/problem+json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    tags:
      - Model Providers
