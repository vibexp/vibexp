# oapi-codegen configuration for the Freshness domain (issue #731, epic #726),
# a spec-first strict-server domain. Following the same convention as
# oapi-codegen-teamsettings.yaml, it generates into its OWN package under
# internal/server/gen/freshness so its StrictServerInterface mounts
# independently of the other spec-first domains.
#
# A dedicated `Freshness` tag rather than reusing `TeamSettings`: include-tags
# is the generation unit, so sharing a tag would pull both domains into one
# package and one StrictServerInterface, forcing the settings handlers to be
# rewritten alongside these.
#
# Regenerate with: make backend-generate-openapi-server
# CI fails the PR if this output is stale relative to the spec.
package: freshnessgen
output: internal/server/gen/freshness/freshness.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
output-options:
  include-tags:
    - Freshness
