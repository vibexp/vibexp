# oapi-codegen configuration for the Embedding Providers domain (issue #472,
# epic #122), a spec-first strict-server domain. Following the same convention
# as oapi-codegen-teamsettings.yaml, it generates into its OWN package under
# internal/server/gen/embeddingproviders so its StrictServerInterface mounts
# independently of the other spec-first domains.
#
# DEPARTURE FROM THE include-tags CONVENTION: this domain is mounted twice
# (bare + `settings/`) and the settings-mount operations are tagged `Settings`,
# a tag shared with api-keys, team-email-provider and user. `include-tags:
# [Settings]` would therefore drag those unrelated operations into this package,
# so the operations are selected explicitly by id instead. The coverage,
# reprocess and clear-embeddings operations are deliberately NOT listed — they
# already have spec-validated responses and stay on their chi handlers.
#
# Regenerate with: make backend-generate-openapi-server
# CI fails the PR if this output is stale relative to the spec.
package: embeddingprovidersgen
output: internal/server/gen/embeddingproviders/embeddingproviders.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
output-options:
  include-operation-ids:
    - createEmbeddingProvider
    - listEmbeddingProviders
    - getEmbeddingProvider
    - updateEmbeddingProvider
    - deleteEmbeddingProvider
    - validateEmbeddingProvider
    - createEmbeddingProviderSettings
    - listEmbeddingProvidersSettings
    - getEmbeddingProviderSettings
    - updateEmbeddingProviderSettings
    - deleteEmbeddingProviderSettings
    - validateEmbeddingProviderSettings
