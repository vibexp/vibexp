# oapi-codegen configuration for the Model Providers domain (epic #122), one
# more spec-first strict-server package under internal/server/gen.
#
# DEPARTURE FROM THE include-tags CONVENTION, for the same reason as
# oapi-codegen-embedding-providers.yaml: the selector stays a list of operation
# ids so a conversion can proceed a slice at a time. #830 seeded it with the
# cross-team copy alone (a NEW endpoint has to ship strict-server-typed,
# CLAUDE.md / epic #122) while the twelve CRUD/validate operations stayed on
# hand-written chi handlers; #837 appended those twelve, so the set is now the
# whole `Model Providers` tag.
#
# It is still spelled as ids rather than `include-tags: [Model Providers]`,
# because the list is the explicit record of what this package serves: a new
# operation added to the tag joins the generated StrictServerInterface only when
# someone lists it here, rather than silently breaking the build on the next
# unrelated spec edit.
#
# The ids are copied from backend/paths/model-providers.yaml, NOT inferred from
# the paths — a misspelled id generates an EMPTY package with no error.
#
# Regenerate with: make backend-generate-openapi-server
# CI fails the PR if this output is stale relative to the spec.
package: modelprovidersgen
output: internal/server/gen/modelproviders/modelproviders.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
output-options:
  include-operation-ids:
    - copyModelProviderFromTeam
    # Bare mount: /api/v1/{team_id}/model-providers
    - createModelProvider
    - listModelProviders
    - getModelProvider
    - updateModelProvider
    - deleteModelProvider
    - validateModelProvider
    # Settings alias mount: /api/v1/{team_id}/settings/model-providers
    - createModelProviderSettings
    - listModelProvidersSettings
    - getModelProviderSettings
    - updateModelProviderSettings
    - deleteModelProviderSettings
    - validateModelProviderSettings
