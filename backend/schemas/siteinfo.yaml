# Public instance site info schemas (#1355, epic #1352).

SiteInfoResponse:
  type: object
  description: >
    The instance's company branding, as shown on the sign-in page, in the app
    shell and in emails. The endpoint is public, so this carries only these
    eight non-secret values: no version, editor or timestamps. Every value is
    null when it is not configured, and the surface that would show it is
    hidden. Each URL is an absolute `http` or `https` URL.
  additionalProperties: false
  required:
    - company_name
    - company_email
    - website
    - support_url
    - terms_url
    - privacy_url
    - logo_url
    - logo_dark_url
  properties:
    company_name:
      type: string
      nullable: true
      description: The company name.
      example: "Acme Inc."
    company_email:
      type: string
      nullable: true
      description: The company contact address. The support link falls back to it when `support_url` is null.
      example: "hello@acme.example.com"
    website:
      type: string
      nullable: true
      description: The company website; the logo and name link to it.
      example: "https://acme.example.com"
    support_url:
      type: string
      nullable: true
      description: Where the Support link points.
      example: "https://acme.example.com/help"
    terms_url:
      type: string
      nullable: true
      description: The terms of service page.
      example: "https://acme.example.com/terms"
    privacy_url:
      type: string
      nullable: true
      description: The privacy policy page.
      example: "https://acme.example.com/privacy"
    logo_url:
      type: string
      nullable: true
      description: The company logo image.
      example: "https://cdn.acme.example.com/logo.svg"
    logo_dark_url:
      type: string
      nullable: true
      description: The dark-mode logo image; use `logo_url` when it is null.
      example: "https://cdn.acme.example.com/logo-dark.svg"
