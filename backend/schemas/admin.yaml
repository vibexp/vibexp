# Admin (instance-level) schemas for the /api/v1/admin surface. This surface is
# guarded by instance-admin authorization at the transport layer.

AdminInstanceCounts:
  type: object
  description: Instance-wide totals for the top-level entities (unscoped counts).
  required:
    - users
    - teams
    - prompts
    - artifacts
    - memories
  properties:
    users:
      type: integer
      format: int64
      description: Total number of user accounts.
      example: 42
    teams:
      type: integer
      format: int64
      description: Total number of teams.
      example: 12
    prompts:
      type: integer
      format: int64
      description: Total number of prompts.
      example: 340
    artifacts:
      type: integer
      format: int64
      description: Total number of artifacts.
      example: 128
    memories:
      type: integer
      format: int64
      description: Total number of memories.
      example: 512

AdminStatsResponse:
  type: object
  description: Instance statistics returned by GET /api/v1/admin/stats.
  required:
    - counts
    - version
  properties:
    counts:
      $ref: '#/AdminInstanceCounts'
    version:
      type: string
      description: The running backend application version (config server.service_version; "dev" when unset).
      example: "1.2.3"

AdminUserListItem:
  type: object
  description: One user in the instance-wide admin user listing.
  required:
    - id
    - email
    - name
    - status
    - created_at
    - team_count
    - project_count
    - resource_counts
  properties:
    id:
      type: string
      format: uuid
      example: "user_123"
    email:
      type: string
      format: email
      example: "user@example.com"
    name:
      type: string
      example: "John Doe"
    idp_provider:
      type: string
      nullable: true
      description: Identity provider name (e.g. "google", "oidc"); null for accounts without one.
      example: "oidc"
    status:
      type: string
      enum:
        - active
        - suspended
      description: |
        Account lifecycle. A suspended account is rejected at every
        authentication entry point — existing sessions, API keys and MCP/OAuth
        tokens stop working immediately, not at expiry. Instance-local: it does
        not disable the account at the upstream identity provider.
      example: "active"
    created_at:
      type: string
      format: date-time
    team_count:
      type: integer
      format: int64
      description: Number of teams the user belongs to.
      example: 3
    project_count:
      type: integer
      format: int64
      description: Number of projects the user created.
      example: 2
    resource_counts:
      $ref: '#/AdminResourceCounts'
    last_resource_created_at:
      type: string
      format: date-time
      nullable: true
      description: |
        When the user's most recent resource (any of the nine types counted in
        resource_counts) was created; null for a user who has authored none.

AdminResourceCounts:
  type: object
  description: |
    How many resources of each type belong to the listed row. On a user row
    these are the resources the user authored, counted by the author column of
    each table (feeds by creator, feed items by poster); on a team row they are
    the resources in the team, counted by team_id. Every row counts regardless
    of its status or archive state. `total` is the sum of the nine types.
  required:
    - prompts
    - memories
    - artifacts
    - blueprints
    - agents
    - feeds
    - feed_items
    - comments
    - attachments
    - total
  properties:
    prompts:
      type: integer
      format: int64
      example: 12
    memories:
      type: integer
      format: int64
      example: 40
    artifacts:
      type: integer
      format: int64
      example: 5
    blueprints:
      type: integer
      format: int64
      example: 3
    agents:
      type: integer
      format: int64
      example: 1
    feeds:
      type: integer
      format: int64
      example: 2
    feed_items:
      type: integer
      format: int64
      example: 18
    comments:
      type: integer
      format: int64
      example: 7
    attachments:
      type: integer
      format: int64
      example: 4
    total:
      type: integer
      format: int64
      description: Sum of the nine per-type counts.
      example: 92

AdminUserListResponse:
  type: object
  description: A page of the instance-wide user listing, newest first.
  required:
    - users
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    users:
      type: array
      description: Users on this page, newest first.
      items:
        $ref: '#/AdminUserListItem'
    total_count:
      type: integer
      description: Total number of users across the instance.
      example: 128
    page:
      type: integer
      description: Current page number.
      example: 1
    per_page:
      type: integer
      description: Number of items per page.
      example: 20
    total_pages:
      type: integer
      description: Total number of pages.
      example: 7

AdminTeamMembership:
  type: object
  description: A team the user belongs to, with the user's role in that team.
  required:
    - team_id
    - team_name
    - role
  properties:
    team_id:
      type: string
      format: uuid
      example: "team_abc123"
    team_name:
      type: string
      example: "Acme Engineering"
    role:
      type: string
      description: The user's role in the team (owner, admin, or member).
      example: "member"

AdminUserDetail:
  type: object
  description: A single user with their team memberships (GET /api/v1/admin/users/{id}).
  required:
    - id
    - email
    - name
    - status
    - created_at
    - memberships
  properties:
    id:
      type: string
      format: uuid
      example: "user_123"
    email:
      type: string
      format: email
      example: "user@example.com"
    name:
      type: string
      example: "John Doe"
    idp_provider:
      type: string
      nullable: true
      description: Identity provider name (e.g. "google", "oidc"); null for accounts without one.
      example: "oidc"
    status:
      type: string
      enum:
        - active
        - suspended
      description: |
        Account lifecycle. A suspended account is rejected at every
        authentication entry point — existing sessions, API keys and MCP/OAuth
        tokens stop working immediately, not at expiry. Instance-local: it does
        not disable the account at the upstream identity provider.
      example: "active"
    created_at:
      type: string
      format: date-time
    memberships:
      type: array
      description: Teams the user belongs to.
      items:
        $ref: '#/AdminTeamMembership'

AdminTeamOwner:
  type: object
  description: |
    A user shown as the responsible party for a resource: the owner of a team, or
    the creator of a project (#453). The shape is id/email/name in both cases;
    which relationship it represents is stated on the referencing property.
  required:
    - id
    - email
    - name
  properties:
    id:
      type: string
      format: uuid
      example: "user_123"
    email:
      type: string
      format: email
      example: "owner@example.com"
    name:
      type: string
      example: "Jane Owner"

AdminTeamListItem:
  type: object
  description: One team in the instance-wide admin team listing.
  required:
    - id
    - name
    - slug
    - is_personal
    - owner
    - member_count
    - owner_count
    - admin_count
    - project_count
    - resource_counts
    - configuration
    - created_at
  properties:
    id:
      type: string
      format: uuid
      example: "team_abc123"
    name:
      type: string
      example: "Acme Engineering"
    slug:
      type: string
      description: URL-safe team identifier.
      example: "acme-engineering"
    is_personal:
      type: boolean
      description: True for a user's default personal workspace, false for a shared team workspace.
      example: false
    owner:
      $ref: '#/AdminTeamOwner'
    member_count:
      type: integer
      format: int64
      description: Number of members in the team.
      example: 8
    owner_count:
      type: integer
      format: int64
      description: Number of members holding the owner role. Always 1 by application invariant; any other value signals integrity drift.
      example: 1
    admin_count:
      type: integer
      format: int64
      description: Number of members holding the admin role.
      example: 2
    project_count:
      type: integer
      format: int64
      description: Number of projects in the team.
      example: 3
    resource_counts:
      $ref: '#/AdminResourceCounts'
    configuration:
      $ref: '#/AdminTeamConfiguration'
    created_at:
      type: string
      format: date-time

AdminTeamConfiguration:
  type: object
  description: |
    Which settings a team has configured itself. Each flag reflects the team's
    OWN rows only; instance-level fallback configuration (config.yaml) never
    counts as configured.
  required:
    - embedding_configured
    - llm_configured
    - ai_summary_enabled
    - email_configured
    - github_configured
    - search_settings_customized
    - freshness_enabled
  properties:
    embedding_configured:
      type: boolean
      description: The team has at least one embedding provider of its own.
    llm_configured:
      type: boolean
      description: The team has at least one LLM model provider of its own.
    ai_summary_enabled:
      type: boolean
      description: The team has its own AI summary settings with summaries enabled.
    email_configured:
      type: boolean
      description: The team has its own email provider, regardless of its delivery health.
    github_configured:
      type: boolean
      description: The team has its own GitHub App configuration or at least one GitHub App installation (suspended installations included).
    search_settings_customized:
      type: boolean
      description: The team has its own search settings.
    freshness_enabled:
      type: boolean
      description: The team has at least one enabled freshness rule.

AdminTeamListResponse:
  type: object
  description: A page of the instance-wide team listing, newest first.
  required:
    - teams
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    teams:
      type: array
      description: Teams on this page, newest first.
      items:
        $ref: '#/AdminTeamListItem'
    total_count:
      type: integer
      description: Total number of teams across the instance.
      example: 12
    page:
      type: integer
      example: 1
    per_page:
      type: integer
      example: 20
    total_pages:
      type: integer
      example: 1

AdminTeamMember:
  type: object
  description: One member of a team, with the member's role and join time.
  required:
    - user_id
    - email
    - name
    - role
    - joined_at
  properties:
    user_id:
      type: string
      format: uuid
      example: "user_123"
    email:
      type: string
      format: email
      example: "member@example.com"
    name:
      type: string
      example: "John Member"
    role:
      type: string
      description: The member's role in the team (owner, admin, or member).
      example: "member"
    joined_at:
      type: string
      format: date-time

AdminTeamDetail:
  type: object
  description: A single team with its owner and member list (GET /api/v1/admin/teams/{id}).
  required:
    - id
    - name
    - slug
    - is_personal
    - owner
    - created_at
    - members
  properties:
    id:
      type: string
      format: uuid
      example: "team_abc123"
    name:
      type: string
      example: "Acme Engineering"
    slug:
      type: string
      description: URL-safe team identifier.
      example: "acme-engineering"
    is_personal:
      type: boolean
      description: True for a user's default personal workspace, false for a shared team workspace.
      example: false
    owner:
      $ref: '#/AdminTeamOwner'
    created_at:
      type: string
      format: date-time
    members:
      type: array
      description: The team's members.
      items:
        $ref: '#/AdminTeamMember'

# ---------------------------------------------------------------------------
# Dashboard metrics (#451). Computed on demand — no rollup/snapshot tables.
# ---------------------------------------------------------------------------

AdminExtendedCounts:
  type: object
  description: |
    Instance-wide totals for every top-level entity. A superset of
    AdminInstanceCounts, which stays as-is for the legacy stats endpoint.
  required:
    - users
    - teams
    - projects
    - prompts
    - artifacts
    - memories
    - blueprints
    - agents
    - feeds
    - api_keys
  properties:
    users:
      type: integer
      format: int64
      example: 42
    teams:
      type: integer
      format: int64
      example: 12
    projects:
      type: integer
      format: int64
      example: 30
    prompts:
      type: integer
      format: int64
      example: 340
    artifacts:
      type: integer
      format: int64
      example: 128
    memories:
      type: integer
      format: int64
      example: 512
    blueprints:
      type: integer
      format: int64
      example: 64
    agents:
      type: integer
      format: int64
      example: 9
    feeds:
      type: integer
      format: int64
      example: 4
    api_keys:
      type: integer
      format: int64
      example: 17

AdminBreakdownBucket:
  type: object
  description: One value of a grouped column plus how many rows carry it.
  required:
    - value
    - count
  properties:
    value:
      type: string
      description: The column value. NULL values are reported as an empty string.
      example: "active"
    count:
      type: integer
      format: int64
      example: 120

AdminEntityBreakdown:
  type: object
  description: A GROUP BY over one status/type column of one entity table.
  required:
    - entity
    - field
    - buckets
  properties:
    entity:
      type: string
      description: The entity table the breakdown covers.
      example: "prompts"
    field:
      type: string
      description: The grouped column.
      example: "status"
    buckets:
      type: array
      description: One entry per distinct value, most frequent first.
      items:
        $ref: '#/AdminBreakdownBucket'

AdminTableStat:
  type: object
  description: Approximate row count for one table.
  required:
    - table
    - estimated_rows
  properties:
    table:
      type: string
      example: "prompts"
    estimated_rows:
      type: integer
      format: int64
      description: |
        ESTIMATE from pg_stat_user_tables.n_live_tup, not an exact COUNT(*) —
        an exact per-table count does not scale and this figure is only meant
        for relative sizing. Freshness depends on autovacuum/ANALYZE.
      example: 34012

AdminSystemHealth:
  type: object
  description: Instance storage health.
  required:
    - database_size_bytes
    - tables
  properties:
    database_size_bytes:
      type: integer
      format: int64
      description: pg_database_size(current_database()).
      example: 184549376
    tables:
      type: array
      description: Per-table estimated row counts, largest first.
      items:
        $ref: '#/AdminTableStat'

AdminDashboardOverview:
  type: object
  description: Totals, breakdowns and system health (GET /api/v1/admin/dashboard/overview).
  required:
    - counts
    - breakdowns
    - system_health
    - version
  properties:
    counts:
      $ref: '#/AdminExtendedCounts'
    breakdowns:
      type: array
      description: One entry per entity/column pair that has a status or type column.
      items:
        $ref: '#/AdminEntityBreakdown'
    system_health:
      $ref: '#/AdminSystemHealth'
    version:
      type: string
      description: The running backend application version ("dev" when unset).
      example: "1.2.3"

AdminGrowthPoint:
  type: object
  description: New rows created per entity within one time bucket.
  required:
    - bucket
    - users
    - teams
    - projects
    - prompts
    - artifacts
    - memories
  properties:
    bucket:
      type: string
      format: date-time
      description: Start of the bucket, in UTC.
    users:
      type: integer
      format: int64
    teams:
      type: integer
      format: int64
    projects:
      type: integer
      format: int64
    prompts:
      type: integer
      format: int64
    artifacts:
      type: integer
      format: int64
    memories:
      type: integer
      format: int64

AdminCountPoint:
  type: object
  description: A single count within one time bucket.
  required:
    - bucket
    - count
  properties:
    bucket:
      type: string
      format: date-time
      description: Start of the bucket, in UTC.
    count:
      type: integer
      format: int64

AdminSourcePoint:
  type: object
  description: A count for one access source within one time bucket.
  required:
    - bucket
    - source
    - count
  properties:
    bucket:
      type: string
      format: date-time
      description: Start of the bucket, in UTC.
    source:
      type: string
      description: Access source (e.g. "web", "cli", "mcp").
      example: "mcp"
    count:
      type: integer
      format: int64

AdminDataWindow:
  type: object
  description: |
    Earliest instant for which event data still exists. Both source tables are
    TTL-pruned (config retention.activity_days / retention.access_event_days),
    so a chart asking for a range older than these values will legitimately show
    zeros rather than missing data.
  required:
    - sign_ins_earliest_retained_at
    - access_by_source_earliest_retained_at
  properties:
    sign_ins_earliest_retained_at:
      type: string
      format: date-time
      description: now() - retention.activity_days.
    access_by_source_earliest_retained_at:
      type: string
      format: date-time
      description: now() - retention.access_event_days.

AdminTimeseriesResponse:
  type: object
  description: |
    Bucketed metrics over a time range (GET /api/v1/admin/dashboard/timeseries).
    Every bucket in the requested range is present in every series with an
    explicit 0 — the series are gap-filled, never sparse.
  required:
    - from
    - to
    - granularity
    - growth
    - sign_ins
    - access_by_source
    - data_window
  properties:
    from:
      type: string
      format: date-time
      description: |
        Inclusive start of the range actually used. This is snapped DOWN to the
        start of its bucket, so it may precede the requested `from` (asking for
        2026-07-15 at month granularity reports and queries 2026-07-01). Buckets
        are therefore always whole, never partial at the head.
    to:
      type: string
      format: date-time
      description: |
        Exclusive end of the range actually used (after defaulting). This is NOT
        snapped, so the final bucket may cover only part of its period.
    granularity:
      type: string
      enum:
        - day
        - week
        - month
      description: Bucket size actually used.
    growth:
      type: array
      description: New entities per bucket, ascending by bucket.
      items:
        $ref: '#/AdminGrowthPoint'
    sign_ins:
      type: array
      description: Successful sign-ins per bucket (activities.auth_login), ascending.
      items:
        $ref: '#/AdminCountPoint'
    access_by_source:
      type: array
      description: |
        Resource accesses per bucket per source, ascending by bucket then source.
        Only sources actually observed in the range appear; a source with no
        events in a bucket is gap-filled to 0 for the sources that do appear.
      items:
        $ref: '#/AdminSourcePoint'
    data_window:
      $ref: '#/AdminDataWindow'

# ---------------------------------------------------------------------------
# Admin user mutations (#455)
# ---------------------------------------------------------------------------

AdminUserUpdateRequest:
  type: object
  description: |
    Fields an instance admin may change on a user. Deliberately minimal: email
    and the identity-provider fields (idp_provider, idp_subject) are owned by the
    upstream IdP and are not editable here — sending them is a 400 rather than a
    silent no-op.
  required:
    - name
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 255
      description: The user's display name.
      example: "Jane Doe"

AdminDeleteBlocker:
  type: object
  description: |
    One reason a user cannot be deleted: a shared team they own that still has
    other members. Ownership must be transferred before the account can be
    removed.
  required:
    - team_id
    - team_name
    - member_count
  properties:
    team_id:
      type: string
      format: uuid
    team_name:
      type: string
      example: "Acme Engineering"
    member_count:
      type: integer
      format: int64
      description: How many members the team has, including the owner.
      example: 4

AdminUserDeleteBlockedResponse:
  type: object
  description: |
    Returned with 409 when a hard delete is refused. NOTHING was deleted: the
    user and every listed team still exist.
  required:
    - message
    - blockers
  properties:
    message:
      type: string
      description: Human-readable summary of why the delete was refused.
      example: "This user owns shared teams with other members. Transfer ownership before deleting."
    blockers:
      type: array
      description: Every shared team blocking the delete.
      items:
        $ref: '#/AdminDeleteBlocker'

# ---------------------------------------------------------------------------
# Admin user creation (#462)
# ---------------------------------------------------------------------------

AdminUserCreateRequest:
  type: object
  description: |
    A user to create directly, without waiting for them to complete an
    identity-provider sign-in. No password is set: VibeXP has no password
    provider, and the account's owner still signs in through the configured IdP.
  required:
    - email
    - name
  additionalProperties: false
  properties:
    email:
      type: string
      format: email
      description: Must be unique across the instance; a duplicate is a 409.
      example: "new.user@example.com"
    name:
      type: string
      minLength: 1
      maxLength: 255
      example: "New User"
    idp_provider:
      type: string
      description: |
        Optional label recording which identity provider this account is expected
        to sign in with (e.g. "google", "oidc"). Informational only — it does not
        pre-link an IdP identity, which is established on first sign-in.
      example: "oidc"

# ---------------------------------------------------------------------------
# Admin projects (#453)
# ---------------------------------------------------------------------------

AdminProjectTeam:
  type: object
  description: The team a project belongs to.
  required:
    - id
    - name
    - slug
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: "Acme Engineering"
    slug:
      type: string
      example: "acme-engineering"

AdminProjectListItem:
  type: object
  description: One project in the instance-wide admin project listing.
  required:
    - id
    - name
    - slug
    - team
    - owner
    - created_at
    - updated_at
    - resource_counts
    - last_resource_created_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: "Platform"
    slug:
      type: string
      example: "platform"
    team:
      $ref: '#/AdminProjectTeam'
    owner:
      allOf:
        - $ref: '#/AdminTeamOwner'
      description: |
        The project's creator (projects.user_id). This is NOT necessarily the
        owning team's owner — a project carries both a team and a creating user,
        and the two can differ.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    resource_counts:
      $ref: '#/AdminProjectResourceCounts'
    last_resource_created_at:
      type: string
      format: date-time
      nullable: true
      description: |
        When the project's most recent project-scoped resource (any of the five
        types counted in resource_counts) was created; null for a project with
        none.

AdminProjectListResponse:
  type: object
  description: A page of the instance-wide project listing.
  required:
    - projects
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    projects:
      type: array
      description: Projects on this page.
      items:
        $ref: '#/AdminProjectListItem'
    total_count:
      type: integer
      description: Total number of projects matching the filters.
      example: 30
    page:
      type: integer
      example: 1
    per_page:
      type: integer
      example: 20
    total_pages:
      type: integer
      example: 2

AdminProjectResourceCounts:
  type: object
  description: |
    How many of each PROJECT-SCOPED resource type the project contains, plus
    their total. Shared by the project listing and the project detail, which
    always agree.

    Only the five tables with a direct project_id belong to a project: prompts,
    artifacts, memories, blueprints and feed items (a feed item posted without
    a project counts for none). Agents and feeds are deliberately absent: both
    are team-scoped and have no project_id, so reporting zero for them would
    read as "this project has no agents" rather than "agents do not belong to
    projects". Comments and attachments are absent too: they reach a project
    only indirectly, through the resource they are attached to.
  required:
    - prompts
    - artifacts
    - memories
    - blueprints
    - feed_items
    - total
  properties:
    prompts:
      type: integer
      format: int64
      example: 12
    artifacts:
      type: integer
      format: int64
      example: 4
    memories:
      type: integer
      format: int64
      example: 27
    blueprints:
      type: integer
      format: int64
      example: 3
    feed_items:
      type: integer
      format: int64
      example: 9
    total:
      type: integer
      format: int64
      description: Sum of the five project-scoped counts.
      example: 55

AdminProjectDetail:
  type: object
  description: A single project with its team, owner and resource counts (GET /api/v1/admin/projects/{id}).
  required:
    - id
    - name
    - slug
    - description
    - git_url
    - homepage
    - team
    - owner
    - resource_counts
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      example: "Platform"
    slug:
      type: string
      example: "platform"
    description:
      type: string
      description: Empty string when unset (the column defaults to '').
      example: "Core platform work"
    git_url:
      type: string
      description: Empty string when unset.
      example: "https://github.com/acme/platform"
    homepage:
      type: string
      description: Empty string when unset.
      example: "https://platform.acme.dev"
    team:
      $ref: '#/AdminProjectTeam'
    owner:
      allOf:
        - $ref: '#/AdminTeamOwner'
      description: The project's creator (projects.user_id); see AdminProjectListItem.owner.
    resource_counts:
      $ref: '#/AdminProjectResourceCounts'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

# ---------------------------------------------------------------------------
# Admin user detail insights (#1135). Counts, buckets and opaque ids only:
# no response here carries a resource title, slug or body.
# ---------------------------------------------------------------------------

AdminUserProjectResourceCounts:
  type: object
  description: |
    How many PROJECT-SCOPED resources the user authored in one project. Only the
    four types with a NOT NULL project_id are attributed to a project; every
    other type is counted at the team level only.
  required:
    - project_id
    - project_name
    - counts
  properties:
    project_id:
      type: string
      format: uuid
    project_name:
      type: string
      example: "Platform"
    counts:
      $ref: '#/AdminProjectResourceCounts'

AdminUserTeamResourceCounts:
  type: object
  description: How many resources the user authored in one team, with the per-project breakdown.
  required:
    - team_id
    - team_name
    - is_member
    - counts
    - projects
  properties:
    team_id:
      type: string
      format: uuid
    team_name:
      type: string
      example: "Acme"
    is_member:
      type: boolean
      description: |
        Whether the user is still a member of the team. A former member's
        authored resources stay in the team and are still counted here.
    counts:
      $ref: '#/AdminResourceCounts'
    projects:
      type: array
      description: Per-project counts, ordered by project name.
      items:
        $ref: '#/AdminUserProjectResourceCounts'

AdminUserInsights:
  type: object
  description: |
    Per-type counts of the resources one user authored, instance-wide, per team
    and per project (GET /api/v1/admin/users/{id}/insights). For every type the
    per-team counts sum to `totals`. An attachment whose author was deleted
    (user_id set to NULL) counts for nobody.
  required:
    - user_id
    - totals
    - teams
  properties:
    user_id:
      type: string
      format: uuid
    totals:
      $ref: '#/AdminResourceCounts'
    teams:
      type: array
      description: Teams the user authored at least one resource in, ordered by team name.
      items:
        $ref: '#/AdminUserTeamResourceCounts'

AdminUserCreationPoint:
  type: object
  description: How many resources of each type the user created within one time bucket.
  required:
    - bucket
    - prompts
    - memories
    - artifacts
    - blueprints
    - agents
    - feeds
    - feed_items
    - comments
    - attachments
  properties:
    bucket:
      type: string
      format: date-time
      description: Start of the bucket, in UTC.
    prompts:
      type: integer
      format: int64
    memories:
      type: integer
      format: int64
    artifacts:
      type: integer
      format: int64
    blueprints:
      type: integer
      format: int64
    agents:
      type: integer
      format: int64
    feeds:
      type: integer
      format: int64
    feed_items:
      type: integer
      format: int64
    comments:
      type: integer
      format: int64
    attachments:
      type: integer
      format: int64

AdminUserResourceCreationMetrics:
  type: object
  description: |
    Resources the user created per bucket, stacked by type
    (GET /api/v1/admin/users/{id}/resource-creation-metrics). Every bucket in
    the range is present with an explicit 0 for every type.
  required:
    - from
    - to
    - granularity
    - series
  properties:
    from:
      type: string
      format: date-time
      description: |
        Inclusive start of the range actually used, snapped DOWN to the start of
        its bucket (same rule as AdminTimeseriesResponse.from).
    to:
      type: string
      format: date-time
      description: Exclusive end of the range actually used (after defaulting); not snapped.
    granularity:
      type: string
      enum:
        - day
        - week
        - month
      description: Bucket size actually used.
    series:
      type: array
      description: One point per bucket, ascending by bucket.
      items:
        $ref: '#/AdminUserCreationPoint'

AdminUserTimelineEvent:
  type: object
  description: |
    One opaque timeline entry: which kind of resource the user created or last
    updated, where, and when. Deliberately carries no title, slug or content —
    only the first 8 characters of the resource id.
  required:
    - resource_type
    - action
    - team_id
    - team_name
    - project_id
    - project_name
    - resource_short_id
    - occurred_at
  properties:
    resource_type:
      type: string
      enum:
        - prompt
        - memory
        - artifact
        - blueprint
        - agent
        - feed
        - feed_item
        - comment
        - attachment
    action:
      type: string
      enum:
        - created
        - updated
    team_id:
      type: string
      format: uuid
    team_name:
      type: string
    project_id:
      type: string
      format: uuid
      nullable: true
      description: Null for team-scoped resources and for feed items posted without a project.
    project_name:
      type: string
      nullable: true
    resource_short_id:
      type: string
      description: First 8 characters of the resource id.
      example: "3f2a9c1e"
    occurred_at:
      type: string
      format: date-time

AdminUserTimelinePage:
  type: object
  description: One page of a user's resource timeline, newest first.
  required:
    - items
    - next_cursor
  properties:
    items:
      type: array
      items:
        $ref: '#/AdminUserTimelineEvent'
    next_cursor:
      type: string
      nullable: true
      description: Opaque cursor for the next page; null on the last page.

AdminUserNotificationPreferences:
  type: object
  description: |
    A user's notification preferences, read-only
    (GET /api/v1/admin/users/{id}/notification-preferences). When the user has
    never saved preferences, the defaults are returned with `is_default: true`
    and `updated_at: null`.
  required:
    - email_notification
    - notifications
    - updated_at
    - is_default
  properties:
    email_notification:
      $ref: '../openapi.yaml#/components/schemas/EmailNotificationPreferences'
    notifications:
      $ref: '../openapi.yaml#/components/schemas/NotificationPreferences'
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: When the user last saved their preferences; null when defaults are returned.
    is_default:
      type: boolean
      description: True when the user has no stored preferences and the defaults are shown.

AdminUserAccessMetrics:
  type: object
  description: |
    Resource accesses by the user per bucket and source, across every team
    (GET /api/v1/admin/users/{id}/resource-access-metrics). Every bucket in the
    range is present with an explicit 0 for each source that appears.
  required:
    - from
    - to
    - granularity
    - access_by_source
    - earliest_retained_at
  properties:
    from:
      type: string
      format: date-time
      description: |
        Inclusive start of the range actually used, snapped DOWN to the start of
        its bucket (same rule as AdminTimeseriesResponse.from).
    to:
      type: string
      format: date-time
      description: Exclusive end of the range actually used (after defaulting); not snapped.
    granularity:
      type: string
      enum:
        - day
        - week
        - month
      description: Bucket size actually used.
    access_by_source:
      type: array
      description: One point per (bucket, source), ascending by bucket then source.
      items:
        $ref: '#/AdminSourcePoint'
    earliest_retained_at:
      type: string
      format: date-time
      description: |
        Oldest access event still retained (now minus
        `retention.access_event_days`); buckets before it read as zeros.

AdminTopAccessedResource:
  type: object
  description: |
    One opaque most-accessed resource: its type, where it lives and how often
    the user accessed it (or, for a project, how often it was accessed).
    Deliberately carries no title, slug or content — only
    the first 8 characters of the resource id. The identity fields share their
    names with AdminUserTimelineEvent.
  required:
    - resource_type
    - resource_short_id
    - team_id
    - team_name
    - project_id
    - project_name
    - resource_deleted
    - access_count
  properties:
    resource_type:
      type: string
      enum:
        - prompt
        - artifact
        - blueprint
        - memory
        - project
        - agent
    resource_short_id:
      type: string
      description: First 8 characters of the resource id.
      example: "3f2a9c1e"
    team_id:
      type: string
      format: uuid
    team_name:
      type: string
    project_id:
      type: string
      format: uuid
      nullable: true
      description: |
        The resource's project (for a `project` row, the project itself). Null
        for agents and for deleted resources.
    project_name:
      type: string
      nullable: true
    resource_deleted:
      type: boolean
      description: |
        True when the resource no longer exists (access events outlive their
        resource until pruned). Always `false` for a project's top resources
        (GET /api/v1/admin/projects/{id}/top-accessed-resources), where a
        deleted resource has no current project and drops out.
    access_count:
      type: integer
      format: int64

AdminTopAccessedResourcesResponse:
  type: object
  description: |
    The resources a user accessed most in a range
    (GET /api/v1/admin/users/{id}/top-accessed-resources), or a project's
    most-accessed resources (GET /api/v1/admin/projects/{id}/top-accessed-resources).
  required:
    - from
    - to
    - items
    - earliest_retained_at
  properties:
    from:
      type: string
      format: date-time
      description: Inclusive start of the range actually used (after defaulting); not snapped.
    to:
      type: string
      format: date-time
      description: Exclusive end of the range actually used (after defaulting).
    items:
      type: array
      description: Most accessed first; ties broken by resource id.
      items:
        $ref: '#/AdminTopAccessedResource'
    earliest_retained_at:
      type: string
      format: date-time
      description: |
        Oldest access event still retained (now minus
        `retention.access_event_days`); accesses before it are not counted.

# --- Team configuration, read-only (#1140, epic #1131 decision 9) ---
#
# Every section below is an ADMIN-ONLY allowlisted DTO. None of them $ref a
# team-scoped schema (team-settings.yaml, freshness.yaml, types.yaml): a field
# added to a team response must not appear on the admin surface until it is
# deliberately added here too. The handler maps each field explicitly and a
# key-set test pins every response's exact shape.

AdminTeamConfigSource:
  type: string
  description: |
    Where the values in effect came from: `team` when the team stored its own
    profile, `instance` when it has none and inherits the deployment defaults.
  enum:
    - team
    - instance
  example: instance

AdminSearchValues:
  type: object
  description: A complete search ranking profile.
  additionalProperties: false
  required:
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
  properties:
    recency_ranking_enabled:
      type: boolean
    rank_weight_relevance:
      type: number
      format: double
    rank_weight_created:
      type: number
      format: double
    rank_weight_updated:
      type: number
      format: double
    rank_half_life_days:
      type: number
      format: double

AdminTeamSearchConfig:
  type: object
  description: A team's effective search ranking settings (GET /api/v1/admin/teams/{id}/config/search).
  additionalProperties: false
  required:
    - source
    - values
    - instance_defaults
    - rank_candidate_cap
  properties:
    source:
      $ref: '#/AdminTeamConfigSource'
    values:
      $ref: '#/AdminSearchValues'
    instance_defaults:
      $ref: '#/AdminSearchValues'
    rank_candidate_cap:
      type: integer
      description: Instance-owned cap on rows re-ranked per search; never team-configurable.

AdminAISummaryValues:
  type: object
  description: A complete AI summary profile.
  additionalProperties: false
  required:
    - enabled
    - model_provider_id
    - top_n
    - style
    - max_output_tokens
  properties:
    enabled:
      type: boolean
    model_provider_id:
      type: string
      format: uuid
      nullable: true
      description: The selected model provider; `null` means the team's default provider.
    top_n:
      type: integer
    style:
      type: string
      enum:
        - concise
        - balanced
        - detailed
    max_output_tokens:
      type: integer

AdminTeamAISummaryConfig:
  type: object
  description: A team's effective AI summary settings (GET /api/v1/admin/teams/{id}/config/ai-summary).
  additionalProperties: false
  required:
    - source
    - values
    - instance_defaults
    - model_provider_name
    - max_top_n
    - max_output_tokens_ceiling
    - available
  properties:
    source:
      $ref: '#/AdminTeamConfigSource'
    values:
      $ref: '#/AdminAISummaryValues'
    instance_defaults:
      $ref: '#/AdminAISummaryValues'
    model_provider_name:
      type: string
      nullable: true
      description: |
        Name of the provider `values.model_provider_id` selects. `null` when no
        provider is selected or the id no longer resolves to one of the team's
        providers.
    max_top_n:
      type: integer
      deprecated: true
      x-deprecated-reason: Reports the hard code limit; kept for client compatibility until a later minor removes it (#1199).
      description: >
        The hard code limit on `top_n` (always 10); kept for client
        compatibility, to be removed in a later minor.
    max_output_tokens_ceiling:
      type: integer
      deprecated: true
      x-deprecated-reason: Reports the hard code limit; kept for client compatibility until a later minor removes it (#1199).
      description: >
        The hard code limit on `max_output_tokens` (always 32768); kept for
        client compatibility, to be removed in a later minor.
    available:
      type: boolean
      description: Whether the team has at least one model provider (existence, not health).

AdminFreshnessValues:
  type: object
  description: A team's freshness evaluation settings.
  additionalProperties: false
  required:
    - interval_seconds
    - reversibility_enabled
  properties:
    interval_seconds:
      type: integer
    reversibility_enabled:
      type: boolean

AdminFreshnessRule:
  type: object
  description: One freshness rule.
  additionalProperties: false
  required:
    - id
    - project_id
    - resource_types
    - mediums
    - threshold_days
    - enabled
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
      nullable: true
      description: The project the rule is scoped to; `null` for a team-wide rule.
    resource_types:
      type: array
      items:
        type: string
    mediums:
      type: array
      description: Access mediums that count as "accessed". Empty means any medium.
      items:
        type: string
    threshold_days:
      type: integer
    enabled:
      type: boolean
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminTeamFreshnessConfig:
  type: object
  description: A team's freshness settings and rules (GET /api/v1/admin/teams/{id}/config/freshness).
  additionalProperties: false
  required:
    - source
    - values
    - defaults
    - rules
  properties:
    source:
      $ref: '#/AdminTeamConfigSource'
    values:
      $ref: '#/AdminFreshnessValues'
    defaults:
      $ref: '#/AdminFreshnessValues'
    rules:
      type: array
      description: Every rule, oldest first. `[]` when the team has none.
      items:
        $ref: '#/AdminFreshnessRule'

AdminArtifactType:
  type: object
  description: One artifact type visible to the team.
  additionalProperties: false
  required:
    - id
    - slug
    - name
    - is_system
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    name:
      type: string
    is_system:
      type: boolean
      description: True for a global system default, false for the team's own custom type.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminTeamArtifactTypes:
  type: object
  description: The artifact types a team sees (GET /api/v1/admin/teams/{id}/config/artifact-types).
  additionalProperties: false
  required:
    - types
  properties:
    types:
      type: array
      description: System types first, then custom types, each by name.
      items:
        $ref: '#/AdminArtifactType'

AdminTeamSettingsAuditEntry:
  type: object
  description: One recorded settings copy into the team.
  additionalProperties: false
  required:
    - id
    - surface
    - actor_user_id
    - actor_name
    - source_team_id
    - source_team_name
    - source_resource_id
    - created_resource_id
    - detail
    - created_at
  properties:
    id:
      type: string
      format: uuid
    surface:
      type: string
      enum:
        - embedding_provider
        - model_provider
        - custom_types
    actor_user_id:
      type: string
      format: uuid
      nullable: true
    actor_name:
      type: string
      nullable: true
    source_team_id:
      type: string
      format: uuid
      nullable: true
    source_team_name:
      type: string
      nullable: true
    source_resource_id:
      type: string
      format: uuid
      nullable: true
    created_resource_id:
      type: string
      format: uuid
      nullable: true
    detail:
      type: object
      additionalProperties: true
      description: |
        Surface-specific facts, filtered to a per-surface key allowlist
        (model_provider: source_name, created_name, provider_type, model,
        has_api_key; embedding_provider: the same plus becomes_active,
        displaced_model, displaced_embedded_resources; custom_types: added_ids,
        added_slugs, skipped_slugs). Any other stored key is dropped. Always an
        object, never null.
    created_at:
      type: string
      format: date-time

AdminTeamSettingsAuditListResponse:
  type: object
  description: A page of the team's settings audit log, newest first.
  additionalProperties: false
  required:
    - entries
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    entries:
      type: array
      description: Serializes as `[]` when the page is empty, never `null`.
      items:
        $ref: '#/AdminTeamSettingsAuditEntry'
    total_count:
      type: integer
    page:
      type: integer
    per_page:
      type: integer
    total_pages:
      type: integer

# --- Team configuration, read-only, part 2: credential-bearing sections (#1141) ---
#
# Same rule as part 1, with an explicit redaction allowlist (epic #1131
# decision 10): there is NO field here for any secret. Encrypted credentials
# surface only as `has_*` booleans, provider `configuration` only as its sorted
# top-level key names, free-text base URLs without userinfo/query/fragment, the
# email provider without its last error text or SMTP username, and the GitHub
# App without its webhook URL or routing token.

AdminModelProvider:
  type: object
  description: One model (LLM) provider, credentials redacted.
  additionalProperties: false
  required:
    - id
    - name
    - provider_type
    - model
    - base_url
    - is_default
    - has_api_key
    - configuration_keys
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    provider_type:
      type: string
    model:
      type: string
    base_url:
      type: string
      nullable: true
      description: |
        The provider's base URL with any userinfo, query string and fragment
        removed. `null` when unset or not an absolute URL.
    is_default:
      type: boolean
    has_api_key:
      type: boolean
      description: Whether an API key is stored. The key itself is never returned.
    configuration_keys:
      type: array
      description: |
        Sorted top-level key names of the provider's `configuration` object. The
        values are never returned. `[]` when the configuration is empty or not a
        JSON object.
      items:
        type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminTeamModelProvidersConfig:
  type: object
  description: A team's model providers (GET /api/v1/admin/teams/{id}/config/model-providers).
  additionalProperties: false
  required:
    - providers
  properties:
    providers:
      type: array
      description: Serializes as `[]` when the team has none, never `null`.
      items:
        $ref: '#/AdminModelProvider'

AdminEmbeddingProvider:
  type: object
  description: One embedding provider, credentials redacted.
  additionalProperties: false
  required:
    - id
    - name
    - provider_type
    - model
    - chunk_size
    - chunk_overlap
    - concurrency
    - query_prefix
    - document_prefix
    - base_url
    - is_default
    - has_api_key
    - configuration_keys
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    provider_type:
      type: string
    model:
      type: string
    chunk_size:
      type: integer
    chunk_overlap:
      type: integer
    concurrency:
      type: integer
    query_prefix:
      type: string
      nullable: true
    document_prefix:
      type: string
      nullable: true
    base_url:
      type: string
      nullable: true
      description: |
        The provider's base URL with any userinfo, query string and fragment
        removed. `null` when unset or not an absolute URL.
    is_default:
      type: boolean
    has_api_key:
      type: boolean
      description: Whether an API key is stored. The key itself is never returned.
    configuration_keys:
      type: array
      description: |
        Sorted top-level key names of the provider's `configuration` object. The
        values are never returned. `[]` when the configuration is empty or not a
        JSON object.
      items:
        type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminEmbeddingCoverageItem:
  type: object
  description: Embedding coverage for one entity type (counts only).
  additionalProperties: false
  required:
    - entity_type
    - total
    - embedded
    - pending
    - embedded_percent
  properties:
    entity_type:
      type: string
    total:
      type: integer
      format: int64
    embedded:
      type: integer
      format: int64
    pending:
      type: integer
      format: int64
    embedded_percent:
      type: integer

AdminEmbeddingCoverage:
  type: object
  description: |
    How much of the team's embeddable content has an embedding under its active
    provider's model.
  additionalProperties: false
  required:
    - has_active_provider
    - active_model
    - items
  properties:
    has_active_provider:
      type: boolean
    active_model:
      type: string
      nullable: true
      description: The active provider's model; `null` when the team has no provider.
    items:
      type: array
      description: One entry per entity type. Serializes as `[]`, never `null`.
      items:
        $ref: '#/AdminEmbeddingCoverageItem'

AdminTeamEmbeddingProvidersConfig:
  type: object
  description: |
    A team's embedding providers and embedding coverage
    (GET /api/v1/admin/teams/{id}/config/embedding-providers).
  additionalProperties: false
  required:
    - providers
    - coverage
  properties:
    providers:
      type: array
      description: Serializes as `[]` when the team has none, never `null`.
      items:
        $ref: '#/AdminEmbeddingProvider'
    coverage:
      $ref: '#/AdminEmbeddingCoverage'

AdminSMTPSettings:
  type: object
  description: Non-secret SMTP settings. The SMTP username is deliberately omitted.
  additionalProperties: false
  required:
    - host
    - port
  properties:
    host:
      type: string
    port:
      type: string

AdminMailgunSettings:
  type: object
  description: Non-secret Mailgun settings.
  additionalProperties: false
  required:
    - domain
    - base_url
  properties:
    domain:
      type: string
    base_url:
      type: string
      nullable: true
      description: |
        The Mailgun API base URL with any userinfo, query string and fragment
        removed. `null` when unset or not an absolute URL.

AdminPostmarkSettings:
  type: object
  description: Non-secret Postmark settings.
  additionalProperties: false
  required:
    - message_stream
  properties:
    message_stream:
      type: string

AdminEmailSettings:
  type: object
  description: The team provider's non-secret settings; only the block matching its type is present.
  additionalProperties: false
  properties:
    smtp:
      $ref: '#/AdminSMTPSettings'
    mailgun:
      $ref: '#/AdminMailgunSettings'
    postmark:
      $ref: '#/AdminPostmarkSettings'

AdminTeamEmailProviderConfig:
  type: object
  description: |
    A team's effective email provider (GET /api/v1/admin/teams/{id}/config/email-provider).
    The provider's secret, its last error text and the SMTP username are never
    returned.
  additionalProperties: false
  required:
    - configured
    - source
    - effective_from_address
    - provider_type
    - from_address
    - from_name
    - reply_to
    - settings
    - has_secret
    - last_success_at
    - last_error_at
    - status
  properties:
    configured:
      type: boolean
      description: Whether the team has its own provider.
    source:
      $ref: '#/AdminTeamConfigSource'
    effective_from_address:
      type: string
      description: The address the team's mail is actually sent from.
    provider_type:
      type: string
      nullable: true
      description: The team provider's type; `null` when inheriting the instance provider.
    from_address:
      type: string
      nullable: true
    from_name:
      type: string
      nullable: true
    reply_to:
      type: string
      nullable: true
    settings:
      allOf:
        - $ref: '#/AdminEmailSettings'
      nullable: true
      description: |
        `null` when inheriting the instance provider, or when the stored settings
        could not be decoded.
    has_secret:
      type: boolean
      description: Whether a provider credential is stored. The credential itself is never returned.
    last_success_at:
      type: string
      format: date-time
      nullable: true
    last_error_at:
      type: string
      format: date-time
      nullable: true
    status:
      type: string
      description: |
        Derived from the two timestamps: `unknown` when inheriting or never used,
        `healthy` when the last send succeeded (or none failed), `failing` when
        the last recorded send failed.
      enum:
        - healthy
        - failing
        - unknown

AdminGitHubAppConfig:
  type: object
  description: A team's GitHub App registration, secrets redacted.
  additionalProperties: false
  required:
    - id
    - app_id
    - app_slug
    - client_id
    - has_private_key
    - has_client_secret
    - has_webhook_secret
    - webhook_configured
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
    app_id:
      type: string
    app_slug:
      type: string
    client_id:
      type: string
    has_private_key:
      type: boolean
    has_client_secret:
      type: boolean
    has_webhook_secret:
      type: boolean
    webhook_configured:
      type: boolean
      description: |
        Whether VibeXP can give GitHub a webhook delivery URL for this App (a
        routing token exists and the instance has a public base URL). It does
        NOT mean GitHub is delivering. The URL itself is never returned.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

AdminGitHubInstallation:
  type: object
  description: The team's GitHub App installation, as last recorded (no live GitHub call).
  additionalProperties: false
  required:
    - installed
    - account_login
    - installation_id
    - suspended
    - installed_at
  properties:
    installed:
      type: boolean
    account_login:
      type: string
      nullable: true
      description: The GitHub account the App is installed on; `null` when not installed.
    installation_id:
      type: integer
      format: int64
      nullable: true
      description: '`null` when not installed.'
    suspended:
      type: boolean
    installed_at:
      type: string
      format: date-time
      nullable: true
      description: '`null` when not installed.'

AdminTeamGitHubConfig:
  type: object
  description: A team's GitHub integration (GET /api/v1/admin/teams/{id}/config/github).
  additionalProperties: false
  required:
    - app_config
    - installation
  properties:
    app_config:
      allOf:
        - $ref: '#/AdminGitHubAppConfig'
      nullable: true
      description: '`null` when the team has not registered a GitHub App.'
    installation:
      $ref: '#/AdminGitHubInstallation'

# --- Project detail analytics and configuration, read-only (#1145) ---

AdminProjectCreationPoint:
  type: object
  description: How many resources of each project-scoped type were created in the project within one time bucket.
  required:
    - bucket
    - prompts
    - memories
    - artifacts
    - blueprints
    - feed_items
  properties:
    bucket:
      type: string
      format: date-time
      description: Start of the bucket, in UTC.
    prompts:
      type: integer
      format: int64
    memories:
      type: integer
      format: int64
    artifacts:
      type: integer
      format: int64
    blueprints:
      type: integer
      format: int64
    feed_items:
      type: integer
      format: int64

AdminProjectResourceCreationMetrics:
  type: object
  description: |
    Resources created in the project per bucket, stacked by type
    (GET /api/v1/admin/projects/{id}/resource-creation-metrics). Every bucket in
    the range is present with an explicit 0 for every type.
  required:
    - from
    - to
    - granularity
    - series
  properties:
    from:
      type: string
      format: date-time
      description: |
        Inclusive start of the range actually used, snapped DOWN to the start of
        its bucket (same rule as AdminTimeseriesResponse.from).
    to:
      type: string
      format: date-time
      description: Exclusive end of the range actually used (after defaulting); not snapped.
    granularity:
      type: string
      enum:
        - day
        - week
        - month
      description: Bucket size actually used.
    series:
      type: array
      description: One point per bucket, ascending by bucket.
      items:
        $ref: '#/AdminProjectCreationPoint'

AdminProjectAccessMetrics:
  type: object
  description: |
    Accesses to the project's resources and to the project itself per bucket and
    source (GET /api/v1/admin/projects/{id}/resource-access-metrics). An event
    is attributed to the project its resource belongs to now, so accesses to a
    deleted resource drop out and a migrated resource brings its history with
    it. Every bucket in the range is present with an explicit 0 for each source
    that appears.
  required:
    - from
    - to
    - granularity
    - access_by_source
    - earliest_retained_at
  properties:
    from:
      type: string
      format: date-time
      description: |
        Inclusive start of the range actually used, snapped DOWN to the start of
        its bucket (same rule as AdminTimeseriesResponse.from).
    to:
      type: string
      format: date-time
      description: Exclusive end of the range actually used (after defaulting); not snapped.
    granularity:
      type: string
      enum:
        - day
        - week
        - month
      description: Bucket size actually used.
    access_by_source:
      type: array
      description: One point per (bucket, source), ascending by bucket then source.
      items:
        $ref: '#/AdminSourcePoint'
    earliest_retained_at:
      type: string
      format: date-time
      description: |
        Oldest access event still retained (now minus
        `retention.access_event_days`); buckets before it read as zeros.

AdminProjectConfig:
  type: object
  description: |
    The configuration that applies to a project
    (GET /api/v1/admin/projects/{id}/config): the freshness rules scoped to it
    and the team-wide rules that also apply. Both lists are oldest first and
    include disabled rules.
  additionalProperties: false
  required:
    - project_rules
    - team_wide_rules
  properties:
    project_rules:
      type: array
      description: Rules scoped to this project. `[]` when there are none.
      items:
        $ref: '#/AdminFreshnessRule'
    team_wide_rules:
      type: array
      description: Rules with no project scope, which apply to every project of the team. `[]` when there are none.
      items:
        $ref: '#/AdminFreshnessRule'

AdminSavedFilterListName:
  type: string
  description: The admin list a set of saved filter presets belongs to.
  enum:
    - users
    - teams
    - projects

AdminSavedFilterQuery:
  type: object
  description: |
    The list's filter state as URL query parameters (parameter name → value).
    Stored as given and never executed server-side; the client owns its meaning.
    At most 40 keys, each matching `^[a-z0-9_]{1,64}$`, each value at most 512
    characters.
  maxProperties: 40
  additionalProperties:
    type: string
    maxLength: 512
  example:
    status: suspended
    sort_by: created_at

AdminSavedFilterPreset:
  type: object
  description: One named filter preset saved by an instance admin.
  additionalProperties: false
  required:
    - id
    - name
    - query
  properties:
    id:
      type: string
      format: uuid
      description: Stable preset id. Kept across renames.
    name:
      type: string
      minLength: 1
      maxLength: 80
      description: Display name, unique (case-insensitively) within the list.
      example: "Dormant teams"
    query:
      $ref: '#/AdminSavedFilterQuery'

AdminSavedFilterPresetInput:
  type: object
  description: |
    A preset as sent in a replace request. Omit `id` for a new preset and the
    server assigns one; send the existing `id` to keep it (e.g. on rename).
  additionalProperties: false
  required:
    - name
    - query
  properties:
    id:
      type: string
      format: uuid
      description: Existing preset id to keep; omitted for a new preset.
    name:
      type: string
      minLength: 1
      maxLength: 80
      description: |
        Display name. Surrounding whitespace is trimmed; must be unique
        (case-insensitively) within the list.
      example: "Dormant teams"
    query:
      $ref: '#/AdminSavedFilterQuery'

AdminSavedFilters:
  type: object
  description: |
    The calling instance admin's saved filter presets for one admin list
    (GET/PUT /api/v1/admin/saved-filters/{list}). Presets are private to the
    admin who saved them.
  additionalProperties: false
  required:
    - list
    - presets
    - version
  properties:
    list:
      $ref: '#/AdminSavedFilterListName'
    presets:
      type: array
      maxItems: 20
      description: The presets in their saved order. `[]` when there are none.
      items:
        $ref: '#/AdminSavedFilterPreset'
    version:
      type: integer
      format: int64
      minimum: 0
      description: |
        Optimistic-lock version of the admin's preferences record. `0` when
        nothing has been saved yet. Send it back unchanged in the next replace
        request; it is shared with the user's other preferences, so a change
        made elsewhere also advances it.

AdminSavedFiltersReplaceRequest:
  type: object
  description: |
    Replaces the whole preset list for one admin list. Renaming and deleting are
    done by sending the edited list.
  additionalProperties: false
  required:
    - presets
    - version
  properties:
    presets:
      type: array
      maxItems: 20
      description: The complete new preset list, in order (at most 20).
      items:
        $ref: '#/AdminSavedFilterPresetInput'
    version:
      type: integer
      format: int64
      minimum: 0
      description: |
        The `version` last read. A stale value is rejected with 409 and nothing
        is saved.

# --- Instance email settings (#1189, epic #1185) ----------------------------
#
# Secret discipline, as in schemas/team-email-provider.yaml: `secret` appears
# ONLY on the two request schemas. No response schema has a field able to carry
# it; reads expose `has_credential` instead.

AdminInstanceEmailProviderType:
  type: string
  description: Which provider the instance sends through. Matched case-insensitively.
  enum:
    - smtp
    - mailgun
    - postmark
    - sendgrid
  example: "smtp"

AdminInstanceEmailSettingsRequest:
  type: object
  description: |
    The instance's email provider configuration. This is an upsert, so the same
    body creates or replaces. The per-type `settings` and the write-only
    `secret` follow the team email provider request exactly. A body carrying an
    unknown field is rejected with 400.
  additionalProperties: false
  required:
    - provider_type
    - from_address
  properties:
    provider_type:
      $ref: '#/AdminInstanceEmailProviderType'
    settings:
      $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderSettings'
    secret:
      type: string
      description: |
        The provider's single credential (SMTP password, Mailgun sending key,
        Postmark server token, or SendGrid API key). It is write-only: never
        returned by any endpoint.

        OMIT it to keep the stored credential, which is allowed only when the
        provider type is unchanged; a new configuration or a change of provider
        type must carry its own, except SMTP, where omitting it configures an
        unauthenticated relay (no credential is stored and no AUTH is
        attempted). An explicitly empty string is rejected.
      example: "key-abc123"
    from_address:
      type: string
      format: email
      description: The address instance mail is sent from.
      example: "noreply@vibexp.example.com"
    from_name:
      type: string
      nullable: true
      description: Optional display name shown beside the from address.
      example: "VibeXP"
    reply_to:
      type: string
      format: email
      nullable: true
      description: Optional Reply-To address.
      example: "support@vibexp.example.com"
    contact_recipient_address:
      type: string
      format: email
      nullable: true
      description: |
        Where the contact form delivers. Omitted or null falls back to the from
        address.
      example: "hello@vibexp.example.com"
    privacy_policy_url:
      type: string
      nullable: true
      description: |
        Absolute http(s) URL of the privacy policy linked from outbound mail.
        Omitted or null links none.
      example: "https://vibexp.example.com/privacy"

AdminInstanceEmailTestRequest:
  type: object
  description: |
    An optional candidate configuration for a test send. An empty body (or an
    empty object) tests the STORED configuration. A body with any field set is
    tested as a full configuration, validated like an upsert; if it omits
    `secret`, the stored credential is used only when the candidate targets
    the same destination (same provider type and, for SMTP, the same
    host/port/username; for Mailgun, the same domain/base URL).

    There is no recipient field: the test message always goes to the calling
    admin's own account email. A body carrying an unknown field is rejected
    with 400.
  additionalProperties: false
  properties:
    provider_type:
      $ref: '#/AdminInstanceEmailProviderType'
    settings:
      $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderSettings'
    secret:
      type: string
      description: |
        The candidate credential. Omit it to test with the stored credential
        (same destination only, see above); an SMTP candidate with no
        credential to reuse is tested as an unauthenticated relay. Never
        returned.
      example: "key-abc123"
    from_address:
      type: string
      format: email
      description: The from address to test with.
      example: "noreply@vibexp.example.com"
    from_name:
      type: string
      nullable: true
      description: Optional display name to test with.
      example: "VibeXP"
    reply_to:
      type: string
      format: email
      nullable: true
      description: Optional Reply-To address to test with.
      example: "support@vibexp.example.com"
    contact_recipient_address:
      type: string
      format: email
      nullable: true
      description: Accepted for parity with the upsert body; a test send does not use it.
      example: "hello@vibexp.example.com"
    privacy_policy_url:
      type: string
      nullable: true
      description: Accepted for parity with the upsert body; a test send does not use it.
      example: "https://vibexp.example.com/privacy"

AdminInstanceEmailSettings:
  type: object
  description: |
    The instance's stored email configuration. This is never a 404: an
    instance with nothing stored reports `configured: false`, with every other
    field null or absent, and discards its mail.

    No field here can carry the credential; `has_credential` reports only that
    one is stored.
  additionalProperties: false
  required:
    - configured
    - provider_type
    - has_credential
    - is_healthy
  properties:
    configured:
      type: boolean
      description: Whether an instance email provider is stored.
      example: true
    provider_type:
      type: string
      nullable: true
      description: The stored provider type, or null when nothing is configured.
      enum:
        - smtp
        - mailgun
        - postmark
        - sendgrid
        - null
      example: "smtp"
    settings:
      $ref: '../openapi.yaml#/components/schemas/TeamEmailProviderSettings'
    has_credential:
      type: boolean
      description: |
        Whether a credential is stored. The credential itself is never
        returned. An SMTP relay without authentication legitimately has none.
      example: true
    from_address:
      type: string
      nullable: true
      description: The configured from address; null when nothing is configured.
      example: "noreply@vibexp.example.com"
    from_name:
      type: string
      nullable: true
      description: The configured display name.
      example: "VibeXP"
    reply_to:
      type: string
      nullable: true
      description: The configured Reply-To address.
      example: "support@vibexp.example.com"
    contact_recipient_address:
      type: string
      nullable: true
      description: Where the contact form delivers; null falls back to the from address.
      example: "hello@vibexp.example.com"
    privacy_policy_url:
      type: string
      nullable: true
      description: The privacy policy URL linked from outbound mail; null links none.
      example: "https://vibexp.example.com/privacy"
    is_healthy:
      type: boolean
      nullable: true
      description: |
        Whether the last observed send succeeded, derived by comparing
        `last_success_at` with `last_error_at` (a provider that has never sent
        is healthy). Null when nothing is configured.
      example: true
    last_success_at:
      type: string
      format: date-time
      nullable: true
      description: When a send through the instance provider last succeeded.
    last_error:
      type: string
      nullable: true
      description: |
        The last delivery error, retained after recovery for diagnosis; use
        `is_healthy` to tell whether the provider is currently failing.
      example: "smtp: connection refused"
    last_error_at:
      type: string
      format: date-time
      nullable: true
      description: When the last delivery error occurred.
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: When the configuration was last saved; null when nothing is configured.
    updated_by:
      type: string
      format: uuid
      nullable: true
      description: |
        The admin who last saved the configuration. Null for the boot-time
        import from config.yaml, or once that user has been deleted.

AdminInstanceSettingsAuditEntry:
  type: object
  description: |
    One append-only change to an instance setting. `before` and `after` are
    snapshots of the setting's values, filtered to that setting's allowlisted
    keys, and never contain a credential. For `email_provider` they report
    only `has_credential` and, on an upsert's `after`, a `secret` marker
    saying whether the credential was `changed` or `unchanged`; the `search`
    and `ai_summary` snapshots are the settings' values, which hold no
    credential. For `auth_providers` each entry is one provider, reporting
    only `has_client_secret` and, on an upsert's `after`, a `client_secret`
    marker (`changed` or `unchanged`); `auth_allowlist`, `instance_admins`
    and `auth_setup` snapshots hold no credential (the setup token and its
    hash are never recorded). A snapshot of any of these four settings
    carries `source: cli` when the change was made by the `vibexp admin auth`
    commands rather than through this API.
  additionalProperties: false
  required:
    - id
    - setting
    - action
    - actor_user_id
    - actor_name
    - before
    - after
    - created_at
  properties:
    id:
      type: string
      format: uuid
      description: Audit entry id.
    setting:
      type: string
      description: The instance setting the entry describes.
      enum:
        - email_provider
        - search
        - ai_summary
        - auth_providers
        - auth_allowlist
        - instance_admins
        - auth_setup
      # Explicit constant names: generated clients emit every schema into one
      # package, so bare names risk colliding with another enum's values.
      x-enum-varnames:
        - AdminInstanceSettingsAuditEntrySettingEmailProvider
        - AdminInstanceSettingsAuditEntrySettingSearch
        - AdminInstanceSettingsAuditEntrySettingAiSummary
        - AdminInstanceSettingsAuditEntrySettingAuthProviders
        - AdminInstanceSettingsAuditEntrySettingAuthAllowlist
        - AdminInstanceSettingsAuditEntrySettingInstanceAdmins
        - AdminInstanceSettingsAuditEntrySettingAuthSetup
      example: "email_provider"
    action:
      type: string
      description: |
        `upsert` (created or replaced by an admin), `delete` (removed by an
        admin) or `import` (the boot-time import from config.yaml, which has no
        actor).
      enum:
        - upsert
        - delete
        - import
      example: "upsert"
    actor_user_id:
      type: string
      format: uuid
      nullable: true
      description: |
        The admin who made the change. Null for an import, or once that user
        has been deleted.
    actor_name:
      type: string
      nullable: true
      description: The actor's display name (or email), when it could be resolved.
      example: "Ada Admin"
    before:
      type: object
      nullable: true
      additionalProperties: true
      description: The redacted setting before the change; null when the change created it.
    after:
      type: object
      nullable: true
      additionalProperties: true
      description: The redacted setting after the change; null when the change deleted it.
    created_at:
      type: string
      format: date-time
      description: When the change was made.

AdminInstanceSettingsAuditPage:
  type: object
  description: One page of an instance setting's audit log, newest first.
  additionalProperties: false
  required:
    - entries
    - next_cursor
  properties:
    entries:
      type: array
      items:
        $ref: '#/AdminInstanceSettingsAuditEntry'
    next_cursor:
      type: string
      nullable: true
      description: Opaque cursor for the next page; null on the last page.

AdminInstanceSettingsSource:
  type: string
  description: |
    Where the instance values come from: `instance` when an instance admin (or
    the boot-time config import) stored them, `default` when nothing is stored
    and the built-in defaults apply.
  enum:
    - instance
    - default
  # Explicit constant names, for the same reason as AdminInstanceAISummaryStyle.
  x-enum-varnames:
    - AdminInstanceSettingsSourceInstance
    - AdminInstanceSettingsSourceDefault
  example: instance

AdminInstanceSearchValues:
  type: object
  description: |
    The instance search ranking defaults. Every team without its own search
    settings ranks with these; `rank_candidate_cap` is instance-only and applies
    to every team.
  additionalProperties: false
  required:
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
    - rank_candidate_cap
  properties:
    recency_ranking_enabled:
      type: boolean
      description: Whether search results are re-ranked by recency.
      example: false
    rank_weight_relevance:
      type: number
      format: double
      minimum: 0
      description: Weight of semantic relevance. The three weights must not all be zero.
      example: 0.5
    rank_weight_created:
      type: number
      format: double
      minimum: 0
      description: Weight of creation recency.
      example: 0.3
    rank_weight_updated:
      type: number
      format: double
      minimum: 0
      description: Weight of update recency.
      example: 0.2
    rank_half_life_days:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 36500
      description: Recency half-life in days.
      example: 90
    rank_candidate_cap:
      type: integer
      minimum: 1
      maximum: 5000
      description: How many rows are pulled and re-ranked per search.
      example: 200

AdminInstanceSearchLimits:
  type: object
  description: The hard bounds the search values are validated against, for form validation.
  additionalProperties: false
  required:
    - rank_weight_min
    - rank_half_life_days_max
    - rank_candidate_cap_min
    - rank_candidate_cap_max
  properties:
    rank_weight_min:
      type: number
      format: double
      description: The smallest allowed weight. The three weights must also not all be zero.
      example: 0
    rank_half_life_days_max:
      type: number
      format: double
      description: The largest allowed half-life, in days. The half-life must also be positive.
      example: 36500
    rank_candidate_cap_min:
      type: integer
      example: 1
    rank_candidate_cap_max:
      type: integer
      example: 5000

AdminInstanceSearchSettings:
  type: object
  description: |
    The instance search ranking defaults in effect, where they come from and
    how many teams ignore them because they store search settings of their own.
  additionalProperties: false
  required:
    - values
    - source
    - built_in_defaults
    - limits
    - teams_with_override
    - updated_at
    - updated_by_user_id
    - updated_by_name
    - version
  properties:
    values:
      $ref: '#/AdminInstanceSearchValues'
    source:
      $ref: '#/AdminInstanceSettingsSource'
    built_in_defaults:
      $ref: '#/AdminInstanceSearchValues'
    limits:
      $ref: '#/AdminInstanceSearchLimits'
    teams_with_override:
      type: integer
      description: How many teams store search settings of their own, so a change here does not reach them.
      example: 3
    updated_at:
      type: string
      format: date-time
      nullable: true
      description: When the values were last stored; null when `source` is `default`.
    updated_by_user_id:
      type: string
      format: uuid
      nullable: true
      description: |
        The admin who last stored the values. Null when `source` is `default`,
        for the boot-time import, or once that user has been deleted.
    updated_by_name:
      type: string
      nullable: true
      description: That admin's display name (or email), when it could be resolved.
    version:
      type: integer
      format: int64
      nullable: true
      description: |
        The stored row's optimistic-lock version; null when nothing is stored.
        Send it back as `expected_version` (`0` when it is null) to reject a
        save that would overwrite someone else's change.
      example: 4

AdminInstanceSearchSettingsUpdate:
  type: object
  description: |
    A whole replacement of the instance search ranking defaults. Every value is
    required. `expected_version` is optional and makes the save a
    compare-and-set:

    - omitted or null: last-write-wins, never a conflict.
    - `0`: nothing may be stored yet; the save is rejected with 409 when a row
      is stored. Send it when the `version` last read was null.
    - a positive value: the save is rejected with 409 unless it equals the
      stored `version`, and also when nothing is stored.
  additionalProperties: false
  required:
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
    - rank_candidate_cap
  properties:
    recency_ranking_enabled:
      type: boolean
    rank_weight_relevance:
      type: number
      format: double
      minimum: 0
    rank_weight_created:
      type: number
      format: double
      minimum: 0
    rank_weight_updated:
      type: number
      format: double
      minimum: 0
    rank_half_life_days:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      maximum: 36500
    rank_candidate_cap:
      type: integer
      minimum: 1
      maximum: 5000
    expected_version:
      type: integer
      format: int64
      minimum: 0
      nullable: true
      description: |
        The `version` the caller last read. Send `0` when that `version` was
        null, to save only while nothing is stored. Omit it or send null for
        last-write-wins.

AdminInstanceAISummaryStyle:
  type: string
  description: How detailed a summary is.
  enum:
    - concise
    - balanced
    - detailed
  # Explicit constant names: generated clients emit every schema into one
  # package, and a bare `Balanced`/`Concise`/`Detailed` would collide with
  # the team settings style enum and rename its existing constants.
  x-enum-varnames:
    - AdminInstanceAISummaryStyleConcise
    - AdminInstanceAISummaryStyleBalanced
    - AdminInstanceAISummaryStyleDetailed
  example: balanced

AdminInstanceAISummaryValues:
  type: object
  description: |
    The instance AI summary defaults and budgets. `enabled`, `top_n`, `style`
    and `max_output_tokens` are the defaults every team without its own AI
    summary settings uses; the character budgets and the request timeout are
    instance-only and apply to every team.
  additionalProperties: false
  required:
    - enabled
    - top_n
    - style
    - max_output_tokens
    - per_document_chars
    - total_context_chars
    - request_timeout_ms
  properties:
    enabled:
      type: boolean
      example: true
    top_n:
      type: integer
      minimum: 1
      maximum: 10
      description: How many search results a summary reads.
      example: 5
    style:
      $ref: '#/AdminInstanceAISummaryStyle'
    max_output_tokens:
      type: integer
      minimum: 1
      maximum: 32768
      example: 800
    per_document_chars:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: How many characters of each document a summary reads.
      example: 8000
    total_context_chars:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: The total character budget of one summary's context; at least `per_document_chars`.
      example: 32000
    request_timeout_ms:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: The summary request timeout, in milliseconds.
      example: 60000

AdminInstanceAISummaryLimits:
  type: object
  description: The hard bounds the AI summary values are validated against, for form validation.
  additionalProperties: false
  required:
    - top_n_min
    - top_n_max
    - max_output_tokens_min
    - max_output_tokens_max
