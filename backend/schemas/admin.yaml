      type: integer
      example: 1
    top_n_max:
      type: integer
      example: 10
    max_output_tokens_min:
      type: integer
      example: 1
    max_output_tokens_max:
      type: integer
      example: 32768
    chars_min:
      type: integer
      description: The smallest allowed character budget. `total_context_chars` must also be at least `per_document_chars`.
      example: 1
    chars_max:
      type: integer
      example: 2147483647
    request_timeout_ms_min:
      type: integer
      example: 1
    request_timeout_ms_max:
      type: integer
      example: 2147483647

AdminInstanceAISummarySettings:
  type: object
  description: |
    The instance AI summary defaults in effect, where they come from and how
