    updated_at:
      type: string
      format: date-time
      nullable: true
      description: When the values were last stored; null when `source` is `default`.
    updated_by_user_id:
      type: string
      format: uuid
      nullable: true
      description: |
        The admin who last stored the values. Null when `source` is `default`,
