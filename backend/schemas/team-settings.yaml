# Team-level settings schemas (epic #487) — referenced from ../openapi.yaml.
#
# The search ranking settings are a per-team SINGLETON: a team either stores a
# complete ranking profile or stores nothing and inherits the instance defaults
# from config.yaml. There is deliberately no partial override, so every value
# field is required on both the response and the update request.

TeamSearchSettingsValues:
  type: object
  description: >
    A complete search ranking profile. The three weights are normalized by their
    sum at ranking time, so they need not pre-sum to 1.
  required:
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
  properties:
    recency_ranking_enabled:
      type: boolean
      description: >
        When false, results keep relevance-only ordering. When true they are
        re-ranked by a weighted blend of relevance and freshness.
      example: true
    rank_weight_relevance:
      type: number
      format: double
      minimum: 0
      description: Weight of semantic relevance. Expected to be the dominant weight.
      example: 0.5
    rank_weight_created:
      type: number
      format: double
      minimum: 0
      description: Weight of how recently the resource was created.
      example: 0.3
    rank_weight_updated:
      type: number
      format: double
      minimum: 0
      description: Weight of how recently the resource was updated.
      example: 0.2
    rank_half_life_days:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 0
      maximum: 36500
      description: >
        Half-life in days for the exponential freshness decay applied to both
        created_at and updated_at. An item exactly one half-life old scores 0.5.
      example: 90

TeamSearchSettings:
  type: object
  description: >
    The search ranking settings in effect for a team, with enough context for a
    client to render the whole settings surface from this one response: the
    effective values, where they came from, the instance defaults to preview a
    reset against, and the instance-owned candidate cap.
  required:
    - source
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
    - instance_defaults
    - rank_candidate_cap
  properties:
    source:
      type: string
      enum:
        - instance
        - team
      description: >
        Where the effective values come from. `instance` means the team has no
        override and inherits the deployment defaults; `team` means the team has
        stored its own profile.
      example: instance
    recency_ranking_enabled:
      type: boolean
      description: Effective value — the team's when source is `team`, otherwise the instance default.
    rank_weight_relevance:
      type: number
      format: double
      description: Effective value — the team's when source is `team`, otherwise the instance default.
    rank_weight_created:
      type: number
      format: double
      description: Effective value — the team's when source is `team`, otherwise the instance default.
    rank_weight_updated:
      type: number
      format: double
      description: Effective value — the team's when source is `team`, otherwise the instance default.
    rank_half_life_days:
      type: number
      format: double
      description: Effective value — the team's when source is `team`, otherwise the instance default.
    instance_defaults:
      $ref: '../openapi.yaml#/components/schemas/TeamSearchSettingsValues'
      description: >
        The deployment-wide defaults from config.yaml, so a client can preview
        what "reset to defaults" would produce without a second request. Equal to
        the effective values when source is `instance`.
    rank_candidate_cap:
      type: integer
      description: >
        How many top-by-relevance rows are pulled and re-ranked in memory per
        query. Instance-owned and NOT team-configurable — one team must not be
        able to raise the whole deployment's per-query cost. Exposed so clients
        can explain why pagination is clamped to this many results when recency
        ranking is on.

        Deliberately NOT marked `readOnly`: the update request uses a separate
        schema that has no such field, which is what actually makes the cap
        unsettable. Marking it readOnly additionally makes oapi-codegen emit it
        as an optional pointer, which would let a required field serialize as
        absent.
      example: 200

UpdateTeamSearchSettingsRequest:
  type: object
  description: >
    A complete replacement ranking profile for the team. There is no partial
    update: every field is required, and the whole profile is stored or replaced
    atomically. `rank_candidate_cap` is deliberately absent — it is instance-owned.
  additionalProperties: false
  required:
    - recency_ranking_enabled
    - rank_weight_relevance
    - rank_weight_created
    - rank_weight_updated
    - rank_half_life_days
  properties:
    recency_ranking_enabled:
      type: boolean
      example: true
    rank_weight_relevance:
      type: number
      format: double
      minimum: 0
      example: 0.5
    rank_weight_created:
      type: number
      format: double
      minimum: 0
      example: 0.3
    rank_weight_updated:
      type: number
      format: double
      minimum: 0
      example: 0.2
    rank_half_life_days:
      type: number
      format: double
      exclusiveMinimum: true
      minimum: 0
      maximum: 36500
      example: 90

# --- AI Summary settings (issue #1072, epic #1068) ---
#
# The per-team AI Summary settings singleton, storage/service built by #1071
# (migration 017). Same whole-row-override contract as TeamSearchSettings
# above: a team either owns a complete profile or has none and inherits the
# instance `ai_summary:` defaults from config.yaml.

TeamAISummarySettingsValues:
  type: object
  description: A complete AI summary profile.
  required:
    - enabled
    - model_provider_id
    - top_n
    - style
    - max_output_tokens
  properties:
    enabled:
      type: boolean
      description: Explicit on/off, independent of whether the team has a usable model provider configured.
      example: true
    model_provider_id:
      type: string
      format: uuid
      nullable: true
      description: >
        Which of the team's model providers to use. `null` means "use the
        team's default provider". Must belong to this team — a provider id
        from another team is rejected with 400.
      example: null
    top_n:
      type: integer
      minimum: 1
      description: How many top-ranked documents are fed to the summarizer. Bounded above by the instance's max_top_n.
      example: 5
    style:
      type: string
      enum:
        - concise
        - balanced
        - detailed
      description: Requested length/depth of the generated summary.
      example: balanced
    max_output_tokens:
      type: integer
      minimum: 1
      description: Upper bound on tokens the summarizer may generate, within the instance cap.
      example: 800

TeamAISummarySettings:
  type: object
  description: >
    The AI summary settings in effect for a team, with enough context for a
    client to render the whole settings surface from this one response: the
    effective values, where they came from, the instance defaults to preview a
    reset against, the instance-owned top_n and max_output_tokens caps, and
    whether the team can currently use AI summaries at all.
  required:
    - source
    - values
    - instance_defaults
    - max_top_n
    - max_output_tokens_ceiling
    - available
  properties:
    source:
      type: string
      enum:
        - instance
        - team
      description: >
        Where the effective values come from. `instance` means the team has no
        override and inherits the deployment defaults; `team` means the team
        has stored its own profile.
      example: instance
    values:
      $ref: '../openapi.yaml#/components/schemas/TeamAISummarySettingsValues'
      description: Effective values — the team's when source is `team`, otherwise the instance default.
    instance_defaults:
      $ref: '../openapi.yaml#/components/schemas/TeamAISummarySettingsValues'
      description: >
        The deployment-wide defaults from config.yaml, so a client can preview
        what "reset to defaults" would produce without a second request. Equal
        to `values` when source is `instance`.
    max_top_n:
      type: integer
      description: >
        Instance-owned ceiling on `top_n`, from `ai_summary.max_top_n`. Not
        team-configurable — exposed so clients can bound their own input
        control instead of guessing.
      example: 10
    max_output_tokens_ceiling:
      type: integer
      minimum: 1
      description: >
        Instance-owned ceiling on `max_output_tokens`, from
        `ai_summary.max_output_tokens_ceiling`. Not team-configurable —
        exposed so clients can bound their own input control instead of
        guessing.
      example: 4096
    available:
      type: boolean
      description: >
        Whether the team has at least one model provider configured
        (existence, not health) — AI summaries cannot run without one
        regardless of `enabled`.
      example: true

UpdateTeamAISummarySettingsRequest:
  type: object
  description: >
    A complete replacement AI summary profile for the team. There is no
    partial update: every field is required, and the whole profile is stored
    or replaced atomically. `max_top_n`, `max_output_tokens_ceiling` and
    `available` are deliberately absent — all are computed, not settable.
  additionalProperties: false
  required:
    - enabled
    - model_provider_id
    - top_n
    - style
    - max_output_tokens
  properties:
    enabled:
      type: boolean
      example: true
    model_provider_id:
      type: string
      format: uuid
      nullable: true
      example: null
    top_n:
      type: integer
      minimum: 1
      example: 5
    style:
      type: string
      enum:
        - concise
        - balanced
        - detailed
      example: balanced
    max_output_tokens:
      type: integer
      minimum: 1
      example: 800

# --- Settings audit log (issue #832, epic #827) ---
#
# The read side of the team_settings_audit table (#828). The entry is a
# SNAPSHOT: the copy services write the resource names into `detail` at write
# time precisely because the rows they name are polymorphic and may be deleted
# later. The two names resolved here — the actor and the source team — are the
# exception, looked up live so a rename is reflected, which is why both are
# nullable: the actor may have deleted their account (the column is ON DELETE
# SET NULL) and the source team may be gone (the column has no foreign key by
# design, so the id survives the team).
#
# TeamSettingsAuditSurface is a STANDALONE component rather than an inline
# property enum so TestSpecEnumsMatchServiceAllowlists can pin it to
# models.SettingsAuditSurfaces — that gate reads component enums only. Epic #827
# grows this set, and unlike the request-side mirrors the gate leaves unpinned,
# this is a RESPONSE enum: drift ships a value neither generated client has a
# union member for, and no conformance assertion would notice. Keep the
# rationale here, in a comment — `description` is published API surface that
# both clients regenerate from on merge, so it belongs to the consumer.

TeamSettingsAuditSurface:
  type: string
  description: Which settings surface was copied between teams.
  enum:
    - embedding_provider
    - model_provider
    - custom_types
  example: model_provider

TeamSettingsAuditEntry:
  type: object
  description: >
    One recorded settings copy into this team: which surface arrived, who
    brought it, and where it came from.
  required:
    - id
    - surface
    - actor_user_id
    - actor_name
    - source_team_id
    - source_team_name
    - source_resource_id
    - created_resource_id
    - detail
    - created_at
  properties:
    id:
      type: string
      format: uuid
      description: Identifier of the audit entry.
    surface:
      $ref: '../openapi.yaml#/components/schemas/TeamSettingsAuditSurface'
    actor_user_id:
      type: string
      format: uuid
      nullable: true
      description: >
        Who performed the copy. `null` once that account is deleted — the entry
        outlives the actor on purpose, so that deletion cannot erase the record
        of what the account did.
    actor_name:
      type: string
      nullable: true
      description: >
        The actor's display name (their email when the name is blank), resolved
        server-side so a client need not fan out per row. `null` when
        `actor_user_id` is null or no longer resolves to a user.
      example: Ada Lovelace
    source_team_id:
      type: string
      format: uuid
      nullable: true
      description: The team the configuration was copied FROM.
    source_team_name:
      type: string
      nullable: true
      description: >
        The source team's name, resolved server-side. `null` when that team has
        since been deleted — the id above is then the only remaining handle on
        it, and is deliberately still present rather than blanked.
      example: Platform Team
    source_resource_id:
      type: string
      format: uuid
      nullable: true
      description: >
        The resource that was copied. `null` for a `custom_types` copy, where
        one action copies a whole set and the individual ids live in `detail`.
    created_resource_id:
      type: string
      format: uuid
      nullable: true
      description: >
        The resource created in this team. `null` for a `custom_types` copy, for
        the same reason as `source_resource_id`.
    detail:
      type: object
      additionalProperties: true
      description: >
        Surface-specific facts snapshotted at write time — resource names, and
        for a provider copy whether it carried a credential and whether it
        became the team's active provider. Always an object, never null.
      example:
        source_name: OpenAI (Platform)
        created_name: OpenAI (Platform)
        has_api_key: true
    created_at:
      type: string
      format: date-time
      description: When the copy was recorded.

TeamSettingsAuditListResponse:
  type: object
  description: A page of the team's settings audit log, newest first.
  required:
    - entries
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    entries:
      type: array
      description: Serializes as `[]` when the page is empty, never `null`.
      items:
        $ref: './team-settings.yaml#/TeamSettingsAuditEntry'
    total_count:
      type: integer
      description: Total entries in the team's log, ignoring pagination.
      example: 42
    page:
      type: integer
      description: Current page number (1-based)
      example: 1
    per_page:
      type: integer
      description: Number of entries per page
      example: 20
    total_pages:
      type: integer
      description: Total number of pages
      example: 3
