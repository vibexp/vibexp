# Resource Freshness schemas (issue #731, epic #726) — referenced from
# ../openapi.yaml.
#
# Two surfaces: freshness RULES (a per-team collection) and freshness SETTINGS
# (a per-team singleton). The settings shape deliberately mirrors
# TeamSearchSettings in team-settings.yaml: a `source` discriminator plus the
# defaults a reset would restore, so a client can preview a reset without a
# second call.

FreshnessRuleResourceType:
  type: string
  description: A resource type a freshness rule can cover.
  enum:
    - artifact
    - prompt
    - blueprint
    - memory

FreshnessRuleMedium:
  type: string
  description: >
    An access medium that counts as "accessed" for a freshness rule. Note this
    is narrower than the set of mediums recorded on the access path — `api`
    accesses are stored but are deliberately not selectable as rule criteria.
  enum:
    - web
    - cli
    - mcp

FreshnessRule:
  type: object
  description: One team's rule for when a resource becomes stale.
  required:
    - id
    - team_id
    - project_id
    - resource_types
    - mediums
    - threshold_days
    - enabled
    - created_at
    - updated_at
  properties:
    id:
      type: string
      format: uuid
      description: Rule identifier.
    team_id:
      type: string
      format: uuid
      description: Team the rule belongs to.
    project_id:
      type: string
      format: uuid
      nullable: true
      description: >
        Scopes the rule to a single project. `null` means the rule applies to
        EVERY project in the team.
    resource_types:
      type: array
      description: Resource types the rule applies to. Never empty.
      minItems: 1
      items:
        $ref: './freshness.yaml#/FreshnessRuleResourceType'
    mediums:
      type: array
      description: >
        Access mediums that count as "accessed" for this rule. An EMPTY array
        means ANY medium counts — it does not mean "no medium".
      items:
        $ref: './freshness.yaml#/FreshnessRuleMedium'
    threshold_days:
      type: integer
      format: int32
      minimum: 1
      maximum: 36500
      description: >
        Days without a qualifying access after which the resource is stale.
        Capped at 36500 (100 years), mirroring the search-settings half-life
        cap: past that the rule can never fire, and the bound keeps the value
        inside the int32 the column and the wire format use.
    enabled:
      type: boolean
      description: Whether evaluation runs apply this rule.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

FreshnessRuleListResponse:
  type: object
  description: The team's freshness rules, oldest first.
  required:
    - rules
  properties:
    rules:
      type: array
      description: Freshness rules. Serializes as `[]` when the team has none, never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessRule'

# Create and update are separate schemas rather than one shared body:
# create lets the server apply defaults for the optional dimensions, while
# update is a COMPLETE replacement and therefore requires every mutable field.
CreateFreshnessRuleRequest:
  type: object
  description: Create a freshness rule.
  additionalProperties: false
  required:
    - resource_types
    - threshold_days
  properties:
    project_id:
      type: string
      format: uuid
      nullable: true
      description: Scope to one project; omit or send `null` for every project in the team.
    resource_types:
      type: array
      minItems: 1
      items:
        $ref: './freshness.yaml#/FreshnessRuleResourceType'
    mediums:
      type: array
      description: Omit or send an empty array to match any medium.
      items:
        $ref: './freshness.yaml#/FreshnessRuleMedium'
    threshold_days:
      type: integer
      format: int32
      minimum: 1
      maximum: 36500
    enabled:
      type: boolean
      default: true
      description: Defaults to true when omitted.

# Every mutable field is required because PUT replaces the whole rule: a
# partial body would silently reset the omitted dimensions to their zero values.
# oapi-codegen enforces neither `required` on a request body nor
# `additionalProperties: false`, so a middleware guard does it — see
# requireCompleteFreshnessRuleBody.
UpdateFreshnessRuleRequest:
  type: object
  description: Replace a freshness rule in full.
  additionalProperties: false
  required:
    - project_id
    - resource_types
    - mediums
    - threshold_days
    - enabled
  properties:
    project_id:
      type: string
      format: uuid
      nullable: true
      description: Scope to one project; `null` means every project in the team.
    resource_types:
      type: array
      minItems: 1
      items:
        $ref: './freshness.yaml#/FreshnessRuleResourceType'
    mediums:
      type: array
      description: An empty array matches any medium.
      items:
        $ref: './freshness.yaml#/FreshnessRuleMedium'
    threshold_days:
      type: integer
      format: int32
      minimum: 1
      maximum: 36500
    enabled:
      type: boolean

FreshnessSettingsValues:
  type: object
  description: The tunable freshness-evaluation values, shared by the current settings and the defaults.
  required:
    - interval_seconds
    - reversibility_enabled
  properties:
    interval_seconds:
      type: integer
      format: int32
      minimum: 3600
      maximum: 31536000
      description: >
        How often the team's rules are evaluated. Storage enforces a one-hour
        floor, matching the scheduler's own floor; the 31536000 (365-day)
        ceiling keeps the value inside the int32 the column and the wire format
        use, and an interval longer than a year is indistinguishable from off.
    reversibility_enabled:
      type: boolean
      description: Whether accessing or editing a stale resource clears its stale state.

TeamFreshnessSettings:
  type: object
  description: >
    The freshness settings in effect for a team, with their provenance. A team
    that has never overridden them reports `source: instance` and the defaults.
  required:
    - source
    - interval_seconds
    - reversibility_enabled
    - defaults
  properties:
    source:
      type: string
      description: >
        `team` when the team stores its own settings, `instance` when it
        inherits the defaults.
      enum:
        - instance
        - team
    interval_seconds:
      type: integer
      format: int32
      minimum: 3600
      maximum: 31536000
    reversibility_enabled:
      type: boolean
    defaults:
      allOf:
        - $ref: './freshness.yaml#/FreshnessSettingsValues'
      description: >
        The values a DELETE would restore. Present on every read so clients can
        preview a reset without a second call.

# All fields required + additionalProperties:false for the same reason as
# UpdateFreshnessRuleRequest: this is a whole-row replacement.
UpdateTeamFreshnessSettingsRequest:
  type: object
  description: Override the team's freshness settings.
  additionalProperties: false
  required:
    - interval_seconds
    - reversibility_enabled
  properties:
    interval_seconds:
      type: integer
      format: int32
      minimum: 3600
      maximum: 31536000
      description: Rejected below 3600 (one hour) or above 31536000 (365 days).
    reversibility_enabled:
      type: boolean

# ---------------------------------------------------------------------------
# Analytics + audit read models (issue #734).
#
# The four metrics responses deliberately copy the envelope the existing team
# analytics endpoints already return ({status, message, data:{…, counts}}) so
# the SPA's TimeSeriesBarChart and its range selector consume them with no
# adapter. The audit list instead follows this domain's own list shape
# (a bare object, paginated like RelationListResponse) because it feeds a table,
# not a chart.
#
# Every count is int32 with a floor of 0: the wire format and the Go conversion
# both use int32, and a negative count is not a state the engine can produce.
# ---------------------------------------------------------------------------

FreshnessMetricsRange:
  type: string
  description: >
    The reporting window for a time-series metric. The options mirror the other
    analytics endpoints so one range selector drives every chart.
  enum:
    - 7d
    - 14d
    - 30d
    - 60d
    - 90d
    - 180d
  example: 30d

FreshnessDailyStaleCount:
  type: object
  description: >
    One calendar day (UTC) of freshness activity, zero-filled: every day in the
    window is present even when nothing happened.
  required:
    - date
    - marked
    - cleared
    - stale_total
    - total
  properties:
    date:
      type: string
      format: date
      example: '2026-05-01'
    marked:
      type: integer
      format: int32
      minimum: 0
      description: Resources that became stale on this day.
    cleared:
      type: integer
      format: int32
      minimum: 0
      description: Resources that stopped being stale on this day, for any reason.
    stale_total:
      type: integer
      format: int32
      minimum: 0
      description: >
        How many resources were stale at the END of this day — the level, not
        the flow. It is reconstructed by walking today's live count backwards
        through the recorded transitions, so it is exact only for the period the
        audit log covers; days before freshness evaluation first ran on this
        team read as the earliest known level rather than as zero. The most
        recent day reports the live count as of the request. The reconstruction
        is clamped at zero, so on a team whose rows were removed by a project or
        team deletion — which writes no audit entry — the series can flatten at
        0 instead of satisfying stale_total[i] = stale_total[i-1] + marked[i] -
        cleared[i].
    total:
      type: integer
      format: int32
      minimum: 0
      description: >
        The day's total ACTIVITY, marked + cleared — the sum of the two series,
        not the level. It is the field the shared time-series chart reads for
        its per-day total, which is why it is a flow rather than stale_total.

FreshnessOverTimeMetricsData:
  type: object
  required:
    - range
    - total_marked
    - total_cleared
    - counts
  properties:
    range:
      $ref: './freshness.yaml#/FreshnessMetricsRange'
    total_marked:
      type: integer
      format: int32
      minimum: 0
      description: Resources marked stale across the whole window.
    total_cleared:
      type: integer
      format: int32
      minimum: 0
      description: Resources cleared across the whole window.
    counts:
      type: array
      description: One entry per day in the window, oldest first. Serializes as `[]`, never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessDailyStaleCount'

FreshnessOverTimeMetricsResponse:
  type: object
  required:
    - status
    - message
    - data
  properties:
    status:
      type: string
      example: success
    message:
      type: string
      example: Freshness over-time metrics retrieved successfully
    data:
      $ref: './freshness.yaml#/FreshnessOverTimeMetricsData'

FreshnessTypeCount:
  type: object
  description: How many of one resource type are stale right now.
  required:
    - resource_type
    - count
  properties:
    resource_type:
      $ref: './freshness.yaml#/FreshnessRuleResourceType'
    count:
      type: integer
      format: int32
      minimum: 0

FreshnessByTypeMetricsData:
  type: object
  required:
    - total_stale
    - counts
  properties:
    total_stale:
      type: integer
      format: int32
      minimum: 0
      description: Total stale resources in the team, across every type.
    counts:
      type: array
      description: >
        One entry per resource type, always all four, in a stable order —
        a type with nothing stale reports 0 rather than being omitted, so the
        chart's bars never move. Serializes as `[]`, never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessTypeCount'

FreshnessByTypeMetricsResponse:
  type: object
  required:
    - status
    - message
    - data
  properties:
    status:
      type: string
      example: success
    message:
      type: string
      example: Freshness by-type metrics retrieved successfully
    data:
      $ref: './freshness.yaml#/FreshnessByTypeMetricsData'

FreshnessProjectCount:
  type: object
  description: >
    How many resources are stale right now in one project. `name` and `slug`
    are carried so the client can label and deep-link the bar without a second
    request.
  required:
    - project_id
    - name
    - slug
    - count
  properties:
    project_id:
      type: string
      format: uuid
    name:
      type: string
    slug:
      type: string
    count:
      type: integer
      format: int32
      minimum: 0

FreshnessByProjectMetricsData:
  type: object
  required:
    - total_stale
    - counts
  properties:
    total_stale:
      type: integer
      format: int32
      minimum: 0
    counts:
      type: array
      description: >
        One entry per project in the team, including projects with nothing
        stale (0), ordered by count descending then name. Serializes as `[]`,
        never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessProjectCount'

FreshnessByProjectMetricsResponse:
  type: object
  required:
    - status
    - message
    - data
  properties:
    status:
      type: string
      example: success
    message:
      type: string
      example: Freshness by-project metrics retrieved successfully
    data:
      $ref: './freshness.yaml#/FreshnessByProjectMetricsData'

FreshnessRuleImpact:
  type: object
  description: >
    How many resources one rule currently marks. Rules have no name, so the
    defining fields travel with the count for the client to label the bar.
  required:
    - rule_id
    - project_id
    - resource_types
    - threshold_days
    - enabled
    - count
  properties:
    rule_id:
      type: string
      format: uuid
    project_id:
      type: string
      format: uuid
      nullable: true
      description: The project the rule is scoped to, or null for every project in the team.
    resource_types:
      type: array
      minItems: 1
      items:
        $ref: './freshness.yaml#/FreshnessRuleResourceType'
    threshold_days:
      type: integer
      format: int32
      minimum: 1
    enabled:
      type: boolean
      description: A disabled rule reports 0 — it is listed so its absence from the chart is not mistaken for deletion.
    count:
      type: integer
      format: int32
      minimum: 0

FreshnessByRuleMetricsData:
  type: object
  required:
    - total_stale
    - counts
  properties:
    total_stale:
      type: integer
      format: int32
      minimum: 0
      description: >
        Distinct stale resources in the team. It is NOT the sum of the per-rule
        counts: a resource matched by two rules is counted once here and once
        under each rule, because staleness is a union across rules.
    counts:
      type: array
      description: >
        One entry per rule the team has defined, including rules matching
        nothing, ordered by count descending then rule id. Serializes as `[]`,
        never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessRuleImpact'

FreshnessByRuleMetricsResponse:
  type: object
  required:
    - status
    - message
    - data
  properties:
    status:
      type: string
      example: success
    message:
      type: string
      example: Freshness by-rule metrics retrieved successfully
    data:
      $ref: './freshness.yaml#/FreshnessByRuleMetricsData'

FreshnessAuditEntry:
  type: object
  description: One recorded freshness transition. The log is append-only.
  required:
    - id
    - resource_type
    - resource_id
    - rule_id
    - action
    - reason
    - created_at
  properties:
    id:
      type: string
      format: uuid
    resource_type:
      $ref: './freshness.yaml#/FreshnessRuleResourceType'
    resource_id:
      type: string
      format: uuid
    rule_id:
      type: string
      format: uuid
      nullable: true
      description: >
        The rule that caused the change, when exactly one did. Null for a
        reversal (caused by a read or an edit) and for a mark attributable to
        several rules at once — the resource's own state carries the full set.
    action:
      type: string
      enum:
        - marked
        - cleared
      description: Whether the resource became stale or stopped being stale.
    reason:
      type: string
      enum:
        - rule_run
        - accessed
        - edited
      description: What caused it — a scheduled evaluation, a read, or an edit.
    created_at:
      type: string
      format: date-time

FreshnessAuditListResponse:
  type: object
  description: A page of the team's freshness audit log, newest first.
  required:
    - entries
    - total_count
    - page
    - per_page
    - total_pages
  properties:
    entries:
      type: array
      description: Serializes as `[]` when the page is empty, never `null`.
      items:
        $ref: './freshness.yaml#/FreshnessAuditEntry'
    total_count:
      type: integer
      description: Total entries in the team's log, ignoring pagination.
      example: 142
    page:
      type: integer
      description: Current page number (1-based)
      example: 1
    per_page:
      type: integer
      description: Number of entries per page
      example: 20
    total_pages:
      type: integer
      description: Total number of pages
      example: 8
