# Per-team GitHub App configuration schemas (#479, epic #476).
#
# Secret discipline, enforced by the shape of these schemas rather than by
# convention:
#   * private_key / client_secret appear ONLY on request schemas. There is no
#     response schema that can carry them, so a handler cannot leak one by
#     forgetting to mask.
#   * webhook_secret appears ONLY on CreateGitHubAppConfigResponse. It is
#     disclosed exactly once, at create or rotation, and is unreadable
#     afterwards — modelling it as a distinct schema rather than an optional
#     field on the shared response keeps "when is this populated?" unambiguous.
#   * Every read exposes has_private_key / has_client_secret /
#     has_webhook_secret instead of the values.

GitHubAppConfig:
  type: object
  description: A team's own GitHub App registration. Never carries secret values.
  properties:
    id:
      type: string
      format: uuid
      example: "b1234567-89ab-cdef-0123-456789abcdef"
    team_id:
      type: string
      format: uuid
      description: Team that owns this App registration.
      example: "b1234567-89ab-cdef-0123-456789abcdef"
    user_id:
      type: string
      format: uuid
      nullable: true
      description: >-
        Who registered the App. Informational only — the team is the tenancy
        boundary, and no read is scoped by this field.
    app_id:
      type: string
      description: GitHub's numeric App id, carried as a string.
      example: "123456"
    app_slug:
      type: string
      description: >-
        The App's slug, which builds its install URL
        (https://github.com/apps/{app_slug}/installations/new).
      example: "acme-vibexp"
    client_id:
      type: string
      description: >-
        The App's OAuth client id. Not a secret — GitHub shows it on the App
        settings page, and it is echoed back so an operator can confirm which
        App is wired up.
      example: "Iv1.a1b2c3d4e5f6"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    version:
      type: integer
      format: int64
      description: Optimistic-concurrency version counter, incremented on each update.
      example: 1
  required:
    - id
    - team_id
    - app_id
    - app_slug
    - client_id
    - created_at
    - updated_at
    - version

GitHubAppConfigResponse:
  description: >-
    The App registration as returned by every read. Secrets are replaced by
    has_* booleans; webhook_url is the URL to paste into the App's settings.
  allOf:
    - $ref: '../openapi.yaml#/components/schemas/GitHubAppConfig'
    - type: object
      properties:
        has_private_key:
          type: boolean
          description: Whether a private key is stored. The key itself is never returned.
          example: true
        has_client_secret:
          type: boolean
          description: Whether a client secret is stored. The secret itself is never returned.
          example: true
        has_webhook_secret:
          type: boolean
          description: >-
            Whether a webhook secret is stored. The secret is disclosed only once,
            when it is generated; recovering a lost one means rotating it.
          example: true
        webhook_url:
          type: string
          description: >-
            The webhook URL for this App, carrying its opaque routing token.
            Paste it into the App's settings on GitHub. Empty when the instance
            has no public base URL configured.
          example: "https://vibexp.example.com/api/v1/webhooks/github/8Xk2mQ7pR4tN"
      required:
        - has_private_key
        - has_client_secret
        - has_webhook_secret
        - webhook_url

CreateGitHubAppConfigResponse:
  description: >-
    The one and only payload that carries a plaintext webhook secret. Returned
    by create and by webhook-secret rotation; every subsequent read returns
    GitHubAppConfigResponse, which cannot carry it.
  allOf:
    - $ref: '../openapi.yaml#/components/schemas/GitHubAppConfigResponse'
    - type: object
      properties:
        webhook_secret:
          type: string
          description: >-
            The generated webhook secret, shown exactly once. Paste it into the
            App's settings alongside the webhook URL; it cannot be read back.
          example: "9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0"
      required:
        - webhook_secret

CreateGitHubAppConfigRequest:
  type: object
  description: >-
    Registers a team's GitHub App. There is deliberately no webhook_secret
    field — the server generates it and returns it once.
  properties:
    app_id:
      type: string
      minLength: 1
      maxLength: 50
      description: GitHub's numeric App id.
      example: "123456"
    app_slug:
      type: string
      minLength: 1
      maxLength: 255
      description: The App's slug, used to build its install URL.
      example: "acme-vibexp"
    client_id:
      type: string
      minLength: 1
      maxLength: 255
      description: The App's OAuth client id.
      example: "Iv1.a1b2c3d4e5f6"
    private_key:
      type: string
      minLength: 1
      description: >-
        The App's RSA private key, as raw PEM or base64-encoded PEM. Encrypted
        at rest and never returned.
    client_secret:
      type: string
      minLength: 1
      description: The App's OAuth client secret. Encrypted at rest and never returned.
  required:
    - app_id
    - app_slug
    - client_id
    - private_key
    - client_secret

UpdateGitHubAppConfigRequest:
  type: object
  description: >-
    Edits the team's App registration. Every field is optional; an omitted field
    keeps the stored value. An explicitly EMPTY value is rejected rather than
    treated as a clear — a GitHub App with no private key is not a meaningful
    state, so a blank value is far more likely a client bug than an intent.
    webhook_secret is absent for the same reason it is absent from create: it is
    server-generated, and replaced through the rotation endpoint.
  properties:
    app_id:
      type: string
      minLength: 1
      maxLength: 50
    app_slug:
      type: string
      minLength: 1
      maxLength: 255
    client_id:
      type: string
      minLength: 1
      maxLength: 255
    private_key:
      type: string
      minLength: 1
      description: Replacement RSA private key (raw PEM or base64-encoded PEM).
    client_secret:
      type: string
      minLength: 1
      description: Replacement OAuth client secret.

ValidateGitHubAppConfigResponse:
  type: object
  description: >-
    Result of probing GitHub with the stored credentials. A failed probe is
    reported here with is_valid=false, not as an HTTP error — a wrong key is
    user-correctable, not a server fault. error_details is always one of a fixed
    set of categories so the response cannot become an oracle for what the
    server could reach; the real upstream error is logged server-side only.
  properties:
    is_valid:
      type: boolean
      example: true
    message:
      type: string
      description: Human-readable summary of the outcome.
      example: "GitHub App configuration is valid"
    app_slug:
      type: string
      description: >-
        The slug GitHub reports for the authenticated App, echoed so a mismatch
        with the stored value is visible rather than silently producing a broken
        install URL later.
      example: "acme-vibexp"
    permissions:
      type: object
      additionalProperties:
        type: string
      description: >-
        The App's granted permissions, so a missing contents/metadata read can be
        surfaced before it breaks an import.
      example:
        contents: "read"
        metadata: "read"
    details:
      $ref: '../openapi.yaml#/components/schemas/ValidateGitHubAppConfigDetails'
  required:
    - is_valid
    - message

ValidateGitHubAppConfigDetails:
  type: object
  description: Fixed-category diagnostics for a validation probe.
  properties:
    response_time_ms:
      type: integer
      example: 214
    status_code:
      type: integer
      description: HTTP status GitHub returned, when the probe got that far.
      example: 200
    error_details:
      type: string
      description: >-
        Fixed failure category. Never carries upstream error text, which would
        reveal what the server could and could not reach.
      enum:
        - invalid_credentials
        - app_not_found
        - slug_mismatch
        - insufficient_permissions
        - connection_failed
      example: "invalid_credentials"
