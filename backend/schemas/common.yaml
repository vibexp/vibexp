# Common schemas used across multiple API domains

HealthResponse:
  type: object
  properties:
    status:
      type: string
      example: "healthy"
    sha:
      type: string
      description: Short release commit SHA (empty outside deployed environments)
      example: "de7db3a2"
  required:
    - status

SuccessResponse:
  type: object
  properties:
    status:
      type: string
      example: "success"
    message:
      type: string
      example: "Operation completed successfully"
    data:
      type: object
      additionalProperties: true
  required:
    - status
    - message

ErrorResponse:
  type: object
  description: RFC 9457 Problem Details for HTTP APIs
  properties:
    type:
      type: string
      description: URI reference that identifies the problem type
      example: "https://api.example.com/errors/VALIDATION_FAILED"
    title:
      type: string
      description: Short, human-readable summary of the problem type
      example: "Validation Failed"
    status:
      type: integer
      description: HTTP status code
      example: 400
    detail:
      type: string
      description: Human-readable explanation specific to this occurrence
      example: "Request validation failed"
    code:
      type: string
      description: Application-specific error code
      example: "VALIDATION_FAILED"
    request_id:
      type: string
      description: Unique request identifier for tracking and debugging
      example: "abc123-def456"
    timestamp:
      type: string
      format: date-time
      description: Timestamp when the error occurred (RFC3339)
      example: "2025-11-08T10:15:30Z"
    instance:
      type: string
      description: URI reference that identifies the specific occurrence
      example: "/api/v1/agents"
    validation_errors:
      type: array
      description: Field-level validation errors (present for validation failures)
      items:
        $ref: "#/ValidationError"
  required:
    - type
    - title
    - status
    - detail
    - code
    - request_id
    - timestamp

ValidationError:
  type: object
  description: Field-level validation error details
  properties:
    field:
      type: string
      description: Name of the field that failed validation
      example: "name"
    message:
      type: string
      description: Human-readable error message
      example: "Field 'name' is required"
    code:
      type: string
      description: Validation error code
      example: "REQUIRED"
    constraint:
      type: string
      description: The constraint that was violated
      example: "required"
  required:
    - field
    - message
    - code

SortByParam:
  name: sort_by
  in: query
  description: Field to sort results by. Returns HTTP 400 if the field is not in the allowed list for the endpoint.
  required: false
  schema:
    type: string

SortOrderParam:
  name: sort_order
  in: query
  description: Sort direction
  required: false
  schema:
    type: string
    enum: [asc, desc]
    default: desc

# ---------------------------------------------------------------------------
# Resource status vocabulary (#912, opened to team custom statuses in #1266)
#
# ResourceStatus is the SYSTEM vocabulary: the statuses VibeXP itself defines
# and gives a meaning to. It stays a closed enum, because it is the list of
# slugs a team may not take for a custom status.
#
# PromptStatus, ArtifactStatus, BlueprintStatus and MemoryStatus are what a
# resource of that type may carry, and they are OPEN strings: each type has a
# fixed system subset (named in its description, and enforced by the Go
# allowlists in internal/models/status.go) plus whatever custom statuses the
# resource's team has defined for that type. A closed `enum:` here would make
# every custom status a value neither generated client can represent.
#
# The server validates a status against the team's catalog, on writes and on
# list filters alike, and answers 400 with the allowed values otherwise. What
# keeps the descriptions honest is TestStatusSchemasAreOpenAndNameSystemValues
# (internal/services/spec_enum_drift_test.go): each schema must stay an open
# string of at most 50 characters whose description names every system value
# of its type.
#
# The system subsets are deliberately NOT unified: a system status is only
# meaningful where the resource type has semantics for it (`published` is the
# counterpart of a prompt's `draft`, which keeps it out of MCP; `expired`
# retires a blueprint).
# ---------------------------------------------------------------------------

ResourceStatus:
  type: string
  description: >-
    The system status vocabulary shared by prompts, artifacts, blueprints and
    memories. Each resource type has a named subset of these values as its
    system statuses; see PromptStatus, ArtifactStatus, BlueprintStatus and
    MemoryStatus. A team's custom status may not reuse any of these values.
  enum: [active, draft, archived, published, expired]
  example: "active"

PromptStatus:
  type: string
  maxLength: 50
  description: >-
    Status of a prompt. The system values are `draft` and `published`; a
    `draft` prompt is never exposed over MCP, while a prompt in any other
    status is once `mcp_expose` is on. A team may define further statuses of
    its own for prompts, so this is an open string: any other value must be one
    of the team's custom prompt statuses, or the request is rejected with 400.
  example: "published"

ArtifactStatus:
  type: string
  maxLength: 50
  description: >-
    Status of an artifact. The system values are `active`, `draft` and
    `archived`. A team may define further statuses of its own for artifacts, so
    this is an open string: any other value must be one of the team's custom
    artifact statuses, or the request is rejected with 400.
  example: "active"

BlueprintStatus:
  type: string
  maxLength: 50
  description: >-
    Status of a blueprint. The system values are `active` and `expired`;
    `expired` marks a blueprint whose rules no longer apply but whose content is
    kept for reference. A team may define further statuses of its own for
    blueprints, so this is an open string: any other value must be one of the
    team's custom blueprint statuses, or the request is rejected with 400.
  example: "active"

MemoryStatus:
  type: string
  maxLength: 50
  description: >-
    Status of a memory. The system values are `active`, `draft` and `archived`.
    A team may define further statuses of its own for memories, so this is an
    open string: any other value must be one of the team's custom memory
    statuses, or the request is rejected with 400.
  example: "active"

PaginatedResponse:
  type: object
  properties:
    data:
      type: array
      items: {}
    page:
      type: integer
      description: Current page number
      example: 1
    limit:
      type: integer
      description: Number of items per page
      example: 10
    total:
      type: integer
      description: Total number of records
      example: 150
    total_pages:
      type: integer
      description: Total number of pages
      example: 15
  required:
    - data
    - page
    - limit
    - total
    - total_pages

# Legacy success-envelope wrappers for the prompts list/labels endpoints. They
# compose SuccessResponse with a typed `data` payload. Named components (rather
# than inline allOf in paths/prompts.yaml) because inline compositions with
# cross-file refs break pb33f/libopenapi-validator v0.14.0's response-schema
# compile (pb33f/libopenapi-validator#314).
PromptListEnvelope:
  allOf:
    - $ref: '#/SuccessResponse'
    - type: object
      properties:
        data:
          $ref: '../schemas/prompts.yaml#/PromptListResponse'
      required:
        - data

PromptLabelsEnvelope:
  allOf:
    - $ref: '#/SuccessResponse'
    - type: object
      properties:
        data:
          type: object
          properties:
            labels:
              type: array
              items:
                type: string
              example: ["code-review", "documentation", "testing"]
          required:
            - labels
      required:
        - data

# Resource locks (epic #1285). A prompt, blueprint or artifact can be locked by
# a team member to mark it "in use, do not remove". These schemas are shared by
# the three resource domains.
ResourceLockActor:
  type: object
  description: A user named on a resource lock or a lock history event.
  properties:
    user_id:
      type: string
      description: ID of the user.
      example: "01234567-89ab-cdef-0123-456789abcdef"
    display_name:
      type: string
      description: The user's display name.
      example: "Ada Lovelace"
  required:
    - user_id
    - display_name

ResourceLock:
  type: object
  description: >-
    The lock held on a prompt, blueprint or artifact. A resource carries one
    while it is locked and `null` when it is not.
  properties:
    locked_by:
      allOf:
        - $ref: '#/ResourceLockActor'
      description: The team member holding the lock.
    comment:
      type: string
      description: Why the resource was locked, as given by the locker.
      example: "Used by the nightly release agent"
    locked_at:
      type: string
      format: date-time
      description: When the lock was taken.
      example: "2026-10-11T10:15:30Z"
  required:
    - locked_by
    - comment
    - locked_at

ResourceWriteLockedError:
  description: >-
    RFC 9457 problem returned with `423 Locked` and code
    `RESOURCE_WRITE_LOCKED` when a write is refused because the prompt,
    blueprint or artifact is locked. A locked resource cannot be deleted, and an
    update may not change one of its frozen fields; content, title/name and
    description stay editable. Unlock the resource to make the change.
  allOf:
    - $ref: '#/ErrorResponse'
    - type: object
      properties:
        metadata:
          type: object
          description: The lock that refused the write.
          properties:
            resource_type:
              type: string
              enum: [prompt, blueprint, artifact]
              description: The kind of resource that is locked.
              example: "artifact"
            field:
              type: string
              description: >-
                The frozen field the update tried to change, by its request
                name. Absent when a delete was refused.
              example: "status"
            locked_by:
              allOf:
                - $ref: '#/ResourceLockActor'
              description: The team member holding the lock.
            comment:
              type: string
              description: Why the resource was locked, as given by the locker.
              example: "Used by the nightly release agent"
          required:
            - resource_type
            - locked_by
            - comment
      required:
        - metadata

LockResourceRequest:
  type: object
  properties:
    comment:
      type: string
      minLength: 1
      maxLength: 500
      description: >-
        Why the resource is being locked. Required: surrounding whitespace is
        trimmed, and a comment that is then empty or longer than 500 characters
        is rejected with 400.
      example: "Used by the nightly release agent"
  required:
    - comment

ResourceLockEvent:
  type: object
  description: One entry of a resource's append-only lock history.
  properties:
    id:
      type: string
      format: uuid
      description: ID of the history event.
      example: "123e4567-e89b-12d3-a456-426614174000"
    action:
      type: string
      enum: [lock, unlock]
      x-enum-varnames:
        - ResourceLockEventActionLock
        - ResourceLockEventActionUnlock
      description: Whether the resource was locked or unlocked.
      example: "lock"
    actor:
      allOf:
        - $ref: '#/ResourceLockActor'
      nullable: true
      description: >-
        Who locked or unlocked the resource. Null once that user's account has
        been deleted.
    comment:
      type: string
      nullable: true
      description: The lock comment for a `lock` event; null for an `unlock`.
      example: "Used by the nightly release agent"
    created_at:
      type: string
      format: date-time
      description: When the event happened.
      example: "2026-10-11T10:15:30Z"
  required:
    - id
    - action
    - actor
    - comment
    - created_at

ResourceLockHistoryResponse:
  type: object
  properties:
    events:
      type: array
      description: >-
        Lock and unlock events, newest first. Not paginated: at most the 100
        most recent events are returned.
      items:
        $ref: '#/ResourceLockEvent'
  required:
    - events
