# oapi-codegen configuration for the Password Authentication domain (#1431):
# email and password sign-in, and the public account operations that follow it
# in epic #1426 (forgot password, one-time account links).
#
# Its own package under internal/server/gen/passwordauth, like every other
# spec-first domain (see oapi-codegen-types.yaml for the rationale). The older
# sign-in operations (providers, login, callback, logout, dev login) are tagged
# "Authentication" and are still hand-written, so they are deliberately not
# pulled into this package's StrictServerInterface.
#
# Regenerate with: make backend-generate-openapi-server
# CI fails the PR if this output is stale relative to the spec.
package: passwordauthgen
output: internal/server/gen/passwordauth/passwordauth.gen.go
generate:
  chi-server: true
  strict-server: true
  models: true
output-options:
  include-tags:
    - Password Authentication
