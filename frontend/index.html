<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeXP - The Shared Knowledge Base Your AI Builds On</title>
    <!--
      Runtime configuration (issue #57). The backend renders /config.js,
      setting window.__VIBEXP_ENV__ (deploy-time values) and
      window.__VIBEXP_SITE_INFO__ (the instance's branding) before the module
      bundle below runs. The combined image serves it from the same origin; the
      Vite dev server forwards it to the backend (vite.config.ts). If it cannot
      be loaded the script simply does not run: getEnv() falls back to the
      build-time import.meta.env and the app is unbranded.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
