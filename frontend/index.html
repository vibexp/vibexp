<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeXP - The Shared Knowledge Base Your AI Builds On</title>
    <!--
      Runtime configuration (issue #57). In the combined image the backend
      serves /config.js, setting window.__VIBEXP_ENV__ before the module bundle
      below runs, so getEnv() sees deploy-time values without a rebuild. In local
      dev there is no backend-rendered /config.js (this 404s harmlessly) and the
      app falls back to build-time import.meta.env.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
