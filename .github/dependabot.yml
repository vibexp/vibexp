# Dependabot — keep the lockfiles moving (#547)
#
# Every range in frontend/package.json is `~` (patch-only), so patched releases
# are already permitted by the manifest; nothing ever resolved them, because the
# lockfile only moved when an unrelated feature PR happened to add a dependency.
# That is how five fixable advisories accumulated unnoticed. Weekly grouped PRs
# make that drift visible and reviewable instead of invisible.
#
# Every PR here carries `no-issue-needed`: .github/workflows/pr-linked-issue.yml
# requires a linked open issue and honours exactly that label as its escape
# hatch, with no bot-author exemption. Without it every Dependabot PR fails that
# check.
#
# Grouping policy, in three tiers by how much individual review each bump earns:
#   - development minor + patch  -> ONE PR per ecosystem (tooling churn, little
#     review value individually; CI lint/type-check/test is the real gate)
#   - production patch           -> ONE PR per ecosystem (advisory and bugfix
#     drift, exactly the class that accumulated in #547)
#   - production minor, and any major -> ungrouped, so each gets its own review
#     and its own revert.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - no-issue-needed
    commit-message:
      prefix: chore
      include: scope
    groups:
      frontend-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      frontend-production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - no-issue-needed
    commit-message:
      prefix: chore
      include: scope
    groups:
      backend-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - no-issue-needed
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        update-types:
          - minor
          - patch
