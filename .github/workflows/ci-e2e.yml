name: CI / E2E

# Production-like end-to-end (Playwright) tests, run ON DEMAND only.
#
# This is intentionally NOT wired to pull_request/push: the suite builds the
# combined image from source and boots a full stack (Postgres + fake-gcs +
# backend serving the embedded SPA), which is too heavy to gate every PR. Run it
# manually from the Actions tab (or `gh workflow run ci-e2e.yml -f branch=<ref>`)
# against any branch.
#
# Build once, test in parallel (#1562):
#   build  - builds the three stack images ONCE (buildx, GHA layer cache) and
#            hands them to the test jobs as an artifact.
#   test   - one job per lane, each loading those images and starting its OWN
#            stack (`make e2e E2E_UP_FLAGS=--no-build`), so lanes share no state:
#            - shard i/N: the chromium, smoke, journeys and features projects,
#              split by Playwright `--shard`.
#            - global: the password journeys, which switch instance-wide
#              settings. They run `--no-deps` in a lane of their own: Playwright
#              re-adds a project's dependencies to any shard holding one of its
#              tests, and password-journeys depends on all four other projects,
#              so sharding it would rerun the whole suite in one shard.
#   report - merges the per-lane blob reports into one HTML + JSON report.
# Every lane runs the same `make e2e` as a local run; locally, `make e2e` still
# runs everything on one stack.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag, or SHA to run the e2e suite against'
        required: true
        default: 'main'

permissions:
  contents: read

env:
  E2E_IMAGES: vibexp-e2e/app:local vibexp-e2e/a2a-test-agent:local vibexp-e2e/llm-test-provider:local

jobs:
  build:
    name: Build e2e images (${{ inputs.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # One step per image, each with its own GHA cache scope so the three never
      # evict each other's layers. Tags match the `image:` names in
      # docker-compose.e2e.yml, which is what lets the test jobs `up --no-build`.
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          tags: vibexp-e2e/app:local
          load: true
          cache-from: type=gha,scope=e2e-app
          cache-to: type=gha,scope=e2e-app,mode=max

      - name: Build a2a-test-agent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/cmd/a2a-test-agent/Dockerfile
          tags: vibexp-e2e/a2a-test-agent:local
          load: true
          cache-from: type=gha,scope=e2e-a2a-test-agent
          cache-to: type=gha,scope=e2e-a2a-test-agent,mode=max

      - name: Build llm-test-provider image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/cmd/llm-test-provider/Dockerfile
          tags: vibexp-e2e/llm-test-provider:local
          load: true
          cache-from: type=gha,scope=e2e-llm-test-provider
          cache-to: type=gha,scope=e2e-llm-test-provider,mode=max

      - name: Save images
        run: |
          # E2E_IMAGES is a space-separated list, split on purpose.
          # shellcheck disable=SC2086
          docker save $E2E_IMAGES | gzip -1 > e2e-images.tar.gz
          ls -lh e2e-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-images
          path: e2e-images.tar.gz
          retention-days: 1
          compression-level: 0

  test:
    name: E2E ${{ matrix.lane }} (${{ inputs.branch }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every lane finish, so one failure still reports the whole suite.
      fail-fast: false
      # Adding a shard means a new lane AND bumping the `/N` total in every
      # shard's args.
      matrix:
        lane: [shard-1, shard-2, shard-3, shard-4, global]
        include:
          - lane: shard-1
            args: --project=chromium --project=smoke --project=journeys --project=features --shard=1/4
          - lane: shard-2
            args: --project=chromium --project=smoke --project=journeys --project=features --shard=2/4
          - lane: shard-3
            args: --project=chromium --project=smoke --project=journeys --project=features --shard=3/4
          - lane: shard-4
            args: --project=chromium --project=smoke --project=journeys --project=features --shard=4/4
          - lane: global
            args: --project=password-journeys --no-deps

    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-ci-install

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-images

      - name: Load images
        run: gunzip -c e2e-images.tar.gz | docker load

      # `make e2e` installs the Playwright browser, boots the stack from the
      # loaded images, runs this lane's tests, then always tears the stack down.
      - name: Run e2e lane
        env:
          PLAYWRIGHT_BLOB_REPORT: '1'
          E2E_UP_FLAGS: --no-build
          E2E_PLAYWRIGHT_ARGS: ${{ matrix.args }}
        run: make e2e

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.lane }}
          path: frontend/blob-report
          retention-days: 1
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.lane }}
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: E2E report (${{ inputs.branch }})
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-ci-install

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Merge reports
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: warn
