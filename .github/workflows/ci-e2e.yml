name: CI / E2E

# Production-like end-to-end (Playwright) tests against the combined image
# built from source, on a full stack (Postgres + fake-gcs + the backend serving
# the embedded SPA). Tiered (#1564):
#   - pull requests touching the app or the e2e stack: the `smoke` project only
#     (critical paths), so every such PR gets an e2e signal in a few minutes.
#   - pushes to main: the full suite. Runs queue in one group that keeps at
#     most one running and one pending: a merge landing while a run is pending
#     replaces it, so a burst of merges is covered by the run of its newest
#     commit rather than one run each.
#   - workflow_dispatch: the full suite against any branch, tag or SHA
#     (`gh workflow run ci-e2e.yml -f branch=<ref>`).
#
# Build once, test in parallel (#1562):
#   build  - builds the three stack images ONCE, in parallel (buildx, GHA layer
#            cache), and hands them to the test jobs as artifacts.
#   test   - one job per lane, each loading those images and starting its OWN
#            stack (`make e2e E2E_UP_FLAGS=--no-build`), so lanes share no state:
#            - shard i/N: the chromium, smoke, journeys and features projects,
#              split by Playwright `--shard`.
#            - global: the password journeys, which switch instance-wide
#              settings. They run `--no-deps` in a lane of their own: Playwright
#              re-adds a project's dependencies to any shard holding one of its
#              tests, and password-journeys depends on all four other projects,
#              so sharding it would rerun the whole suite in one shard.
#   report - merges the per-lane blob reports into one HTML + JSON report, and
#            writes the run stats + test-ID manifest (.github/scripts/
#            e2e-run-stats.sh) to the job summary and the report artifact.
# Every lane runs the same `make e2e` as a local run; locally, `make e2e` still
# runs everything on one stack.

on:
  pull_request:
    # Keep in sync with the push paths below.
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.e2e.yml'
      - 'Makefile'
      - '.github/workflows/ci-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.e2e.yml'
      - 'Makefile'
      - '.github/workflows/ci-e2e.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag, or SHA to run the e2e suite against'
        required: true
        default: 'main'

permissions:
  contents: read

# A newer push to a PR cancels its running smoke run. main runs are never
# cancelled mid-flight; see the header for how they queue. Dispatches each get
# their own group.
concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which lanes this run has: smoke only on a PR, the full suite otherwise.
  plan:
    name: Plan e2e lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - name: Choose lanes
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          # The shard total. The lanes below are generated from it.
          SHARDS: 6
        run: |
          if [ "$EVENT" = pull_request ]; then
            lanes='[{"lane":"smoke","args":"--project=smoke"}]'
          else
            lanes=$(jq -cn --argjson n "$SHARDS" \
              --arg projects '--project=chromium --project=smoke --project=journeys --project=features' '
              [range(1; $n + 1) as $i
                | {lane: "shard-\($i)", args: "\($projects) --shard=\($i)/\($n)"}]
              + [{lane: "global", args: "--project=password-journeys --no-deps"}]')
          fi
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "$lanes" | jq .

  build:
    name: Build e2e image ${{ matrix.image }} (${{ inputs.branch || github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per image, so the three build in parallel and the slowest (app)
    # alone sets the critical path.
    strategy:
      matrix:
        include:
          - image: app
            dockerfile: backend/Dockerfile
          - image: a2a-test-agent
            dockerfile: backend/cmd/a2a-test-agent/Dockerfile
          - image: llm-test-provider
            dockerfile: backend/cmd/llm-test-provider/Dockerfile

    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      # cleanup: false skips removing the builder at job end (~25s on the
      # critical path), which buys nothing on a throwaway hosted runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false

      # The app's Go module and build caches are BuildKit cache mounts
      # (backend/Dockerfile), which the GHA layer cache does not carry. Restore
      # them into the builder so a code change recompiles only what changed
      # (cold `go build`: ~80s). One entry per go.sum: the key misses, and so
      # saves, only when the dependencies change, which keeps a ~0.5GB entry
      # from being written on every run. The entry belongs to the ref the
      # workflow runs ON (`gh workflow run --ref`, default main), not to the
      # `branch` input it tests; main's entry is visible to every run.
      # Pull requests only READ caches (here and in the layer cache below): an
      # entry a PR saves is visible to that PR alone, so writing one would only
      # churn the repo's 10GB cache budget and evict main's entries, ci.yml's
      # Go build cache among them.
      - name: Cache Go build for the app image
        if: ${{ matrix.image == 'app' && github.event_name != 'pull_request' }}
        id: go-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go-cache
          key: e2e-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: e2e-go-

      - name: Restore Go build for the app image (read-only)
        if: ${{ matrix.image == 'app' && github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: go-cache
          key: e2e-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: e2e-go-

      - name: Inject Go caches into the builder
        if: ${{ matrix.image == 'app' }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "go-cache/mod": "/go/pkg/mod",
              "go-cache/build": "/root/.cache/go-build"
            }
          skip-extraction: ${{ github.event_name == 'pull_request' || steps.go-cache.outputs.cache-hit == 'true' }}

      # Each image has its own GHA cache scope so they never evict each other's
      # layers. The tag matches the `image:` name in docker-compose.e2e.yml,
      # which is what lets the test jobs `up --no-build`. The image is written
      # straight to a tarball: nothing needs it in this job's Docker daemon.
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: vibexp-e2e/${{ matrix.image }}:local
          outputs: type=docker,dest=${{ runner.temp }}/e2e-image-${{ matrix.image }}.tar
          cache-from: type=gha,scope=e2e-${{ matrix.image }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope=e2e-{0},mode=max', matrix.image) || '' }}

      - name: Upload image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-${{ matrix.image }}
          path: ${{ runner.temp }}/e2e-image-${{ matrix.image }}.tar
          retention-days: 1

  test:
    name: E2E ${{ matrix.lane }} (${{ inputs.branch || github.head_ref || github.ref_name }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every lane finish, so one failure still reports the whole suite.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-ci-install

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-image-*
          path: ${{ runner.temp }}/e2e-images
          merge-multiple: true

      - name: Load images
        run: for f in "$RUNNER_TEMP"/e2e-images/*.tar; do docker load -i "$f"; done

      # `make e2e` installs the Playwright browser, boots the stack from the
      # loaded images, runs this lane's tests, then always tears the stack down.
      - name: Run e2e lane
        env:
          PLAYWRIGHT_BLOB_REPORT: '1'
          E2E_UP_FLAGS: --no-build
          E2E_PLAYWRIGHT_ARGS: ${{ matrix.args }}
        run: make e2e

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.lane }}
          path: frontend/blob-report
          retention-days: 1
          if-no-files-found: warn

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.lane }}
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: E2E report (${{ inputs.branch || github.head_ref || github.ref_name }})
    needs: test
    # Skipped lanes (a failed image build) leave nothing to merge.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: make frontend-ci-install

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports
          merge-multiple: true

      - name: Merge reports
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/results.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      # Run stats in the job summary, plus the sorted test-ID manifest (#1563):
      # diffing two runs' manifests proves a CI change still runs the same tests.
      - name: Summarize the run
        run: |
          bash .github/scripts/e2e-run-stats.sh frontend/test-results/results.json \
            frontend/test-results/test-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      # Uploaded even when the summary step fails, so its input is inspectable.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
          if-no-files-found: warn
