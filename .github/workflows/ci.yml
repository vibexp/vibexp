name: CI

# Consolidated CI for the monorepo (issue #390, supersedes the self-contained
# ci-sonar design from #300): the backend and frontend test jobs produce
# coverage as a BY-PRODUCT of their single test execution and upload it as
# artifacts; the sonar job only downloads those artifacts and runs the scanner.
# No test suite runs twice.
#
# Path filtering happens in the `changes` job (dorny/paths-filter) instead of
# workflow-level `paths:` so one workflow can gate its jobs independently. On
# pushes (main and release branches alike) every job runs unconditionally so the
# main-branch Sonar analysis always carries BOTH coverage reports (partial main
# analyses would swing overall coverage — the invariant #300 protected).
#
# The Go suite is SHARDED into `unit` and `integration` (issue #638). Only
# `internal/repositories/postgres` and `internal/services/projectmigration`
# carry `//go:build integration` files, so only the `integration` job needs the
# Postgres service container; the `unit` job skips container startup entirely.
# Each publishes its own coverage profile and BOTH are listed in
# sonar-project.properties — integration-covered code still counts in Sonar
# coverage (issue #390; previously local-only).
#
# NOTE: CI-based analysis is mutually exclusive with SonarCloud Automatic
# Analysis. Automatic Analysis must be disabled for `vibexp_vibexp` in the
# SonarCloud UI (Administration -> Analysis Method) or the scan is rejected.
#
# CACHING (issue #638). `actions/setup-go`'s built-in cache keys on Go version +
# `go.sum` hash ONLY. `go.sum` rarely moves, so the key hit on every run and the
# action therefore NEVER saved: the restored blob was whatever one run wrote long
# ago. It held the compiled stdlib and third-party dependencies (which is why
# `make backend-build` took 3s and gosec 44s), but NONE of this repo's own
# packages in `-race -cover` mode — so the test step recompiled all of them every
# run, the 126s of silence before the first `ok` line.
#
# Replacing it therefore has to preserve the dependency floor, not just add the
# missing part. MEASURED on this PR's first run, with `cache: false` and no entry
# yet saved under the new keys: `Build` 3s -> 146s, gosec 44s -> 173s,
# golangci-lint 81s -> 224s. Hence:
#   * module cache -> stable `go.sum` key, plain actions/cache (save+restore).
#   * build cache  -> `go.sum` + commit SHA with a restore-keys ladder. ONE
#     namespace shared by every Go job, because `unit` compiles the module both
#     plain and with `-race -cover`, making its entry a superset. Restored by
#     unit/integration/security/lint/openapi; saved by `unit` alone, on pushes to
#     main plus on a total cache miss (the cold-start escape hatch — see the step
#     comment). The entry is ~500MB, so an unconditional per-run save would
#     exhaust the 10GB repo cache limit in ~20 runs.

# RELEASE BRANCHES (issue #747). A patch release is cut from a `release/X.Y.x`
# line branch rather than `main`, so that branch's tip must be tested in its own
# right. PRs *into* it already run (the `pull_request` trigger is unfiltered),
# but without `release/**` here the post-merge tip gets no run at all and we
# would be tagging a commit that never had its own CI. Cache SAVING stays pinned
# to `refs/heads/main` (see the two `Save …` steps): a cache saved on a release
# branch is visible only to that branch, so it would cost a full write for
# nothing while `main`'s shared entry is what actually serves every job.
on:
  pull_request:
  push:
    branches: [ main, 'release/**' ]

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main are neither cancelled NOR
# queued behind each other.
#
# A main run produces the Sonar coverage baseline this workflow's header
# protects, so cancelling it would swing overall coverage (the #300 invariant).
# But the obvious `github.event.pull_request.number || github.ref` spelling
# ALSO puts every main push in one group `ci-refs/heads/main` (observed: run
# 30203964982 queued behind 30203891018), and that is LOSSY, not merely slow.
# Per the Actions docs the two cancellations are independent: "any existing
# pending job or workflow in the same concurrency group will be canceled and
# the new queued job or workflow will take its place" happens BY DEFAULT, and
# cancel-in-progress:true is what "also" cancels the RUNNING one. At most one
# run may be pending per group. So across three merges in quick succession the
# middle one is cancelled while pending, and that main commit never produces
# its Sonar coverage baseline — the exact #300 invariant this block exists to
# protect. `queue: max` cannot rescue it: its queue is bounded ("when the queue
# is full, any additional runs are canceled") and it cannot be combined with
# cancel-in-progress:true, which this expression is for PRs.
#
# Hence the non-PR fallback is `github.run_id` — unique per run, so main pushes
# share a group with nothing and can be neither cancelled nor queued. That
# restores the pre-#638 main behaviour exactly, leaving this block's only
# effect the PR-run cancellation it was added for. (`github.sha` would be
# subtly wrong: a push and a re-run of the same commit would still collide.)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
              - '.github/linters/golangci.yml'
              - '.github/linters/spectral.yml'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
            migrations:
              - 'backend/migrations/**'
              - '.github/scripts/check-duplicate-migrations.sh'
              - '.github/workflows/ci.yml'

  # golang-migrate identifies a migration by its numeric prefix alone, so two
  # branches each adding their own 0NN_*.sql merge cleanly in git yet break
  # every startup with a duplicate-version error. Local pre-commit checks
  # (make backend-check-migrations) cannot see the other branch; this job runs
  # the script in merge mode, which compares every version number against the
  # branch the PR TARGETS (`github.base_ref`) — `main` normally, the release
  # line for a backport (#747). PR-only: on a push, the tree IS the branch, so
  # there is nothing to compare.
  #
  # The `migration-renumbering` label is the escape hatch: a deliberate
  # renumbering (a post-release consolidation like #710) replaces main's
  # filenames on purpose and would be rejected by design. Labels are read at
  # event time, so add the label BEFORE pushing (or re-run the job after
  # labeling) — same pattern as `no-issue-needed` on pr-linked-issue.yml.
  migrations:
    name: Migration collision check
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.migrations == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'migration-renumbering')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check migration versions against the base branch
        # BASE_REF is the branch this PR targets — `main` normally, but
        # `release/X.Y.x` for a backport (#747). Comparing a backport against
        # `main` is meaningless: main renumbers on every post-release
        # consolidation (002_/006_/011_consolidated), so every backport PR would
        # fail spuriously and train us to slap `migration-renumbering` on it.
        # Passed through env rather than interpolated into the script body.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # checkout fetches only the PR merge ref; merge mode needs the real
          # base-branch tip to compare against.
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! (cd backend && bash ../.github/scripts/check-duplicate-migrations.sh migrations true "$BASE_REF"); then
            echo "::error::Migration version collision with origin/$BASE_REF. If this renumbering is deliberate (e.g. a post-release consolidation), add the 'migration-renumbering' label to the PR and re-run this job."
            exit 1
          fi

  unit:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'

    # No `services:` block — the untagged suite touches no database, so this job
    # skips the ~16s `Initialize containers` step the old combined job paid.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-1.25.12-

      - name: Restore Go build cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ runner.os }}-1.25.12-

      - name: Download dependencies
        run: make backend-download-deps

      - name: gofmt check
        run: make backend-format

      - name: Build
        run: make backend-build

      # Regenerate config.schema.json from the Config struct and fail if it
      # drifts from the committed file (same gate as the other generated
      # artifacts) — keeps editor validation for config.yaml honest.
      - name: Check config schema drift
        run: make backend-config-schema-check

      # The remaining two Go-only generated artifacts. Both were effectively
      # ungated before #635: backend-wire-check existed in the Makefile but no
      # workflow or hook invoked it, and the ~124 mockery mocks had no gate at
      # all — so a hand-edited generated file reached main silently. mockery is
      # pinned via MOCKERY_VERSION and run with `go run`, so this needs no
      # install step.
      - name: Check Wire DI drift
        run: make backend-wire-check

      - name: Check mocks drift
        run: make backend-mock-check

      # Untagged suite over the whole module, with coverage. The
      # integration-tagged files are excluded at BUILD time (no
      # `-tags=integration`), so no database is reachable or needed here.
      - name: Test (unit, with coverage)
        run: make backend-test-unit-coverage

      # Guard against reintroducing WorkOS-specific coupling (removed in #30).
      # WorkOS may return only as generic OIDC_* configuration, never as
      # special-case code. Scoped to Go source so doc/config examples are unaffected.
      - name: Guard against WorkOS coupling
        run: |
          if grep -rniE 'workos' backend --include='*.go'; then
            echo "::error::WorkOS references found in backend Go source. The WorkOS provider was removed; re-add WorkOS only as generic OIDC_* configuration."
            exit 1
          fi
          echo "OK: no WorkOS coupling in backend Go source."

      - name: Upload backend unit coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage-unit
          path: backend/coverage-unit.out
          retention-days: 1

      # The single saver of the Go build cache. This job is the right one: it
      # compiles the module BOTH plain (`make backend-build`) and with
      # `-race -cover` (the test step), so its cache is a superset that also
      # serves lint/security/integration.
      #
      # Saved on pushes to main, and additionally on a TOTAL cache miss
      # (`cache-matched-key` empty — not even the loosest restore-key hit). That
      # second condition is what removes the cold-start cliff: without it, the
      # very first runs after this lands, or after the cache is evicted, have no
      # entry to restore and every Go job pays a full cold compile. It cannot run
      # away — once any entry exists the restore-keys ladder always matches, so
      # PR runs stop saving again.
      - name: Save Go build cache
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          steps.go-build-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'

    # Real Postgres for the integration-tagged tests; the harness auto-creates
    # and migrates the dedicated vibexp_io_test database via the /postgres
    # maintenance DB (see backend/internal/repositories/postgres/main_integration_test.go).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: vibexp_app
          POSTGRES_PASSWORD: local_password
          POSTGRES_DB: vibexp_io
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-1.25.12-

      # Restore-only: `unit` owns saving this cache (see the header). Its entry
      # holds the `-race -cover` artifacts this job's test compile needs.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ runner.os }}-1.25.12-

      - name: Download dependencies
        run: make backend-download-deps

      # Sharding is only exhaustive while the target's package list matches the
      # packages that actually carry `//go:build integration` files. Without this
      # gate, a third such package would just stop being tested — silently green.
      - name: Check integration shard covers every tagged package
        run: make backend-check-integration-shard

      - name: Test (integration-tagged, with coverage)
        run: make backend-test-integration-coverage

      - name: Upload backend integration coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage-integration
          path: backend/coverage-integration.out
          retention-days: 1

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'

    # Split out of Build & Test in #638: ~107s of scanning (install 32s +
    # govulncheck 23s + gosec 44s) sat serially in FRONT of a 343s test step,
    # inside a job that also held a Postgres service container idle throughout.
    # None of the three needs Postgres or the test run, so they now run
    # alongside `lint` instead of gating it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-1.25.12-

      # govulncheck and gosec both load and type-check the whole module, so they
      # need the compiled dependency artifacts as much as the test job does —
      # restore-only, `unit` owns saving.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ runner.os }}-1.25.12-

      # Keyed on the two PINNED versions, so the 32s `go install` is paid once
      # per pin bump rather than once per run. Bumping either version below
      # changes the key and re-installs automatically.
      - name: Cache govulncheck and gosec binaries
        id: security-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin
          key: go-sectools-${{ runner.os }}-1.25.12-govulncheck-v1.6.0-gosec-v2.28.0

      # make backend-vulncheck / backend-security invoke these binaries directly,
      # so CI has to install them (same pattern as golangci-lint in the lint job).
      # Both are pinned, and for the same reason the linter is: an unpinned bump
      # turns a new upstream rule into a surprise red build on untouched code.
      # gosec is at v2.28.0, the current release and the version the tree is
      # green under. The 7 findings its new G124 (cookie attributes) and G710
      # (open-redirect taint) rules reported were triaged in #553: all were
      # false positives and each site now carries a `#nosec` with the reasoning,
      # so this step gates on today's rule set. Install the same versions
      # locally — the pre-commit hooks run whatever `gosec`/`govulncheck` is on
      # PATH, so a version skew either way reports failures CI does not.
      - name: Install govulncheck and gosec
        if: steps.security-tools.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      # Explicit rather than relying on setup-go having put GOPATH/bin on PATH —
      # on a cache hit no `go install` runs, so nothing else would.
      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vulnerability check
        run: make backend-vulncheck

      - name: Security scan
        run: make backend-security

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-1.25.12-

      # golangci-lint type-checks the whole module, so it needs GOCACHE just as
      # much as the build does — restore-only, `unit` owns saving.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ runner.os }}-1.25.12-

      # golangci-lint also keeps its own analysis cache here, separate from
      # GOCACHE. It is what makes a warm run cheap; the job cached nothing
      # before #638.
      - name: Cache golangci-lint analysis cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-v2.12.2-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            golangci-${{ runner.os }}-v2.12.2-${{ hashFiles('backend/go.sum') }}-
            golangci-${{ runner.os }}-v2.12.2-

      # Keyed on the pinned version, so the installer is fetched once per bump.
      - name: Cache golangci-lint binary
        id: golangci-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-bin-${{ runner.os }}-v2.12.2

      # make backend-lint invokes the golangci-lint binary directly, so install
      # it (pinned to match the v2 config in .github/linters/golangci.yml).
      # v2.12.2 is the current release and the version the tree is green under.
      # Its findings over the previous v2.5.0 pin were triaged in #554: the
      # gosec/prealloc noise in test files is excluded config-first in
      # golangci.yml, and the two real hits (deprecated reflect.Ptr, a missing
      # preallocation) were fixed in code — so this step gates on today's rules.
      - name: Install golangci-lint
        if: steps.golangci-bin.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        run: make backend-lint

      - name: Save golangci-lint analysis cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-v2.12.2-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}

  openapi:
    name: OpenAPI validation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # This job runs no `npm install` — it resolves @redocly/cli and
      # @apidevtools/swagger-cli on demand via `npx --yes`, three times per run
      # (~20s of registry round-trips). Caching the npm cache dir (which holds
      # the _npx tree) removes that. Keyed on the pinned redocly version so a
      # bump re-resolves; deliberately NOT setup-node's `cache: 'npm'`, whose
      # lockfile-derived key the frontend job also owns — two jobs racing to
      # save one key means whichever loses never persists its _npx entries.
      - name: Cache npx package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npx-openapi-${{ runner.os }}-node22-redocly-2.5.0

      # backend-openapi-server-check runs oapi-codegen through the go.mod `tool`
      # directive, so this otherwise Node-only job needs a Go toolchain too.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-mod-${{ runner.os }}-1.25.12-

      # The strict-server drift check builds oapi-codegen via `go tool`.
      # Restore-only: `unit` owns saving.
      - name: Restore Go build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-1.25.12-${{ hashFiles('backend/go.sum') }}-
            go-build-${{ runner.os }}-1.25.12-

      # make backend-validate-openapi shells out to `npx @apidevtools/swagger-cli`
      # which resolves and runs the validator on demand — no project install needed.
      - name: Validate OpenAPI specification
        run: make backend-validate-openapi

      # Regenerate the embedded bundle served at /openapi.{yaml,json} (#139) and
      # fail if it drifts from the committed files — same gate as the config
      # schema. Runs here (not the `unit` job) because it needs Node/npx for redocly.
      - name: Check embedded OpenAPI bundle drift
        run: make backend-openapi-bundle-check

      # Regenerate the strict-server bindings from the bundled spec and fail if
      # they drift from the committed files — the gate the
      # backend-generate-openapi-server comment always claimed existed but which
      # was never actually wired up (#635). Runs here rather than in the `unit` job
      # because bundling needs Node/npx for redocly.
      - name: Check OpenAPI strict-server drift
        run: make backend-openapi-server-check

  # The frontend was one serial chain (lint -> audit -> type-check -> test ->
  # build). Once the backend jobs came down it became the critical path's pole at
  # 176s, so it splits in two (#638). The halves are independent: nothing in
  # lint/audit/type-check feeds test/build.
  frontend-static:
    name: Frontend Lint & Types
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make frontend-ci-install

      - name: Lint
        run: make frontend-lint

      # Production-dependency advisory gate (npm audit --omit=dev, gated at
      # moderate+ by frontend/scripts/audit-deps.js). Previously
      # pre-commit-only, so a contributor without the hooks installed bypassed it
      # entirely and dependency drift accumulated unseen (#547).
      - name: Dependency audit
        run: make frontend-audit

      # `tsc -b`. Note `make frontend-build` in the sibling job re-runs this as
      # part of `npm run build`, so type errors gate BOTH jobs; keeping the
      # explicit step here is what reports them as a type-check failure rather
      # than a build failure. (#572: jest is transpile-only, so this is the only
      # thing that type-checks the test files.)
      - name: Type-check
        run: make frontend-type-check

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # `cache: 'npm'` keys ~/.npm on the lockfile. Both frontend jobs read it;
      # they share the key deliberately (identical lockfile -> identical tree),
      # and whichever finishes a cold install first saves it.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`): deterministic from the lockfile and faster
      # with a warm cache. Its own target rather than repointing
      # `frontend-install` — that one stays `npm install` so a developer adding a
      # dependency locally still gets package.json honoured.
      - name: Install dependencies
        run: make frontend-ci-install

      # Single test execution WITH coverage (jest --coverage) — replaces the
      # plain `make frontend-test` here plus the duplicate coverage run the old
      # ci-sonar.yml performed. This job is the one Sonar waits on.
      - name: Test (with coverage)
        run: make frontend-test-coverage

      - name: Build
        run: make frontend-build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 1

  sonar:
    name: Sonar Scan
    runs-on: ubuntu-latest
    needs: [changes, unit, integration, frontend-test]
    # Run when at least one test job succeeded and none failed (skipped is
    # fine — a one-sided PR has no coverage for the other side, and PR analysis
    # gates on new code only). Never scan on red or cancelled tests.
    #
    # Release-branch PUSHES are excluded (#747): the Sonar story is "main is the
    # baseline, PRs are analysed against it", and a `release/X.Y.x` push is
    # neither. Scanning it would register the line branch in SonarCloud and
    # publish a second, older baseline whose coverage lags main by design (the
    # branch is main-as-of-the-last-tag plus cherry-picks). PRs *into* a release
    # branch still scan normally — that is ordinary new-code analysis.
    if: >-
      always() &&
      !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) &&
      (needs.unit.result == 'success' || needs.integration.result == 'success' || needs.frontend-test.result == 'success') &&
      needs.unit.result != 'failure' && needs.unit.result != 'cancelled' &&
      needs.integration.result != 'failure' && needs.integration.result != 'cancelled' &&
      needs.frontend-test.result != 'failure' && needs.frontend-test.result != 'cancelled'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so SonarCloud can attribute new code / blame accurately.
          fetch-depth: 0

      - name: Download backend unit coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: backend-coverage-unit
          path: backend

      - name: Download backend integration coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: backend-coverage-integration
          path: backend

      - name: Download frontend coverage
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage

      # jest emits lcov SF: paths relative to frontend/ (its rootDir), but the
      # scanner runs from the repo root, so prefix them with frontend/ to make
      # them repo-root-relative and resolvable.
      - name: Rewrite frontend lcov paths to repo-root-relative
        run: |
          if [ -f frontend/coverage/lcov.info ]; then
            sed -i 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info
          fi

      # Fail loudly rather than let Sonar silently ingest 0% coverage if a
      # report that SHOULD exist is missing (the monorepo coverage-path risk
      # called out in #300). A report is expected whenever its test job ran.
      - name: Verify expected coverage reports exist
        run: |
          if [ "${{ needs.unit.result }}" = "success" ]; then
            test -s backend/coverage-unit.out || { echo "::error::backend/coverage-unit.out missing or empty despite Build & Unit Test succeeding"; exit 1; }
          fi
          if [ "${{ needs.integration.result }}" = "success" ]; then
            test -s backend/coverage-integration.out || { echo "::error::backend/coverage-integration.out missing or empty despite Integration Test succeeding"; exit 1; }
          fi
          if [ "${{ needs.frontend-test.result }}" = "success" ]; then
            test -s frontend/coverage/lcov.info || { echo "::error::frontend/coverage/lcov.info missing or empty despite Build, Lint & Test succeeding"; exit 1; }
          fi

      # BLOCKING since #371 (overall coverage crossed 80% — epic #358): a red
      # Quality Gate fails this job. If a PR shape proves systematically unfair
      # (e.g. new_coverage on tiny mechanical refactors), tune the gate on
      # SonarCloud rather than re-adding continue-on-error.
      - name: SonarCloud scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
