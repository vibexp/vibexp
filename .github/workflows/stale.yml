name: Stale issue & PR lifecycle

# Inactivity automation for BOTH issues and pull requests (issue #416).
# Each track has its own thresholds (defaults shown; all tunable in `env`
# below), measured in days of inactivity and driven off the stale-label event:
#
#   Issues:  7 days idle -> label + warning | 14 -> reminder | 21 -> close
#   PRs:    14 days idle -> label + warning | 21 -> reminder | 28 -> close
#
# PRs get longer windows on purpose: a contributor has real work at stake and a
# quiet PR is often waiting on maintainer review, not abandoned.
#
# TWO PATHS, one file, selected by the triggering event (issue #1321):
#
#   sweep    (schedule / workflow_dispatch) -- the daily marker, reminder and
#            closer. It also un-stales from the timeline, as the safety net for
#            activity the event path cannot see (below).
#   unstale  (every other trigger) -- removes the label in the run started by
#            the activity itself, so nothing waits for 03:00 UTC. It scans no
#            timeline: the triggering event IS the activity.
#
# What counts as activity is the same on both paths: an event by ANY actor that
# is not listed in IGNORED_ACTORS -- humans, our own agent App and every other
# App alike. Refinement, triage and implementation here are done by an App, so
# a blanket "bots do not count" rule left refined, Ready work labelled stale
# (and, 14 days on, closed as abandoned). The only other thing that never
# counts is a labeled/unlabeled event for the stale label itself: that is the
# lifecycle moving, not somebody touching the item, and it is what lets a
# maintainer add the label by hand without it being stripped at once.
#
# The event path covers, for issues: comments, body/title edits, label changes,
# (un)assignment, milestone changes and reopening. For PRs: conversation
# comments, pushes, body/title edits, ready-for-review / convert-to-draft,
# review requests, reopening and submitted reviews.
#
# Left to the daily sweep:
#   - a review submitted on a FORK pull request. `pull_request_review` has no
#     `_target` variant, so that run gets a read-only token and could only fail
#     with a 403; the unstale job skips it instead.
#   - activity this file declares no trigger for (cross-references, a review
#     request being removed, a base-branch change, ...).
# Board moves are seen by neither path -- `projects_v2_item` is an org-level
# webhook with no repo workflow trigger, and the timeline scan does not count
# it. The label and edit events that accompany a refinement cover them.
#
# WHY the split between actions/stale and the github-script step:
# `actions/stale` decides both closing AND un-staling from `updated_at`, and
# *any* injected comment (including our required reminder) bumps `updated_at`.
# Letting the action own the close would therefore (a) un-stale everything the
# day after the reminder is posted and (b) permanently reset the close window.
# So `actions/stale` owns ONLY the marking (`days-before-close: -1`,
# `remove-stale-when-updated: false`), and the github-script step owns the
# reminder, the close, and un-staling -- all keyed off the label event, which no
# comment can move. The event path changes neither invariant: `actions/stale`
# still owns only the marking, and the close window is still keyed off the
# label event.
#
# Nothing here is repo-specific: the owner/repo come from the workflow context
# and every threshold, label and exemption is an `env` knob below.

on:
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC
  workflow_dispatch:

  # Everything below feeds the `unstale` job only.
  issues:
    # `edited` is the one a timeline scan can never see: a body edit produces
    # no timeline event at all.
    types: [edited, labeled, unlabeled, assigned, unassigned, reopened, milestoned, demilestoned]
  issue_comment:
    types: [created] # conversation comments on issues AND pull requests
  # `pull_request_target`, not `pull_request`: a `pull_request` run from a fork
  # gets a read-only token and could not remove the label. This is safe ONLY
  # because the workflow checks out no code and passes no PR-controlled input
  # to a `run:` step -- it reads the event payload and calls the labels API.
  # Keep it that way: never add a checkout of the PR head to this file.
  pull_request_target:
    types: [edited, synchronize, ready_for_review, converted_to_draft, review_requested, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: write

# One group per item for event runs, and a group of its own for the sweep. A
# single shared group would queue every event run behind the daily sweep, and
# since a group holds at most one PENDING run, a newer event would silently
# replace an older one waiting there -- for a different item. Per item that
# replacement is harmless: any one of the runs removes the label.
concurrency:
  group: stale-${{ github.event.issue.number || github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

env:
  # One label for both tracks -- filter with `is:pr label:Stale` in the UI.
  # Created automatically on first use.
  STALE_LABEL: Stale

  # Actors whose events are NOT activity, on both paths (comma-separated
  # logins, compared case-insensitively). Everyone else counts.
  #   github-actions[bot] -- this workflow itself (the stale warning, the
  #     reminder, the label) and the repo's other workflows commenting with the
  #     default token. Counting it would let the lifecycle un-stale itself.
  #     The `unstale` job's `if` repeats this one login as a literal, because
  #     the `env` context is not available there; keep the two in step.
  #   dependabot[bot] -- its automatic rebases. If they counted, a Dependabot
  #     PR could never go stale.
  IGNORED_ACTORS: 'github-actions[bot],dependabot[bot]'

  # --- Issues -------------------------------------------------------------
  ISSUE_EXEMPT_LABELS: pinned,epic,security
  ISSUE_DAYS_BEFORE_STALE: '7' # days idle before the label
  ISSUE_DAYS_AFTER_LABEL_REMIND: '7' # days AFTER the label before the reminder
  ISSUE_DAYS_AFTER_LABEL_CLOSE: '14' # days AFTER the label before closing

  # --- Pull requests ------------------------------------------------------
  PR_EXEMPT_LABELS: pinned,security
  PR_DAYS_BEFORE_STALE: '14'
  PR_DAYS_AFTER_LABEL_REMIND: '7'
  PR_DAYS_AFTER_LABEL_CLOSE: '14'
  # Draft PRs are staled too -- they are the most common source of abandoned
  # branches. Flip to 'true' to leave drafts alone.
  EXEMPT_DRAFT_PRS: 'false'

jobs:
  sweep:
    name: Mark, remind & close stale issues and PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Actions expressions have NO arithmetic operators: the supported set is
      # `!`, comparisons, `&&`, `||` and functions. `${{ a + b }}` does not
      # evaluate to a+b -- it makes the whole FILE unparseable, so the workflow
      # never starts and its scheduled run stops being created at all (#816).
      #
      # The messages below quote the windows as totals ("closed after 21 days
      # of inactivity"), matching what stage 2's own comments say, so the two
      # components still have to be added up somewhere. Doing it in shell keeps
      # `env` the single source of truth; hardcoding 14/21 as literals here
      # would silently drift the moment a threshold above is retuned.
      - name: Compute the reminder and close windows
        id: windows
        run: |
          {
            echo "issue_remind=$(( ISSUE_DAYS_BEFORE_STALE + ISSUE_DAYS_AFTER_LABEL_REMIND ))"
            echo "issue_close=$(( ISSUE_DAYS_BEFORE_STALE + ISSUE_DAYS_AFTER_LABEL_CLOSE ))"
            echo "pr_remind=$(( PR_DAYS_BEFORE_STALE + PR_DAYS_AFTER_LABEL_REMIND ))"
            echo "pr_close=$(( PR_DAYS_BEFORE_STALE + PR_DAYS_AFTER_LABEL_CLOSE ))"
          } >> "$GITHUB_OUTPUT"

      # Stage 1 -- mark inactive issues and PRs stale.
      # Closing and un-staling are handled in stage 2 (see header comment).
      - name: Mark stale issues and PRs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          # Stage 2 owns every close and every un-stale, for both tracks.
          days-before-close: -1
          days-before-pr-close: -1
          remove-stale-when-updated: false
          remove-pr-stale-when-updated: false

          days-before-stale: ${{ env.ISSUE_DAYS_BEFORE_STALE }}
          stale-issue-label: ${{ env.STALE_LABEL }}
          exempt-issue-labels: ${{ env.ISSUE_EXEMPT_LABELS }}
          stale-issue-message: >
            This issue has had no activity for
            ${{ env.ISSUE_DAYS_BEFORE_STALE }} days and is now marked
            **${{ env.STALE_LABEL }}**. It will receive one reminder at
            ${{ steps.windows.outputs.issue_remind }}
            days and be closed after
            ${{ steps.windows.outputs.issue_close }}
            days of inactivity. Any comment or update removes the
            `${{ env.STALE_LABEL }}` label and resets the clock.

          days-before-pr-stale: ${{ env.PR_DAYS_BEFORE_STALE }}
          stale-pr-label: ${{ env.STALE_LABEL }}
          exempt-pr-labels: ${{ env.PR_EXEMPT_LABELS }}
          exempt-draft-pr: ${{ env.EXEMPT_DRAFT_PRS }}
          stale-pr-message: >
            This pull request has had no activity for
            ${{ env.PR_DAYS_BEFORE_STALE }} days and is now marked
            **${{ env.STALE_LABEL }}**. It will receive one reminder at
            ${{ steps.windows.outputs.pr_remind }}
            days and be closed after
            ${{ steps.windows.outputs.pr_close }}
            days of inactivity. Pushing a commit, leaving a comment or
            submitting a review removes the `${{ env.STALE_LABEL }}` label and
            resets the clock. If you are waiting on a maintainer review, say so
            here and we will exempt it.

      # Stage 2 -- reminder, close and un-stale-on-activity, keyed off the
      # label event so the reminder comment's own updated_at bump cannot
      # corrupt the lifecycle.
      - name: Remind, close, and un-stale
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const MARK = '<!-- stale-reminder -->';
            // Earlier revisions used a day-specific marker. Still honoured when
            // deduping so an item that already received its reminder under the
            // old name is not reminded twice after this workflow changes.
            const LEGACY_MARKS = ['<!-- stale-14d-reminder -->'];
            const alreadyReminded = (c) =>
              [MARK, ...LEGACY_MARKS].some((m) => (c.body || '').includes(m));
            const DAY = 24 * 60 * 60 * 1000;
            const LABEL = process.env.STALE_LABEL;
            const IGNORED_ACTORS = new Set((process.env.IGNORED_ACTORS || '')
              .split(',').map((s) => s.trim().toLowerCase()).filter(Boolean));
            const { owner, repo } = context.repo;

            const track = (prefix, noun) => {
              const staleAfter = Number(process.env[`${prefix}_DAYS_BEFORE_STALE`]);
              const remindAfter = Number(process.env[`${prefix}_DAYS_AFTER_LABEL_REMIND`]);
              const closeAfter = Number(process.env[`${prefix}_DAYS_AFTER_LABEL_CLOSE`]);
              return {
                noun, remindAfter, closeAfter,
                remindTotal: staleAfter + remindAfter,
                closeTotal: staleAfter + closeAfter,
              };
            };
            const ISSUE = track('ISSUE', 'issue');
            const PR = track('PR', 'pull request');

            // Events that represent somebody touching the item (used to reset
            // the clock) -- a human or an App, see isIgnoredActor. The PR-only
            // entries matter: a contributor pushing commits or a maintainer
            // reviewing must count as activity even though neither produces an
            // issue comment.
            const ACTIVITY_EVENTS = new Set([
              // shared
              'commented', 'reopened', 'renamed', 'assigned', 'unassigned',
              'labeled', 'unlabeled', 'cross-referenced', 'referenced',
              'milestoned', 'demilestoned', 'converted_note_to_issue',
              // pull requests
              'committed', 'reviewed', 'line-commented', 'review_requested',
              'review_request_removed', 'ready_for_review', 'convert_to_draft',
              'converted_to_draft', 'head_ref_force_pushed', 'head_ref_restored',
              'base_ref_changed',
            ]);

            // Timeline events are NOT uniform: `reviewed` carries submitted_at,
            // `committed` carries no created_at at all (only commit author /
            // committer dates), and review-thread events nest their payload
            // under `comments`. Reading `created_at` alone silently drops every
            // push and review, which would make a busy PR look abandoned.
            const eventTime = (ev) => {
              const raw = ev.created_at
                || ev.submitted_at
                || (ev.committer && ev.committer.date)
                || (ev.author && ev.author.date)
                || (ev.comments && ev.comments[0] && ev.comments[0].created_at);
              const t = raw ? new Date(raw).getTime() : NaN;
              return Number.isNaN(t) ? null : t;
            };

            // Likewise the actor: `committed` has no actor object, just a commit
            // author name/email, so a push is matched on that name instead (a
            // bot's commits carry its login as the name, e.g. dependabot[bot]).
            // The rule is the one the `unstale` job applies: every actor counts
            // except those in IGNORED_ACTORS.
            const isIgnored = (login) => IGNORED_ACTORS.has((login || '').trim().toLowerCase());
            const isIgnoredActor = (ev) => {
              const actor = ev.actor
                || ev.user
                || (ev.comments && ev.comments[0] && ev.comments[0].user);
              if (actor) return isIgnored(actor.login);
              const name = (ev.author && ev.author.name) || (ev.committer && ev.committer.name);
              if (name) return isIgnored(name);
              return true; // unattributable event -- do not treat as activity
            };

            // One call returns both issues and PRs carrying the label.
            const flagged = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: LABEL, per_page: 100,
            });

            for (const item of flagged) {
              const isPR = Boolean(item.pull_request);
              const cfg = isPR ? PR : ISSUE;
              const tag = `#${item.number}`;

              // Timeline gives us both the authoritative label moment and every
              // subsequent activity event in one paginated call.
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number: item.number, per_page: 100,
              });

              let staleSince = null;
              for (const ev of timeline) {
                if (ev.event === 'labeled' && ev.label && ev.label.name === LABEL) {
                  const t = eventTime(ev);
                  if (t !== null && (staleSince === null || t > staleSince)) staleSince = t;
                }
              }
              if (staleSince === null) {
                core.info(`${tag}: has the ${LABEL} label but no label event; skipping`);
                continue;
              }

              // Genuine activity after the label -> un-stale and reset the clock.
              const hasActivity = timeline.some((ev) => {
                if (!ACTIVITY_EVENTS.has(ev.event)) return false;
                const t = eventTime(ev);
                if (t === null || t <= staleSince) return false;
                if ((ev.event === 'labeled' || ev.event === 'unlabeled')
                    && ev.label && ev.label.name === LABEL) return false;
                return !isIgnoredActor(ev);
              });
              if (hasActivity) {
                core.info(`${tag}: activity since stale -> removing the ${LABEL} label`);
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: item.number, name: LABEL,
                }).catch((e) => { if (e.status !== 404) throw e; });
                continue;
              }

              const ageDays = (Date.now() - staleSince) / DAY;

              // Close with a final comment.
              if (ageDays >= cfg.closeAfter) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number,
                  body: `Closing this ${cfg.noun} after ${cfg.closeTotal} days of inactivity `
                    + `(${cfg.closeAfter} days after it was marked **${LABEL}**). `
                    + (isPR
                      ? 'If you would like to continue this work, push new commits and reopen '
                        + 'it -- the branch and review history are kept.'
                      : 'If it is still relevant, please reopen it or open a new issue with '
                        + 'fresh context.'),
                });
                if (isPR) {
                  // pulls.update, not issues.update: state_reason is issue-only.
                  await github.rest.pulls.update({
                    owner, repo, pull_number: item.number, state: 'closed',
                  });
                } else {
                  await github.rest.issues.update({
                    owner, repo, issue_number: item.number,
                    state: 'closed', state_reason: 'not_planned',
                  });
                }
                core.info(`${tag}: closed ${cfg.noun} (stale ${ageDays.toFixed(1)}d)`);
                continue;
              }

              // One reminder comment (deduped by marker).
              if (ageDays >= cfg.remindAfter) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number: item.number, per_page: 100,
                });
                if (comments.some(alreadyReminded)) {
                  core.info(`${tag}: reminder already posted; skipping`);
                  continue;
                }
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number,
                  body: `${MARK}\n⏰ Second reminder: this ${cfg.noun} has been **${LABEL}** with `
                    + `no activity for ${cfg.remindTotal} days and will be closed automatically `
                    + `after ${cfg.closeTotal} days of inactivity `
                    + `(${cfg.closeTotal - cfg.remindTotal} more days) unless it is updated.`,
                });
                core.info(`${tag}: posted the ${cfg.remindTotal}-day reminder`);
              }
            }

  # Event path -- the triggering event is the activity, so there is no timeline
  # scan, no marking and no reminder/close logic here: carry the label, be
  # genuine activity, lose the label.
  unstale:
    name: Un-stale on activity
    # - Never on the sweep's own triggers.
    # - Never for the workflow's own actor. Events authored with the default
    #   GITHUB_TOKEN do not start workflows in the first place, but that is a
    #   side effect of how Actions works; this guard is the invariant. (The full
    #   IGNORED_ACTORS list is applied in the script -- `env` is unavailable in
    #   a job-level `if`, and a list cannot be split in an expression.)
    # - Never for a review on a fork PR: read-only token, see the header.
    #   Compared by name rather than `head.repo.fork` so that a PR whose fork
    #   has since been deleted (`head.repo` is null) is skipped as well.
    if: >-
      github.event_name != 'schedule'
      && github.event_name != 'workflow_dispatch'
      && github.actor != 'github-actions[bot]'
      && !(github.event_name == 'pull_request_review'
           && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      # Step-level, not job-level, because only here is `env` available: the
      # label name stays a single knob instead of a second hardcoded literal.
      # An item that is not stale -- nearly every event -- ends here.
      - name: Remove the stale label
        if: >-
          contains(github.event.issue.labels.*.name, env.STALE_LABEL)
          || contains(github.event.pull_request.labels.*.name, env.STALE_LABEL)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const LABEL = process.env.STALE_LABEL;
            const IGNORED_ACTORS = new Set((process.env.IGNORED_ACTORS || '')
              .split(',').map((s) => s.trim().toLowerCase()).filter(Boolean));
            const { owner, repo } = context.repo;
            const { payload } = context;
            const item = payload.issue || payload.pull_request;
            const tag = `#${item.number}`;
            const what = `${context.eventName}.${payload.action}`;

            // The stale label being added or removed is the lifecycle itself,
            // not activity. Without this, labelling an item by hand would strip
            // the label in the very run that labelling started.
            if ((payload.action === 'labeled' || payload.action === 'unlabeled')
                && payload.label && payload.label.name === LABEL) {
              core.info(`${tag}: ${what} is the ${LABEL} label itself; not activity`);
              return;
            }

            if (IGNORED_ACTORS.has((context.actor || '').toLowerCase())) {
              core.info(`${tag}: ${what} by ${context.actor} (ignored actor); not activity`);
              return;
            }

            core.info(`${tag}: ${what} by ${context.actor} -> removing the ${LABEL} label`);
            await github.rest.issues.removeLabel({
              owner, repo, issue_number: item.number, name: LABEL,
            }).catch((e) => { if (e.status !== 404) throw e; });
