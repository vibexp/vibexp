name: Release

# Builds and pushes the single combined VibeXP image (issue #61) to GitHub
# Container Registry when a GitHub Release is published with a `v*` tag
# (e.g. v0.1.0). The image (ghcr.io/vibexp/vibexp) embeds the built frontend SPA
# into the Go backend and serves both from one port — the one-command self-host
# model (`docker run ghcr.io/vibexp/vibexp`).
#
# This replaces the previous split backend/frontend release workflows: the
# frontend is no longer published as a separate image. Pushes
# ghcr.io/vibexp/vibexp:<version> and, when the version is the highest published
# non-prerelease semver, :latest (which docker-compose.yml tracks) — see the
# "Decide whether this build moves :latest" step for why "newest" and "not a
# prerelease" are not the same test once patch releases exist (#747).
#
# workflow_dispatch is a manual escape hatch: provide `version` to build/push
# from the current ref without a release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vibexp/vibexp

jobs:
  release:
    name: Build & push combined image
    runs-on: ubuntu-latest
    # On a release, only run for v-prefixed tags; always run on dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${TAG#v}}"
          if [ -z "$version" ]; then
            echo "::error::Could not resolve a version (tag '$TAG', input '$INPUT')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE_NAME:$version"

      # `:latest` must point at the NEWEST release, which is not the same thing
      # as "not a prerelease" (issue #747). Once patch releases are cut from a
      # `release/X.Y.x` line branch, publishing v0.9.1 AFTER v0.10.0 is already
      # out is an ordinary backport — and the old `enable=prerelease == false`
      # spelling would have moved `:latest` BACKWARDS to the older image, which
      # docker-compose.yml tracks. Every self-hoster on the one-command path
      # would silently downgrade on their next pull.
      #
      # So compare against what is actually published: `:latest` moves only when
      # this version is the highest non-prerelease semver. Ties (a rebuild of the
      # current newest release) still move it, which is what you want.
      - name: Decide whether this build moves :latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          # Empty on workflow_dispatch (no github.event.release), which is the
          # intended fall-through to the semver comparison below.
          if [ "$PRERELEASE" = "true" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "- \`:latest\`: **not moved** — $VERSION is a prerelease." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `|| true` so a repo with no releases yet (or a transient read error
          # under `set -o pipefail`) yields an empty list rather than aborting;
          # an empty list makes VERSION trivially the highest, which is correct
          # for the very first release.
          published="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
              --json tagName,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease == false and .isDraft == false) | .tagName' \
            | sed 's/^v//' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; })"

          # sort -V orders X.Y.Z numerically (10 > 9, unlike a lexical sort).
          highest="$(printf '%s\n%s\n' "$published" "$VERSION" \
            | { grep -v '^$' || true; } | sort -V | tail -1)"

          if [ "$highest" = "$VERSION" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
            echo "- \`:latest\` -> **$VERSION** (highest published version)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "- \`:latest\`: **not moved** — $VERSION is a backport; $highest is newer." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # QEMU is used only for the lightweight per-arch runtime stage (the alpine
      # `apk add`); the heavy frontend/Go build stages run natively on the runner
      # via --platform=$BUILDPLATFORM (see backend/Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest == 'true' }}

      # Build context is the repo root so the Dockerfile can build the frontend
      # SPA and embed it into the Go backend (see backend/Dockerfile).
      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            RELEASE_DATE=${{ steps.builddate.outputs.date }}
            VITE_RELEASE_SHA=${{ github.sha }}
            VITE_RELEASE_DATE=${{ steps.builddate.outputs.date }}
          provenance: true

  # Every platform release verifies the RELEASED CLI against the image it just
  # published (issue #448). Same cross-repo pattern as publish-api-client.yml:
  # the default GITHUB_TOKEN cannot trigger a workflow in another repo, so mint a
  # short-lived "VibeXP Bot" installation token scoped to vibexp/cli.
  #
  # This is a job in THIS workflow rather than a standalone `release: published`
  # workflow on purpose: the CLI e2e pulls ghcr.io/vibexp/vibexp:<version>, which
  # does not exist until the build above finishes (multi-arch buildx, minutes).
  # `needs: release` gives that ordering from the job graph, with no polling.
  #
  # Dispatch-and-link only — the CLI verdict is deliberately NOT awaited here. A
  # failing CLI e2e is post-release compatibility signal, and this job runs after
  # the image is already pushed, so it can never fail or roll back a release.
  dispatch-cli-e2e:
    name: Dispatch vibexp/cli e2e
    runs-on: ubuntu-latest
    needs: release
    # Narrower than the workflow-level default: this job pushes nothing to GHCR
    # and never uses GITHUB_TOKEN — every gh call below authenticates with the
    # scoped app token — so it has no business inheriting `packages: write`.
    permissions:
      contents: read
    # Only for a real published v* release. A manual workflow_dispatch of this
    # workflow has no github.event.release, so this evaluates false and an
    # escape-hatch build never dispatches downstream. Prereleases DO dispatch —
    # an RC is exactly when the compatibility signal is most useful.
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}

    steps:
      # app-id accepts the App's client id (VIBEXP_BOT_APP_CLIENT_ID).
      - name: Mint app token for cli
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.VIBEXP_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.VIBEXP_BOT_APP_PRIVATE_KEY }}
          owner: vibexp
          repositories: cli

      - name: Dispatch CLI e2e and link the run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # Verify the released CLI, never main. vibexp/cli is public, so the
          # release and contents reads below need no extra app permission beyond
          # the Actions scope the dispatch itself requires.
          cli_tag="$(gh release view --repo vibexp/cli --json tagName -q .tagName)"
          if [ -z "$cli_tag" ]; then
            echo "::error::vibexp/cli has no published release to verify against."
            exit 1
          fi
          echo "Verifying CLI $cli_tag against image $version."

          # A workflow_dispatch --ref <tag> runs ci.yml AS OF THAT TAG. If a
          # future CLI release drops the input, dispatching would fail opaquely,
          # so skip loudly instead and keep the release green.
          #
          # Fetch and test SEPARATELY. Piping the fetch straight into grep would
          # make a failed read (403 from a missing app grant, a transient error)
          # look identical to "the input is absent" under `pipefail` — the
          # release would go green reporting a benign skip while the
          # compatibility check silently never ran.
          if ! ci_yml="$(gh api \
                "repos/vibexp/cli/contents/.github/workflows/ci.yml?ref=$cli_tag" \
                -q .content | base64 -d)"; then
            echo "::error::Could not read .github/workflows/ci.yml at vibexp/cli@$cli_tag."
            exit 1
          fi

          if ! grep -q platform_image_tag <<<"$ci_yml"; then
            echo "::notice::CLI release $cli_tag has no platform_image_tag input; skipping the compatibility e2e."
            {
              echo "- CLI e2e: **skipped** — release \`$cli_tag\` predates the \`platform_image_tag\` input."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Remember the newest existing dispatch run so the one we create can be
          # told apart from an older (or concurrent human) dispatch.
          before="$(gh run list --repo vibexp/cli --workflow ci.yml \
                      --event workflow_dispatch -L 1 --json databaseId \
                      -q '.[0].databaseId // 0')"

          gh workflow run ci.yml --repo vibexp/cli --ref "$cli_tag" \
            -f platform_image_tag="$version"
          echo "Dispatched vibexp/cli ci.yml (ref=$cli_tag, platform_image_tag=$version)."

          # Resolve the run so the release summary carries a clickable link.
          # `select(. != null)` matters: with no prior dispatch run at all (the
          # state before the first automated release) an unguarded
          # '.[0] | "\(.databaseId)"' yields the STRING "null null", which then
          # compares unequal to $before and would publish a bogus link.
          run_url=""
          for _ in $(seq 12); do
            sleep 5
            latest="$(gh run list --repo vibexp/cli --workflow ci.yml \
              --event workflow_dispatch -L 1 --json databaseId,url \
              -q '.[0] | select(. != null) | "\(.databaseId) \(.url)"')"
            [ -n "$latest" ] || continue
            read -r run_id run_url <<<"$latest"
            if [ "$run_id" != "$before" ]; then break; fi
            run_url=""
          done

          if [ -n "$run_url" ]; then
            echo "- CLI e2e: $run_url (cli \`$cli_tag\` vs image \`$version\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            # The dispatch itself succeeded; only the lookup timed out.
            echo "::warning::Dispatched, but the CLI run did not appear within 60s. See the Actions tab of vibexp/cli."
            echo "- CLI e2e: dispatched (cli \`$cli_tag\` vs image \`$version\`), run link unresolved" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Turn the two plausible permission failures — app not installed on
      # vibexp/cli, or installed without Actions: read & write — into an explicit
      # remediation instead of an opaque 403. Same posture as project-board.yml.
      - name: Explain a dispatch failure
        if: failure()
        run: |
          echo "::error::Could not dispatch the vibexp/cli e2e. Install the 'VibeXP Bot' GitHub App on vibexp/cli with Repository -> Actions: read & write (secrets VIBEXP_BOT_APP_CLIENT_ID / VIBEXP_BOT_APP_PRIVATE_KEY already exist on this repo). The platform image for this release is already published — this job runs after the build and never affects it."
