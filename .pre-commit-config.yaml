repos:
  # ------------------------------------------------------------------
  # Backend hooks (Go)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: gofmt-check
        name: gofmt check
        entry: bash -c 'make backend-format'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'make backend-lint'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: go-vulncheck
        name: go vulnerability check
        entry: bash -c 'make backend-vulncheck'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: go-security
        name: go security scan
        entry: bash -c 'make backend-security'
        language: system
        files: ^backend/
        pass_filenames: false

      - id: openapi-validate
        name: OpenAPI validation
        entry: bash -c 'make backend-validate-openapi'
        language: system
        files: ^backend/(openapi\.yaml|paths/.*\.ya?ml|schemas/.*\.ya?ml)$
        pass_filenames: false

      - id: openapi-bundle-check
        name: OpenAPI embedded bundle drift (#139)
        # Regenerate the committed bundle served at /openapi.{yaml,json} and fail
        # if it drifts from the split source. Triggered by spec-source edits and
        # by hand-edits to the committed bundle itself.
        entry: bash -c 'make backend-openapi-bundle-check'
        language: system
        files: ^backend/(openapi\.yaml|paths/.*\.ya?ml|schemas/.*\.ya?ml|internal/server/openapispec/openapi\.bundled\.(ya?ml|json))$
        pass_filenames: false

      - id: no-os-getenv
        name: Block os.Getenv usage in backend
        # Block os.Getenv - use the config package instead.
        # Excluded: test files and testutils directory (use test helpers).
        entry: 'os\.Getenv'
        language: pygrep
        types: [text]
        files: ^backend/
        exclude: ^backend/(.*_test\.go|.*/testutils/.*|testutils/.*)$

  # ------------------------------------------------------------------
  # Frontend hooks (TypeScript/React)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: frontend-lint-staged
        name: frontend lint-staged (format & fix)
        entry: bash -c 'cd frontend && npx lint-staged'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend type-check
        entry: bash -c 'cd frontend && npm run type-check'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: frontend test
        entry: bash -c 'cd frontend && npm run test'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-build
        name: frontend build
        entry: bash -c 'cd frontend && npm run build'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-security
        name: frontend security scan
        entry: bash -c 'cd frontend && npm run security:scan'
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-audit
        name: frontend dependency audit
        # Same Make target CI runs, so hook and CI share one definition (#547).
        entry: bash -c 'make frontend-audit'
        language: system
        files: ^frontend/package-lock\.json$
        pass_filenames: false

      - id: frontend-complexity
        name: frontend complexity check
        entry: bash -c 'cd frontend && npm run complexity:check'
        language: system
        files: ^frontend/
        pass_filenames: false

  # ------------------------------------------------------------------
  # GitHub Actions workflow validation (#816)
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: actionlint
        name: GitHub Actions workflow lint
        # Same Make target the CI `workflows` job runs, so hook and CI share one
        # definition and one pinned actionlint (#547's pattern). An invalid
        # workflow fails at STARTUP with no logs and silently stops producing
        # its scheduled runs — `stale.yml` was dead for days that way (#816).
        entry: bash -c 'make lint-workflows'
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false

  # ------------------------------------------------------------------
  # Security: Secret Detection
  # ------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # ------------------------------------------------------------------
  # General & Policy Hooks
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # 1MB: npm lockfiles (~600KB) and other large assets exceed the
        # 500KB default.
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: check-case-conflict
      - id: check-json
        # Exclude tsconfig files — TypeScript conventionally allows JSONC
        # (JSON with comments) in tsconfig*.json.
        exclude: (^|/)tsconfig(\..+)?\.json$

  # ------------------------------------------------------------------
  # Policy: Block nolint / eslint-disable comments
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-nolint-comments
        name: Block nolint comments
        entry: '//.*nolint'
        language: pygrep
        types: [text]
        # Exclude: this config, workflow files, test files, generated files,
        # and complex services/repositories with intentional suppressions.
        exclude: ^(vendor/|\.pre-commit-config\.yaml$|\.github/workflows/.*\.ya?ml$|.*_test\.go$|backend/internal/container/wire.*\.go$|backend/internal/container/providers/.*\.go$|backend/internal/repositories/postgres/.*\.go$|backend/internal/services/.*\.go$|backend/internal/server/.*\.go$|backend/internal/errors/.*\.go$|backend/internal/external/.*\.go$|backend/pkg/events/.*\.go$)
      - id: no-eslint-disable
        name: Block eslint-disable comments (Frontend only)
        # Matches 'eslint-disable', 'eslint-disable-line', 'eslint-disable-next-line'
        entry: 'eslint-disable'
        language: pygrep
        types: [text]
        # Restrict to the frontend directory.
        files: ^frontend/
        # Exclude: test files.
        exclude: ^frontend/.*\.test\.(ts|tsx)$

  # ------------------------------------------------------------------
  # Policy: Documentation lives in vibexp/docs, not in a docs/ directory here
  # ------------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-docs-directory
        name: Block files under docs/ (documentation lives in vibexp/docs)
        entry: >-
          Documentation does not live in this repo. Add it to
          https://github.com/vibexp/docs instead (published at docs.vibexp.io).
        language: fail
        # Anchored at the repo root ON PURPOSE (#608): this blocks a
        # top-level docs/ tree only. Package-level docs that live next to the
        # code they describe — backend/docs/, frontend/docs/, and any
        # README.md — are the sanctioned exception and must NOT trip this.
        files: ^docs/
